name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["master", "main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  MISE_EXPERIMENTAL: true
jobs:
  ci:
    runs-on: ubuntu-latest
    # ~20 min of checks (`ci:checks`); the formal models run in the `formal` job and the impaired-network
    # scenarios once, in the `netsim` job.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so `mise run scan:secrets` (gitleaks) can scan all commits
      # Restore Go caches BEFORE mise-action (go-installed tools create read-only
      # files; restoring after would fail with "Cannot open: File exists").
      - name: Cache Go & tool caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
            ~/.cache/grype/db
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      # Wails v3 builds on GTK4 / WebKitGTK 6.0 with cgo (ADR 0003, 0009) — needed before
      # mise installs the wails3 CLI and before any Go build.
      - name: Install GTK4 / WebKitGTK 6.0, and the validators of `mise run pkg:lint`
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev \
            desktop-file-utils appstream libxml2-utils shared-mime-info groff strace
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      # typst and tinymist (pinned in internal/sidecar/manifest.json) are fetched by
      # `mise run sidecar:fetch`, a dependency of the test tasks; keep them between runs.
      - name: Cache the sidecar binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            internal/sidecar/bin/**/*.gz
            ~/.cache/inkwell/sidecar-dl
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/sidecar/manifest.json') }}
      - name: Trace pinned sidecars on PM-1
        run: mise run sidecar:trace
      - name: Keep seccomp trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seccomp-traces
          path: gates/L1/ci-seccomp-traces/
          retention-days: 7
      # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor; the sidecar sandbox and its
      # tests need them (as in the netsim and sidecars-arm64 jobs).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: mise run ci:checks # the formal models run in the parallel `formal` job
      - name: Build the desktop app (Linux)
        run: mise run app:build
      - name: End-to-end (two instances, Playwright/WebKit)
        run: mise run e2e
      - name: Keep Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  # The TLA+ and Alloy models with their mutants (`mise run formal`) took about 25 min alone on a 4-vCPU runner
  # (run 43961568931, 2026-11-16), which pushed the ci job past its 35 min: they run here, in parallel.
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Cache the TLA+ and Alloy tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/inkwell
          key: ${{ runner.os }}-formal-${{ hashFiles('scripts/tla-check.sh', 'scripts/alloy_check.py') }}
          restore-keys: ${{ runner.os }}-formal-
      # Only mise itself: the models need Java and Python, which the runner has; installing every tool would build
      # wails3, which needs GTK4 and WebKitGTK (run 43978292467).
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install: false
      - run: mise run formal
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
  # Two instances behind NATs and a public relay, in network namespaces created without
  # root by the script itself (scripts/netsim); the same command runs locally.
  netsim:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      INKWELL_E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Cache Go & tool caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install GTK4 / WebKitGTK 6.0
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install the network tools
        run: sudo apt-get install -y socat nftables bison flex pkg-config
      # `tc netem ... seed` (every impaired scenario seeds its qdiscs) needs iproute2 6.6.0; Ubuntu 24.04
      # ships 6.1.0 ("What is "seed"?"). The pinned release (SHA-256 checked) is built once, cached by
      # the script that pins it, and its tc is put first on PATH.
      - name: Cache the pinned iproute2
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/inkwell-iproute2
          key: ${{ runner.os }}-${{ runner.arch }}-iproute2-${{ hashFiles('scripts/netsim/build-iproute2.sh') }}
      - name: Build the pinned iproute2 (tc with netem seed)
        run: |
          scripts/netsim/build-iproute2.sh "$HOME/.cache/inkwell-iproute2"
          echo "$HOME/.cache/inkwell-iproute2/sbin" >> "$GITHUB_PATH"
          echo "TC_LIB_DIR=$HOME/.cache/inkwell-iproute2/lib/tc" >> "$GITHUB_ENV"
      # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      # sch_netem (traffic impairment) is in the extra kernel modules of the runner image, and a user
      # namespace cannot load a module: the job loads it, with nf_tables (scripts/netsim checks both).
      - name: Load the netem and nftables kernel modules
        run: |
          sudo apt-get install -y -qq iproute2
          # The extra-modules package is needed only where the image does not ship sch_netem, and it
          # does not exist for every runner kernel: install it only when the module is missing.
          sudo modprobe sch_netem || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
          sudo modprobe nf_tables
      - name: Network simulation (cone and symmetric NAT, offline, change of network)
        run: mise run e2e:netsim
      - name: Impaired network (bad Wi-Fi, blackout, slow relay, three-device mesh)
        run: mise run e2e:netsim:impaired
      - name: Keep Playwright traces and instance logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: netsim-traces
          path: |
            frontend/test-results/
            .task/netsim/
          retention-days: 7
  # typst and tinymist are shipped for arm64 too: the same tests on a native arm64 runner
  # (the pinned archives are the aarch64 builds; nothing is cross-compiled or emulated).
  sidecars-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cache the sidecar binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            internal/sidecar/bin/**/*.gz
            ~/.cache/inkwell/sidecar-dl
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/sidecar/manifest.json') }}
      - name: Fetch the pinned sidecars (SHA-256 verified)
        run: go run ./cmd/sidecar-fetch
      # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor; the sandbox needs them.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Sidecar and Typst tests (arm64)
        run: go test -race -count=1 ./internal/sidecar/... ./internal/typst/... ./cmd/sidecar-fetch/...
  # The release itself is .github/workflows/release.yml (tags v*; ADR 0025).
