name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["master", "main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  MISE_EXPERIMENTAL: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so `mise run scan:secrets` (gitleaks) can scan all commits
      # Restore Go caches BEFORE mise-action (go-installed tools create read-only
      # files; restoring after would fail with "Cannot open: File exists").
      - name: Cache Go & tool caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
            ~/.cache/grype/db
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      # Wails v3 builds on GTK4 / WebKitGTK 6.0 with cgo (ADR 0003, 0009) — needed before
      # mise installs the wails3 CLI and before any Go build.
      - name: Install GTK4 / WebKitGTK 6.0, and the validators of `mise run pkg:lint`
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev \
            desktop-file-utils appstream libxml2-utils shared-mime-info groff
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      # typst and tinymist (pinned in internal/sidecar/manifest.json) are fetched by
      # `mise run sidecar:fetch`, a dependency of the test tasks; keep them between runs.
      - name: Cache the sidecar binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            internal/sidecar/bin/**/*.gz
            ~/.cache/inkwell/sidecar-dl
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/sidecar/manifest.json') }}
      - run: mise run ci
      - name: Build the desktop app (Linux)
        run: mise run app:build
      - name: End-to-end (two instances, Playwright/WebKit)
        run: mise run e2e
      - name: Keep Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  # Two instances behind NATs and a public relay, in network namespaces created without
  # root by the script itself (scripts/netsim); the same command runs locally.
  netsim:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      INKWELL_E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Cache Go & tool caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install GTK4 / WebKitGTK 6.0
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install the network tools
        run: sudo apt-get install -y socat nftables
      # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Network simulation (cone and symmetric NAT, offline, change of network)
        run: mise run e2e:netsim
      - name: Keep Playwright traces and instance logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: netsim-traces
          path: |
            frontend/test-results/
            .task/netsim/
          retention-days: 7
  # typst and tinymist are shipped for arm64 too: the same tests on a native arm64 runner
  # (the pinned archives are the aarch64 builds; nothing is cross-compiled or emulated).
  sidecars-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Cache the sidecar binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            internal/sidecar/bin/**/*.gz
            ~/.cache/inkwell/sidecar-dl
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/sidecar/manifest.json') }}
      - name: Fetch the pinned sidecars (SHA-256 verified)
        run: go run ./cmd/sidecar-fetch
      - name: Sidecar and Typst tests (arm64)
        run: go test -race -count=1 ./internal/sidecar/... ./internal/typst/... ./cmd/sidecar-fetch/...
  # The release itself is .github/workflows/release.yml (tags v*; ADR 0025).
