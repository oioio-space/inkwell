\* Block RF1, README "RelayFanout": four members, two behind origin 1 (a relay) and two behind origin 2 (a home
\* router); a stranger floods origin 1 forever; the node dials. S1-S9; liveness L1.
SPECIFICATION Spec
CONSTANTS
  Members = {1, 2, 3, 4}
  Byz = {}
  Origins = {1, 2}
  Via <- ViaSplit
  AttOrigins = {1}
  MaxAtt <- Unbounded
  P = 2
  Q = 4
  B = 2
  MemberCap = 9
  PerCap = 4
  MaxCloses = 1
  Dials = TRUE
  Late = {}
INVARIANTS
  TypeOK
  OriginBound
  GlobalBound
  RateBound
  MembersSpendNoRate
  MemberCapBound
  SharesKept
  InJustified
  OutNeverRefused
  AuthNeverRefused
PROPERTIES
  MembersEventuallyUp
CHECK_DEADLOCK FALSE
