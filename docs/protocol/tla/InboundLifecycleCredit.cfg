\* Block PU1c, README "InboundLifecycle": the shared QUIC credit (P-13). The sync lane's honest session stream is the
\* head; a second sync stream and both bulk streams are filled to their window by any opener before the head writes
\* (the waiting credit exhausted), the bulk consumer stalls (the bulk head blocks, holding its window). The head must
\* still deliver every frame: HeadProgresses.
SPECIFICATION Spec
CONSTANTS
  Sync = {1, 2}
  Bulk = {3, 4}
  Cap = 2
  Win = 2
  Budget = 1
  ProbeMax = 1
  MaxFrames = 2
  MaxMoves = 0
  HonestLanes = {"sync"}
  Byz = {}
  Greedy = {2, 3, 4}
  FairConsumers = {"sync"}
  Stall = FALSE
  MaxDrops = 0
INVARIANTS
  TypeOK
  Places
  WaitNoBudget
  ReservationsReturned
  ArrivingHoldsNothing
PROPERTIES
  HeadProgresses
CHECK_DEADLOCK FALSE
