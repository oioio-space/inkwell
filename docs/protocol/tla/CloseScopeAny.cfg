\* Block PU1d, README "CloseScope": two connections both sides keep, the protocol cached (libp2p's lazy path), one
\* Drop/re-admission (refusals), no move, any timing (a deadline may fire on an honest exchange: a stalled relay or a
\* dead link). Invariants (safety run): PeerUpAck's S1-S4, S6 CrossedIndependent, S7 OpeningNamed; liveness: CloseScopeLive.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 1
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  Moves = FALSE
  CrashBy = {}
INVARIANTS
  TypeOK
  TypeS
  UpAfterAccept
  SessionOnAccepted
  NoUpOnRefused
  Budget
  CrossedIndependent
  OpeningNamed
CHECK_DEADLOCK FALSE
