\* Block SP1 (SP1-3), the reader's partialTTL (120 s) against a silence of the bottleneck as long as WriteIdle (90 s) during the paste. The path has no yamux write valve (Tw 1000: direct QUIC, as NI-2; QUIC's idle timeout, not modelled, would end the session first), so that only the two timers of SP1-3 meet: the reader never drops a partial message its sender has not given up (NoSilentDrop). Such a silence may cut the sender (beyond the contract; rule L applies). Twin of the mutant SP1PartialTTLAtIdle.
\* README "SendPath" / "SP1". One unit = 8 KiB (C); one tick = C / the link rate.
