\* Block PU1b, README "SyncOrder": an honest opener; a move from the relay to the direct connection (the old stream closed for
\* writing, drained), the direct connection dropping, a reopen on the relay: drain + replacement + reconnect, so a
\* capacity refusal, its backoff and its retry are reached (SyncOrderWitnessBusy). Honest timing (the budget is longer
\* than any honest drain). Invariants and liveness.
SPECIFICATION Spec
CONSTANTS
  Streams = {1, 2, 3}
  Cap = 2
  MaxFrames = 3
  Byzantine = FALSE
  Stall = FALSE
  MaxDrops = 1
  D = 3
  HonestTiming = TRUE
INVARIANTS
  TypeOK
  Places
  Order
  SessionKept
  Budget
PROPERTIES
  AllDelivered
  SessionResumes
  EmptyLeaves
CHECK_DEADLOCK FALSE
