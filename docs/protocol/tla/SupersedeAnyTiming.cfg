\* Block HP1c, README "Supersede": two connections, one close at will, one stream per node, no move, any timing (a deadline may close the newer connection after its ACK)
\* (a live connection may miss T_vie: LiveKept is not claimed). Invariants (safety run).
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 1
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  LearnFair = FALSE
  Moves = FALSE
  CrashBy = {"a", "b"}
INVARIANTS
  TypeOK
  TypeS
  UpAfterAccept
  SessionOnAccepted
  NoUpOnRefused
  Budget
  SupersededBounded
  FallbackKept
  NeverCloseSole
CHECK_DEADLOCK FALSE
