\* Block PU1b, README "SyncOrder": a Byzantine opener opens, writes, ends, resets and holds streams at will (it holds a first
\* stream open and resets, or ends without a frame, the following ones); a waiting stream may give the order up
\* (Stall). Places stay bounded and a stream that ended without a frame never keeps its place (EmptyLeaves).
SPECIFICATION Spec
CONSTANTS
  Streams = {1, 2, 3}
  Cap = 2
  MaxFrames = 1
  Byzantine = TRUE
  Stall = TRUE
  MaxDrops = 0
  D = 1
  HonestTiming = FALSE
INVARIANTS
  TypeOK
  Places
PROPERTIES
  EmptyLeaves
CHECK_DEADLOCK FALSE
