  Conns = {1}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 0
  CachedInit = {TRUE, FALSE}
  AdmitInit = {TRUE}
  Silent = TRUE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = TRUE
  TickFair = TRUE
INVARIANTS
  TypeOK
  UpAfterAccept
  SessionOnAccepted
  NoUpOnRefused
  Budget
PROPERTIES
  OpenResolves
  MoveResolves
