\* Block HP1c (plan docs/plans/2026-11-23-hp1-reformalize.md §2), README "Supersede": two connections, either side may
\* close one without the other knowing (a crash: the half-open state), lazy path, no move (the session reopens), honest
\* timing (a peer that holds a connection answers its ping within T_vie). PeerUpAck's S1-S4 and P15-1..P15-4
\* (safety run; the liveness is SupersedeLive's).
