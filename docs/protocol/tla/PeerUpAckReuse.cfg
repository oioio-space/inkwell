\* Block PU1, README "PeerUpAck": streams reused on one connection: a move abandoned at its deadline while its ACK is
\* in flight, then a new move on the same connection (three streams per node), any timing. Invariants (safety run):
\* an ACK counts only for its own stream (S2).
SPECIFICATION Spec
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 3
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
INVARIANTS
  TypeOK
  UpAfterAccept
  SessionOnAccepted
  NoUpOnRefused
  Budget
CHECK_DEADLOCK FALSE
