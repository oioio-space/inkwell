\* Block RF1, README "RelayFanout": three members behind origin 1 connect inbound only (the node does not dial), a
\* stranger opens two connections through that origin and stops. S1-S9; liveness L1.
SPECIFICATION Spec
CONSTANTS
  Members = {1, 2, 3}
  Byz = {}
  Origins = {1}
  Via <- ViaOne
  AttOrigins = {1}
  MaxAtt = 2
  P = 2
  Q = 3
  B = 2
  MemberCap = 6
  PerCap = 4
  MaxCloses = 1
  Dials = FALSE
  Late = {}
INVARIANTS
  TypeOK
  OriginBound
  GlobalBound
  RateBound
  MembersSpendNoRate
  MemberCapBound
  SharesKept
  InJustified
  OutNeverRefused
  AuthNeverRefused
PROPERTIES
  MembersEventuallyUp
CHECK_DEADLOCK FALSE
