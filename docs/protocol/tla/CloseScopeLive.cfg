\* Block PU1d, README "CloseScope": two connections both sides keep; b's side of one may close without a knowing (a
\* crash, a dead link; the other side is the same by symmetry); the session's connection is lost while the other one
\* stays, with no connectedness event; honest timing, time passes. S6, S7; liveness: L3 NeverStranded, PeerUpAck's L2.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = TRUE
  TickFair = TRUE
  Moves = FALSE
  CrashBy = {"b"}
INVARIANTS
  TypeOK
  TypeS
  UpAfterAccept
  SessionOnAccepted
  NoUpOnRefused
  Budget
  CrossedIndependent
  OpeningNamed
PROPERTIES
  NeverStranded
  OpenResolves
CHECK_DEADLOCK FALSE
