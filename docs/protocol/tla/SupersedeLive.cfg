\* Block HP1c, README "Supersede": SupersedeHonest's constants, only b's side of a connection may close (a's view of a
\* crash of b; the other side is the same by symmetry), no idle timeout assumed (LearnFair = FALSE). Liveness P15-5: a
\* session on a dead connection under proof leaves it, by P-15 alone.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = TRUE
  TickFair = TRUE
  LearnFair = FALSE
  Moves = FALSE
  CrashBy = {"b"}
INVARIANTS
  TypeOK
  TypeS
  SupersededBounded
  LiveKept
PROPERTIES
  SessionLeavesDead
CHECK_DEADLOCK FALSE
