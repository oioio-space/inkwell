\* Block PU1c, README "InboundLifecycle": a Byzantine opener (opens, whole and partial frames, FIN, reset,
\* RESET_STREAM_AT, holds) on two streams of one lane (a head and a waiting stream), a probe of one unit, a consumer that may stall, a
\* waiting stream that may give the order up, one loss of the connection: every lifecycle state meets every end kind.
\* The rules are lane-parametric (a stream's lane only picks its order, budget and consumer), so one lane covers both;
\* the lanes' interaction (one shared credit, two orders at once) is checked by Honest and Credit, which instantiate both.
SPECIFICATION Spec
CONSTANTS
  Sync = {1, 2}
  Bulk = {}
  Cap = 2
  Win = 2
  Budget = 1
  ProbeMax = 1
  MaxFrames = 2
  MaxMoves = 0
  HonestLanes = {}
  Byz = {"sync", "bulk"}
  Greedy = {}
  FairConsumers = {}
  Stall = TRUE
  MaxDrops = 1
INVARIANTS
  TypeOK
  Places
  WaitNoBudget
  ReservationsReturned
  FinFramesDelivered
PROPERTIES
  EmptyLeaves
  NoBlindWait
  BlockedFreed
CHECK_DEADLOCK FALSE
