\* Block PU1, README "PeerUpAck": the closed-at-once trace. Two connections; the second may be closed by a side at
\* its registration (a late link it does not keep) while the other side registers it with the peer's protocol cached
\* (libp2p's lazy path); a close at will, a Drop/re-admission; the move; any timing (the deadline may fire while
\* bytes are in flight). Invariants (safety run); its liveness is PeerUpAckLateLive's.
SPECIFICATION Spec
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {2}
  MaxCloses = 1
  MaxFlips = 1
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
INVARIANTS
  TypeOK
  UpAfterAccept
  SessionOnAccepted
  NoUpOnRefused
  Budget
CHECK_DEADLOCK FALSE
