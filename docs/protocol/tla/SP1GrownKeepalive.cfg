\* Block SP1, SP1Grown90 with the keepalive on (every 30 s, any phase) and the ping timeouts at the decided 120 s (90 ticks): a ping sent behind a grown 512 KiB window at 6 KiB/s is answered in time. A residual at 90 s (67 ticks fail), closed by D-SP1-1; D-SP1-2 pins the window anyway, so this is a margin, not a claim of the rule.
\* README "SendPath" / "SP1". One unit = 8 KiB (C); one tick = C / the link rate.
