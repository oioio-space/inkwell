\* Block PC1 (ADR 0043 part 2), N35: macOS and Windows, a new process that claims the profile lock
\* while the old one exits; a take-over or a join, one crash, one failed step, three process images.
\* java -cp tla2tools.jar tlc2.TLC -workers 2 -config ProjectChangeSpawn.cfg ProjectChange
SPECIFICATION Spec
CONSTANTS
  Platform = "spawn"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
INVARIANTS
  TypeOK
  NoOldStateAfterChange
  NewStateSurvives
  RestartOnce
  OpensAfterCrash
  WriteBeforeRestart
  JoinOnce
  OneImage
  NoticeMatchesStanding
PROPERTIES
  ChangeCompletes
CHECK_DEADLOCK FALSE
