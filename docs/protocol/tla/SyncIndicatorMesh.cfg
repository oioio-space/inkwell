\* W33 honest sync indicator, two remote peers (global rule over every connected member).
\* Losses are covered by SyncIndicator.cfg; MaxLoss 1 here exceeds a million distinct states.
\* java -cp tla2tools.jar tlc2.TLC -config SyncIndicatorMesh.cfg SyncIndicator
SPECIFICATION Spec
CONSTANTS
  Me = me
  Peers = {p1, p2}
  MaxEdits = 1
  MaxLoss = 0
  MaxDown = 1
  QMax = 1
INVARIANTS
  TypeOK
  TheirSound
  PeerHonest
  GlobalHonest
PROPERTIES
  EventuallySynced
CHECK_DEADLOCK FALSE
