\* Block RF1, README "RelayFanout": three honest members behind origin 1 (a relay, or a home router), a Byzantine
\* member taking every connection the rule allows, a stranger flooding origins 1 and 2 forever, the node dials.
\* S1-S9; liveness L1.
SPECIFICATION Spec
CONSTANTS
  Members = {1, 2, 3, 4}
  Byz = {4}
  Origins = {1, 2}
  Via <- ViaOne
  AttOrigins = {1, 2}
  MaxAtt <- Unbounded
  P = 2
  Q = 3
  B = 2
  MemberCap = 9
  PerCap = 4
  MaxCloses = 1
  Dials = TRUE
  Late = {}
INVARIANTS
  TypeOK
  OriginBound
  GlobalBound
  RateBound
  MembersSpendNoRate
  MemberCapBound
  SharesKept
  InJustified
  OutNeverRefused
  AuthNeverRefused
PROPERTIES
  MembersEventuallyUp
CHECK_DEADLOCK FALSE
