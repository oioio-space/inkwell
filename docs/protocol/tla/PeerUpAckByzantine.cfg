  CachedInit = {TRUE, FALSE}
  AdmitInit = {TRUE, FALSE}
  Silent = TRUE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = TRUE
  TickFair = FALSE
INVARIANTS
  TypeOK
  UpAfterAccept
  SessionOnAccepted
  NoUpOnRefused
  Budget
CHECK_DEADLOCK FALSE
