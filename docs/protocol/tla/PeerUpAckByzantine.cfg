\* Block PU1, README "PeerUpAck": a silent (Byzantine) responder, refusals of either connection by either side,
\* admission on or off at start and flipped once, both protocol paths, honest timing (any timing is Late's, Stuck's and Reuse's: with it this run passes
\* 9 million states). Invariants S1-S4 (safety run).
SPECIFICATION Spec
