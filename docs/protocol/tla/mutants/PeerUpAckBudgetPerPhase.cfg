\* Block PU1, README "PeerUpAck": PeerUpAckBudgetPerPhase must violate Budget: M8 (P-5): a clock restarted when NewStream returns lets a slow negotiation plus a late ACK exceed the deadline.
\* Constants as the sound config (PeerUpAckStuck.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Conns = {1}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 0
  CachedInit = {TRUE, FALSE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {"b"}
  MaxOpens = 2
  D = 2
  HonestTiming = FALSE
  TickFair = TRUE
  ResetOnReturn <- ResetOnReturnMut
INVARIANTS
  Budget
CHECK_DEADLOCK FALSE
