\* WITNESS (README.md, OISingleInstance): the sound model must violate NoTakeover (a launch becomes primary after a primary that served crashed).
\* Constants as the sound config; anti-vacuity.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 1
  Hangs = FALSE
INVARIANTS
  NoTakeover
CHECK_DEADLOCK FALSE
