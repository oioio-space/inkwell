\* MUTANT (README.md, SyncIndicator): no resync after a transport loss (spec 5.5 rule L) must violate EventuallySynced.
\* Constants as the sound config; the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Me = me
  Peers = {p1}
  MaxEdits = 2
  MaxLoss = 1
  MaxDown = 1
  QMax = 2
  Resync <- NoResync
INVARIANTS
  TypeOK
  TheirSound
  PeerHonest
  GlobalHonest
PROPERTIES
  EventuallySynced
CHECK_DEADLOCK FALSE
