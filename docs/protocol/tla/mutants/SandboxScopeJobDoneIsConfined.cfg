\* MUTANT (README.md, SandboxScope): SandboxScopeJobDoneIsConfined must violate SessionBounded: the job result done is taken as confinement, S5-S9 not read back (A3).
\* Constants as the sound config (SandboxScopeFaults.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = TRUE
  Verified <- JobDone
INVARIANTS
  SessionBounded
CHECK_DEADLOCK FALSE
