\* MUTANT (README.md, SandboxScope): SandboxScopeSessionUnbounded must violate SessionBounded: the session scope is created outside the app's slice: the slice's limit no longer bounds app plus sandbox (A8).
\* Constants as the sound config (SandboxScope.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = FALSE
  ScopeSlice <- OtherSlice
INVARIANTS
  SessionBounded
CHECK_DEADLOCK FALSE
