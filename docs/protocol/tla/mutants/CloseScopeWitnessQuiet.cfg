\* Block PU1d, README "CloseScope": witness, the sound model must violate NoQuietOpen: an opening starts with no connectedness event pending (the state MC2 strands).
\* Constants as the sound config (CloseScopeLive.cfg); the override (if any) is the only difference.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = TRUE
  TickFair = TRUE
  Moves = FALSE
  CrashBy = {"b"}
INVARIANTS
  NoQuietOpen
CHECK_DEADLOCK FALSE
