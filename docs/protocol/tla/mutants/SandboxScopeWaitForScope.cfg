\* MUTANT (README.md, SandboxScope): SandboxScopeWaitForScope must violate RunsEnd: after a failed setup, runs wait for a session instead of using the fallback (A3).
\* Constants as the sound config (SandboxScopeFaults.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = TRUE
  OnSetupFailed <- WaitScope
PROPERTIES
  RunsEnd
CHECK_DEADLOCK FALSE
