\* Block PU1b, README "SyncOrder": SyncOrderWitnessRemoveWaiting must violate NoRemovalWhileWaiting: witness: a stream leaves while its successor waits for it (the wake).
\* Constants as the sound config (SyncOrderByzantine.cfg).
SPECIFICATION Spec
CONSTANTS
  Streams = {1, 2, 3}
  Cap = 2
  MaxFrames = 1
  Byzantine = TRUE
  Stall = TRUE
  MaxDrops = 0
  D = 1
  HonestTiming = FALSE
INVARIANTS
  NoRemovalWhileWaiting
CHECK_DEADLOCK FALSE
