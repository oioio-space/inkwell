\* MUTANT (README.md, SandboxScope): SandboxScopeExecBeforeCheck must violate ConfinedFromBirth: the bootstrap works before checking its own cgroup (R6 not first): a misplaced launch runs outside.
\* Constants as the sound config (SandboxScopeFaults.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = TRUE
  CheckFirst <- NoFirstCheck
INVARIANTS
  ConfinedFromBirth
CHECK_DEADLOCK FALSE
