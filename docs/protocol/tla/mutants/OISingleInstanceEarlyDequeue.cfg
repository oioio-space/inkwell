\* MUTANT (README.md, OISingleInstance): OISingleInstanceEarlyDequeue must violate AckedApplied: the process closes
\* once Go's queue is empty (requests taken and sent to the window) instead of once the window reported them handled.
\* Constants as the sound config, except MaxCrashes = 0: no crash, so that only the early close can lose it.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 0
  Hangs = FALSE
  MaxGen = 1
  DrainedBeforeClose <- QueueEmpty
PROPERTIES
  AckedApplied
CHECK_DEADLOCK FALSE
