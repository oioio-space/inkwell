\* MUTANT (README.md, OISingleInstance): OISingleInstanceNoDrain must violate AckedApplied: a request is queued, but the window never reads the queue: never applied, never acknowledged.
\* Constants as the sound config (OISingleInstance.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 1
  Hangs = FALSE
  MaxGen = 1
  ToApply <- NoDrain
PROPERTIES
  AckedApplied
CHECK_DEADLOCK FALSE
