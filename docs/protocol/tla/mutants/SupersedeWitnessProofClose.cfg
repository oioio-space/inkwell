\* Block HP1c, README "Supersede": run HP1cSupersedeWitnessProofClose must violate NoProofClose: witness: a proof closes a dead connection.
\* Constants as SupersedeHonest.cfg; the override is the only difference.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = TRUE
  TickFair = TRUE
  LearnFair = FALSE
  Moves = FALSE
  CrashBy = {"a", "b"}
INVARIANTS
  NoProofClose
CHECK_DEADLOCK FALSE
