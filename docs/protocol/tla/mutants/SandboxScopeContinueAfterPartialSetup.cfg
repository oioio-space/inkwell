\* MUTANT (README.md, SandboxScope): SandboxScopeContinueAfterPartialSetup must violate ConfinedFromBirth: a refused or silently ignored limit write (F8, F9) is not acted on: the run starts in a cgroup without its limits.
\* Constants as the sound config (SandboxScopeFaults.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = TRUE
  RunOnFail <- ContinueOnFail
INVARIANTS
  ConfinedFromBirth
CHECK_DEADLOCK FALSE
