\* Block HP1c, README "Supersede": run HP1cSupersedeBackwardAck must violate FallbackKept: MS5: a dead acknowledged middle
\* connection lifts the oldest one's exemption while the newest awaits its first ACK. Constants as SupersedeAnyTiming.cfg,
\* with three connections; the override is the only other difference.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2, 3}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 1
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  LearnFair = FALSE
  Moves = FALSE
  CrashBy = {"a", "b"}
  AckWaitOK <- BackwardAckMut
INVARIANTS
  FallbackKept
CHECK_DEADLOCK FALSE
