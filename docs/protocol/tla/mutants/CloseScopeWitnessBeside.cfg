\* Block PU1d, README "CloseScope": witness, the sound model must violate NoFailBeside: a session opening fails while the peer's acknowledged session runs on another connection (S6 is not vacuous).
\* Constants as the sound config (CloseScopeAny.cfg); the override (if any) is the only difference.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 1
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  Moves = FALSE
  CrashBy = {}
INVARIANTS
  NoFailBeside
CHECK_DEADLOCK FALSE
