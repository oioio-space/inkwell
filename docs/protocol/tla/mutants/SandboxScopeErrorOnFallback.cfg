\* MUTANT (README.md, SandboxScope): SandboxScopeErrorOnFallback must violate FailureFallsBack: a placement error returns an error instead of the fallback (F10, H2).
\* Constants as the sound config (SandboxScopeFaults.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = TRUE
  PlacementRetry <- ErrorRetry
INVARIANTS
  FailureFallsBack
CHECK_DEADLOCK FALSE
