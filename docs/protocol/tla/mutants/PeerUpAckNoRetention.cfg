\* Block PU1, README "PeerUpAck": PeerUpAckNoRetention must violate UpAfterAccept: M5 (P-2): an ACK sent after the responder closed the connection announces a peer over a dead link.
\* Constants as the sound config (PeerUpAckLate.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {2}
  MaxCloses = 1
  MaxFlips = 1
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  AckReady <- AckAdmittedOnly
INVARIANTS
  UpAfterAccept
CHECK_DEADLOCK FALSE
