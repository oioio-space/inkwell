\* MUTANT (README.md, OISingleInstance): OISingleInstanceSecondUnlinks must violate Settles: a second launch removes a stale-looking socket (it may be the new primary's).
\* Constants as the sound config (OISingleInstance.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 1
  Hangs = FALSE
  UnlinksStale <- SecondUnlinksStale
PROPERTIES
  Settles
CHECK_DEADLOCK FALSE
