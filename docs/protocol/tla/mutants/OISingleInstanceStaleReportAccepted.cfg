\* MUTANT (README.md, OISingleInstance): OISingleInstanceStaleReportAccepted must violate SlotsAgree: a handled report of a superseded stream frees a request the new stream holds, so Go counts one less in flight than the window holds.
\* Constants as the sound config (OISingleInstance.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 1
  Hangs = FALSE
  MaxGen = 2
  AcceptsReport <- StaleReport
INVARIANTS
  SlotsAgree
CHECK_DEADLOCK FALSE
