\* MUTANT (README.md, WriteBudget): today's fixed 16 KiB/s floor must violate Delivered on a link at half that rate (NI-3).
\* Constants as the sound config (WriteBudget.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  S = 8
  Idle = 2
  Floor = 1
  MaxRate = 4
  Burst = 1
  MaxMsg = 1
  Honest = TRUE
  FixedRate = 2
  Limit <- FixedLimit
