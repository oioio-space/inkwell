\* MUTANT (README.md, OISingleInstance): OISingleInstanceNoLock must violate MutualExclusion: a primary is whoever finds no socket answering (the socket-only design).
\* Constants as the sound config (OISingleInstance.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 1
  Hangs = FALSE
  MayLead <- NoLockLead
INVARIANTS
  MutualExclusion
CHECK_DEADLOCK FALSE
