\* MUTANT (README.md, OISingleInstance): OISingleInstanceLockReleasedEarly must violate MutualExclusion: the lock is released when closing starts, before the identity is closed.
\* Constants as the sound config (OISingleInstance.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 1
  Hangs = FALSE
  ReleaseOnClose <- ReleaseEarly
INVARIANTS
  MutualExclusion
CHECK_DEADLOCK FALSE
