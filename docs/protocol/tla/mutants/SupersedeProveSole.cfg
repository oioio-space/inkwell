\* Block HP1c (redefined by HP1c2, review 3b), README "Supersede": run HP1cSupersedeProveSole must violate NeverCloseSole: MS4,
\* as MP2: the newest connection is judged like the older ones, its own ACK counting; a silent connection left alone (its
\* newer closed) is closed. Constants as SupersedeAnyTiming.cfg; the two overrides are the only difference.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 1
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  LearnFair = FALSE
  Moves = FALSE
  CrashBy = {"a", "b"}
  SoleOK <- ProveSoleMut
  AckWaitOK <- OwnAckMut
INVARIANTS
  NeverCloseSole
CHECK_DEADLOCK FALSE
