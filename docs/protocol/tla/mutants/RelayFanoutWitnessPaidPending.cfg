\* Block RF1, README "RelayFanout": RelayFanoutWitnessPaidPending must violate NoPaidPending: witness: a period pays a pending member's token before its handshake (MF12's state).
\* Constants as the sound config (RelayFanoutFlood.cfg) unless named Residual; the override (if any) is the only difference.
SPECIFICATION Spec
CONSTANTS
  Members = {1, 2, 3, 4}
  Byz = {4}
  Origins = {1, 2}
  Via <- ViaOne
  AttOrigins = {1, 2}
  MaxAtt <- Unbounded
  P = 2
  Q = 3
  B = 2
  MemberCap = 9
  PerCap = 4
  MaxCloses = 1
  Dials = TRUE
  Late = {}
INVARIANTS
  NoPaidPending
CHECK_DEADLOCK FALSE
