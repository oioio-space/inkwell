\* Block PU1b, README "SyncOrder": SyncOrderWitnessEmptyEof must violate NoEmptyEof: witness: a waiting stream ended by its opener without a frame leaves the order.
\* Constants as the sound config (SyncOrderByzantine.cfg).
SPECIFICATION Spec
