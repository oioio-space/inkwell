  Streams = {1, 2, 3}
  Cap = 2
  MaxFrames = 1
  Byzantine = TRUE
  Stall = TRUE
  MaxDrops = 0
  D = 1
  HonestTiming = FALSE
INVARIANTS
  NoEmptyEof
CHECK_DEADLOCK FALSE
