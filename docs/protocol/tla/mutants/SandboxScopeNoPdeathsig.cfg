\* MUTANT (README.md, SandboxScope): SandboxScopeNoPdeathsig must violate NoOrphan: the namespace init has no Pdeathsig: after the app is SIGKILLed the workload lives on in run-<n>, and with its holder killed nothing reaps it (A9, H6).
\* Constants as the sound config (SandboxScopeFaults.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = TRUE
  InitPdeathsig <- NoPdeathsig
PROPERTIES
  NoOrphan
CHECK_DEADLOCK FALSE
