\* MUTANT (SP1-3, RC10): SP1Silence with partialTTL = WriteIdle (90 s): at the end of a 90 s silence the reader's partial timer expires at the same instant as the sender's WriteIdle, and the reader may drop the message before the sender gives up: a drop no rule L covers. 91 s holds in the model (no reverse propagation delay); the design keeps WriteIdle + 2D + 10 s = 120 s.
\* README "SendPath" / "SP1". One unit = 8 KiB (C); one tick = C / the link rate.
