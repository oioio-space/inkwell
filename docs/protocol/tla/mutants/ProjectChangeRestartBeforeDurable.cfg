\* MUTANT (README.md, ProjectChange): ProjectChangeRestartBeforeDurable must violate WriteBeforeRestart: the restart before stopAll returned (MW8): the write is cut short.
\* Constants as the sound config (ProjectChange.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "exec"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  StoppedOK <- AfterWiring
INVARIANTS
  WriteBeforeRestart
CHECK_DEADLOCK FALSE
