\* Block HP1c, README "Supersede": run HP1cSupersedeCloseOnTimer must violate LiveKept: MS2: the timer closes the older connection whatever the answer: a live connection is closed.
\* Constants as SupersedeHonest.cfg; the override is the only difference.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = TRUE
  TickFair = TRUE
  LearnFair = FALSE
  Moves = FALSE
  CrashBy = {"a", "b"}
  Closable <- CloseOnTimerMut
INVARIANTS
  LiveKept
CHECK_DEADLOCK FALSE
