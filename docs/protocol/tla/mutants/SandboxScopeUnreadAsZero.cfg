\* MUTANT (README.md, SandboxScope): SandboxScopeUnreadAsZero must violate UnreadNeverZero: an unreadable counter or a watch overflow is taken as zero (M9).
\* Constants as the sound config (SandboxScopeFaults.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = TRUE
  CauseOf <- UnreadZero
INVARIANTS
  UnreadNeverZero
CHECK_DEADLOCK FALSE
