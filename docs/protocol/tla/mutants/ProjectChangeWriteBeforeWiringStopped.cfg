\* MUTANT (README.md, ProjectChange): ProjectChangeWriteBeforeWiringStopped must violate NoOldStateAfterChange: the write starts while the wiring runs (MW10): an op of the old project lands in the new list.
\* Constants as the sound config (ProjectChange.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "exec"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  WriteOK <- Anytime
INVARIANTS
  NoOldStateAfterChange
CHECK_DEADLOCK FALSE
