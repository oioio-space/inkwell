  Uq = 2
  H = 8
  Uh = 2
  Qn = 1
  Tw = 2
  Credit = TRUE
  Win = 2
  Measure = "consumed"
  Call = 1
  P = 2
  Tp = 4
  Total = 0
  Resume = TRUE
  Shared = FALSE
  Honest = FALSE
  MaxLoss = 0
  MaxEpoch = 2
  MaxForge = 1
  MaxInt = 0
  Lmax = 0
  Tpart = 0
  Blk = 0
  Ka = 0
  Tk = 4
  Quantum <- UnitQuantum
INVARIANTS
  TypeOK
  HoldBound
CHECK_DEADLOCK FALSE
