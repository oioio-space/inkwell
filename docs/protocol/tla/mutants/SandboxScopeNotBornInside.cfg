\* MUTANT (README.md, SandboxScope): SandboxScopeNotBornInside must violate ConfinedFromBirth: the outer launcher starts in the app's cgroup and is moved in after its bootstrap ran (PIDs of a running process, ADR point 1).
\* Constants as the sound config (SandboxScope.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = FALSE
  BornInside <- NotBorn
INVARIANTS
  ConfinedFromBirth
CHECK_DEADLOCK FALSE
