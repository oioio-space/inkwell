\* MUTANT (README.md, OISingleInstance): OISingleInstanceResetAllOnDisconnect must violate SlotsAgree: the late end of a superseded stream gives back every request, the new stream's too, which are then sent twice.
\* Constants as the sound config (OISingleInstance.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 1
  Hangs = FALSE
  MaxGen = 2
  EndGiveBack <- ResetAll
INVARIANTS
  SlotsAgree
CHECK_DEADLOCK FALSE
