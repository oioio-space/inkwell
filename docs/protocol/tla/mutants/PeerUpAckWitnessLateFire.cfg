\* Block PU1, README "PeerUpAck": PeerUpAckWitnessLateFire must violate NoLateFire: witness: a deadline fires while the stream's bytes are in flight or its handler is deciding (the budget is absolute).
\* Constants as the sound config (PeerUpAckStuck.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Conns = {1}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 0
  CachedInit = {TRUE, FALSE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {"b"}
  MaxOpens = 2
  D = 2
  HonestTiming = FALSE
  TickFair = TRUE
INVARIANTS
  NoLateFire
CHECK_DEADLOCK FALSE
