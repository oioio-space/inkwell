\* Block PU1, README "PeerUpAck": PeerUpAckUpOnReturn must violate NoUpOnRefused: M1 (P-1): PeerUp on NewStream's return (today's code) announces a peer over a connection it has not registered or closed at registration.
\* Constants as the sound config (PeerUpAckLate.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {2}
  MaxCloses = 1
  MaxFlips = 1
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  ReturnOpens <- ReturnOpensMut
INVARIANTS
  NoUpOnRefused
CHECK_DEADLOCK FALSE
