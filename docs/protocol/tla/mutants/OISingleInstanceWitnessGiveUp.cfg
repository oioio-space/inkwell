\* WITNESS (README.md, OISingleInstance): the sound model must violate NoGiveUp (a launch gives up on a hung holder).
\* Constants as the sound config; anti-vacuity.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 1
  Hangs = TRUE
INVARIANTS
  NoGiveUp
CHECK_DEADLOCK FALSE
