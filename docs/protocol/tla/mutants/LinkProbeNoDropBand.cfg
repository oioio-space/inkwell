\* MUTANT (README.md, LinkProbe): LinkProbeNoDropBand must violate HonestNoViolation.
\* Constants as the sound config (LinkProbeAccept.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  MaxProbes = 4
  MaxStreams = 1
  MaxData = 0
  MaxOut = 2
  MaxSamples = 2
  PTO = 2
  W = 3
  NMin = 1
  D = 1
  B = 1
  Gap = 1
  AccDelay = 2
  DropMax = 1
  CreditMax = 2
  MaxStalls = 0
  MaxEnds = 0
  MaxRestarts = 0
  Honest = TRUE
  Greedy = FALSE
  SeqOK <- NoDropBand
INVARIANTS
  HonestNoViolation
CHECK_DEADLOCK FALSE
