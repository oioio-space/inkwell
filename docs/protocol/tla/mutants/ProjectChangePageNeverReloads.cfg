\* MUTANT (README.md, ProjectChange): ProjectChangePageNeverReloads must violate ChangeCompletes: the page reloads only on the startup id it knows: it waits forever.
\* Constants as the sound config (ProjectChange.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "exec"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  ReloadOn <- SameId
PROPERTIES
  ChangeCompletes
CHECK_DEADLOCK FALSE
