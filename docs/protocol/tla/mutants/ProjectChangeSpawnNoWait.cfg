\* MUTANT (README.md, ProjectChange): ProjectChangeSpawnNoWait must violate OneImage: N35: the spawned image starts its work without claiming the profile lock, while the old one is still exiting.
\* Constants as the sound config (ProjectChangeSpawn.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "spawn"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  MayStart <- NoWait
INVARIANTS
  OneImage
CHECK_DEADLOCK FALSE
