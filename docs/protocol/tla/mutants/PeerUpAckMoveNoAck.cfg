\* Block PU1, README "PeerUpAck": PeerUpAckMoveNoAck must violate SessionOnAccepted: M4 (P-6): a move swapped at NewStream's return puts the session on a stream the peer never accepted.
\* Constants as the sound config (PeerUpAckLate.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {2}
  MaxCloses = 1
  MaxFlips = 1
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  MoveAtReturn <- MoveAtReturnMut
INVARIANTS
  SessionOnAccepted
CHECK_DEADLOCK FALSE
