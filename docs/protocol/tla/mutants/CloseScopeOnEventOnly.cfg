\* Block PU1d, README "CloseScope": CloseScopeOnEventOnly must violate NeverStranded: MC2 (P-17 off): after the session's connection is lost, the remaining one emits no connectedness event and starts no opening.
\* Constants as the sound config (CloseScopeLive.cfg); the override (if any) is the only difference.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = TRUE
  TickFair = TRUE
  Moves = FALSE
  CrashBy = {"b"}
  OpenGuard <- OpenOnEvent
PROPERTIES
  NeverStranded
CHECK_DEADLOCK FALSE
