\* MUTANT (README.md, ProjectChange): ProjectChangeOldContinuation must violate NoOldStateAfterChange: a page that asked keeps applying automerge-repo continuations; one authorised under the old project persists through the new image.
\* Constants as the sound config (ProjectChange.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "exec"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  PageGate <- No
INVARIANTS
  NoOldStateAfterChange
CHECK_DEADLOCK FALSE
