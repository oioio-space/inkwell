\* WITNESS (README.md, SandboxScope): the sound model must violate NoAddressDeath: a run dies at the address budget (M2).
\* Constants as the sound config (SandboxScope.cfg); anti-vacuity.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = FALSE
INVARIANTS
  NoAddressDeath
CHECK_DEADLOCK FALSE
