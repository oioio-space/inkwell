\* MUTANT (README.md, SandboxScope): SandboxScopeVictimAsLimit must violate LimitIsLocal: any local oom_kill is the limit, local oom not checked: a global or ancestor victim is a memory limit (M3).
\* Constants as the sound config (SandboxScopeFaults.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = TRUE
  CauseOf <- KillIsLimit
INVARIANTS
  LimitIsLocal
CHECK_DEADLOCK FALSE
