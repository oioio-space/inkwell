\* Block PU1b, README "SyncOrder": SyncOrderClosePeerOnBusy must violate SessionKept: Q3 (P-8): the capacity refusal of drain + replacement + reconnect destroys a healthy session.
\* Constants as the sound config (SyncOrderHonest.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Streams = {1, 2, 3}
  Cap = 2
  MaxFrames = 3
  Byzantine = FALSE
  Stall = FALSE
  MaxDrops = 1
  D = 3
  HonestTiming = TRUE
  OnBusyKill <- OnBusyKillMut
INVARIANTS
  SessionKept
CHECK_DEADLOCK FALSE
