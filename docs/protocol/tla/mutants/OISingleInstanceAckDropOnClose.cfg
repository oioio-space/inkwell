\* MUTANT (README.md, OISingleInstance): OISingleInstanceAckDropOnClose must violate AckedApplied: the window closes
\* without first applying what was acknowledged, so a clean shutdown loses it.
\* Constants as the sound config, except MaxCrashes = 0: no crash, so that only a clean shutdown can lose it.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 0
  Hangs = FALSE
  MaxGen = 1
  DrainedBeforeClose <- CloseAnyTime
PROPERTIES
  AckedApplied
CHECK_DEADLOCK FALSE
