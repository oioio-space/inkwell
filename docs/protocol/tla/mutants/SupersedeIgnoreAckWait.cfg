\* Block HP1c, README "Supersede": run HP1cSupersedeIgnoreAckWait must violate FallbackKept: MS3: the close at T_vie does not wait for the newer connection's ACK: the fallback is gone.
\* Constants as SupersedeHonest.cfg; the override is the only difference.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = TRUE
  TickFair = TRUE
  LearnFair = FALSE
  Moves = FALSE
  CrashBy = {"a", "b"}
  AckWaitOK <- IgnoreAckWaitMut
INVARIANTS
  FallbackKept
CHECK_DEADLOCK FALSE
