\* MUTANT (README.md, ProjectChange): ProjectChangeNoBarrier must violate NoOldStateAfterChange: no termination barrier (MW11): a child of the old image runs beside the new one.
\* Constants as the sound config (ProjectChange.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "exec"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  BarrierOK <- NoBarrier
INVARIANTS
  NoOldStateAfterChange
CHECK_DEADLOCK FALSE
