\* MUTANT (E1): an object stream paced by its transport window only (8 units) (no credit, v1 progress, no cut) through a hop smaller than that window that reopens in 3-unit quanta (12 s), with today's write valve (2 ticks = 8 s, ConnectionWriteTimeout 10 s); keepalive off, so that the valve alone closes the session.
\* README "SendPath" / "SP1". One unit = 8 KiB (C); one tick = C / the link rate.
