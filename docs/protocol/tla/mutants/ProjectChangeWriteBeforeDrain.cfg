\* MUTANT (README.md, ProjectChange): ProjectChangeWriteBeforeDrain must violate NoLostWrite: the member-list write starts before Go drained the bridge streams (N-16): a storage write still in its handler lands after the write began.
\* Constants as the sound config (ProjectChange.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "exec"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  WriteOK <- WriteBeforeDrain
INVARIANTS
  NoLostWrite
CHECK_DEADLOCK FALSE
