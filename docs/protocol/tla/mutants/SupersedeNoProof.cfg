\* Block HP1c, README "Supersede": run HP1cSupersedeNoProof must violate SupersededBounded: MS1 (P-15 off): no proof; a dead older connection lasts until the idle timeout.
\* Constants as SupersedeHonest.cfg; the override is the only difference.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = TRUE
  TickFair = TRUE
  LearnFair = FALSE
  Moves = FALSE
  CrashBy = {"a", "b"}
  StartsProof <- NoProofMut
INVARIANTS
  SupersededBounded
CHECK_DEADLOCK FALSE
