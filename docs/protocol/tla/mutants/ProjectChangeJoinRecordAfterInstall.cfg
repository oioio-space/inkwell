\* MUTANT (README.md, ProjectChange): ProjectChangeJoinRecordAfterInstall must violate OpensAfterCrash: the new list installed before the pending-join record: a crash between them leaves the new list with the old root.
\* Constants as the sound config (ProjectChange.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "exec"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  StepsOf <- RecordLast
INVARIANTS
  OpensAfterCrash
CHECK_DEADLOCK FALSE
