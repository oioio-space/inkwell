\* MUTANT (README.md, SandboxScope): SandboxScopeCleanupBeforeCounters must violate CountersBeforeCleanup: cgroup.kill and rmdir before the counters are read (R8 before R7, early release).
\* Constants as the sound config (SandboxScope.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = FALSE
  CleanFirst <- EarlyCleanup
INVARIANTS
  CountersBeforeCleanup
CHECK_DEADLOCK FALSE
