\* MUTANT (README.md, WriteBudget): no idle bound (total only) must violate StopCut: a reader that stops is cut late.
\* Constants as the sound config (WriteBudgetAny.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  S = 8
  Idle = 2
  Floor = 1
  MaxRate = 4
  Burst = 1
  MaxMsg = 1
  Honest = FALSE
  FixedRate = 2
  Expired <- TotalOnlyExpired
INVARIANTS
  TypeOK
  StopCut
  HoldBound
CHECK_DEADLOCK FALSE
