\* Block HP1c, README "Supersede": run HP1cSupersedeWitnessFallback must violate NoFallbackWait: witness: a silent proof waits while the newer connection's opening awaits its ACK.
\* Constants as SupersedeHonest.cfg; the override is the only difference.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = TRUE
  TickFair = TRUE
  LearnFair = FALSE
  Moves = FALSE
  CrashBy = {"a", "b"}
INVARIANTS
  NoFallbackWait
CHECK_DEADLOCK FALSE
