\* MUTANT (README.md, OISingleInstance): OISingleInstanceFireAndForget must violate ExitOkImpliesQueued: exit 0 right after sending, no acknowledgement (Wails macOS).
\* Constants as the sound config (OISingleInstance.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 1
  Hangs = FALSE
  WaitsForReply <- FireAndForget
INVARIANTS
  ExitOkImpliesQueued
CHECK_DEADLOCK FALSE
