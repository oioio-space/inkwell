\* MUTANT (README.md, OISingleInstance): OISingleInstanceCrashKeepsLock must violate Settles: a crash leaves the lock held (pid file, O_EXCL file).
\* Constants as the sound config (OISingleInstance.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 1
  Hangs = FALSE
  ReleaseOnCrash <- KeepLockOnCrash
PROPERTIES
  Settles
CHECK_DEADLOCK FALSE
