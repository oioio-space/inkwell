\* MUTANT (README.md, WriteBudget): no total bound (idle only) must violate HoldBound: a drip-feed holds the write.
\* Constants as the sound config (WriteBudgetAny.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  S = 8
  Idle = 2
  Floor = 1
  MaxRate = 4
  Burst = 1
  MaxMsg = 1
  Honest = FALSE
  FixedRate = 2
  Expired <- IdleOnlyExpired
INVARIANTS
  TypeOK
  StopCut
  HoldBound
CHECK_DEADLOCK FALSE
