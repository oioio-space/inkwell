\* MUTANT (README.md, ProjectChange): ProjectChangeRecoverPrefersAside must violate NewStateSurvives: recovery at open prefers the set-aside list: after the install rename the old list comes back.
\* Constants as the sound config (ProjectChange.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "exec"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  RecoveredTrust <- PreferAside
INVARIANTS
  NewStateSurvives
CHECK_DEADLOCK FALSE
