\* MUTANT (README.md, SandboxScope): SandboxScopeHolderDeathEscapes must violate ConfinedFromBirth: after a dead holder's scope is gone (ENOENT, ENODEV at Start), the retry runs in the app's cgroup but keeps Containment cgroup (H2).
\* Constants as the sound config (SandboxScopeFaults.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = TRUE
  PlacementRetry <- KeepContainment
INVARIANTS
  ConfinedFromBirth
CHECK_DEADLOCK FALSE
