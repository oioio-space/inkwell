\* WITNESS (README.md, SandboxScope): the sound model must violate NoFallback: a run ends in the fallback with Containment rlimit (F rows).
\* Constants as the sound config (SandboxScopeFaults.cfg); anti-vacuity.
SPECIFICATION Spec
