\* MUTANT (README.md, ProjectChange): ProjectChangeRestartTwice must violate RestartOnce: the restarted image restarts again when the person quits (the variable taken as a request).
\* Constants as the sound config (ProjectChange.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "exec"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  RestartWanted <- AfterChangeToo
INVARIANTS
  RestartOnce
CHECK_DEADLOCK FALSE
