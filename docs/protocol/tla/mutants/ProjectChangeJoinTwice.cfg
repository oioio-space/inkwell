\* MUTANT (README.md, ProjectChange): ProjectChangeJoinTwice must violate JoinOnce: consuming the pending-join record leaves it in project.json; the next start consumes it again.
\* Constants as the sound config (ProjectChange.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "exec"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  ClearRecord <- KeepRecord
INVARIANTS
  JoinOnce
CHECK_DEADLOCK FALSE
