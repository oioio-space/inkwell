\* Block PU1, README "PeerUpAck": PeerUpAckAckByConn must violate SessionOnAccepted: M7 (P-4): an ACK counted by connection only lets a late ACK of an abandoned stream promote a later stream.
\* Constants as the sound config (PeerUpAckReuse.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 3
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  AckMatches <- AckSameConn
INVARIANTS
  SessionOnAccepted
CHECK_DEADLOCK FALSE
