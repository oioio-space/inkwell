\* Block PU1d, README "CloseScope": CloseScopeClosePeer must violate CrossedIndependent: MC1 (P-16 off, ClosePeer): a deadline on one connection closes the other one too, and with it the peer's acknowledged session.
\* Constants as the sound config (CloseScopeAny.cfg); the override (if any) is the only difference.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 1
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  Moves = FALSE
  CrashBy = {}
  FailClose <- FailClosePeer
INVARIANTS
  CrossedIndependent
CHECK_DEADLOCK FALSE
