\* MUTANT (README.md, SandboxScope): SandboxScopeOrphanAfterAppKill must violate NoStaleScope: the holder ignores EOF: after the app is SIGKILLed the scope and its run cgroups stay (H5, H8).
\* Constants as the sound config (SandboxScopeFaults.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2}
  MaxSessions = 2
  Faults = TRUE
  ReapOnEOF <- NoReap
PROPERTIES
  NoStaleScope
CHECK_DEADLOCK FALSE
