\* Block PU1, README "PeerUpAck": PeerUpAckAfterOwnUp must violate BothUp: M3 (P-3): each side waits for its own PeerUp before it ACKs: nobody comes up.
\* Constants as the sound config (PeerUpAckHonest.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Conns = {1}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 0
  CachedInit = {TRUE, FALSE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 1
  D = 1
  HonestTiming = TRUE
  TickFair = TRUE
  AckReady <- AckAfterUp
PROPERTIES
  BothUp
CHECK_DEADLOCK FALSE
