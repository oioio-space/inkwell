\* MUTANT (README.md, OISingleInstance): OISingleInstanceAckNoQueue must violate ExitOkImpliesQueued: the request is acknowledged before it is queued.
\* Constants as the sound config (OISingleInstance.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 1
  Hangs = FALSE
  Enqueue <- AckNoQueue
INVARIANTS
  ExitOkImpliesQueued
CHECK_DEADLOCK FALSE
