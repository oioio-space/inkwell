\* MUTANT (README.md, ProjectChange): ProjectChangeCarriedOutcome must violate NoticeMatchesStanding: the notice follows the request, not the standing loaded: a write that failed before the install says « maintenant le vôtre ».
\* Constants as the sound config (ProjectChange.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "exec"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  NoticeOf <- AlwaysDone
INVARIANTS
  NoticeMatchesStanding
CHECK_DEADLOCK FALSE
