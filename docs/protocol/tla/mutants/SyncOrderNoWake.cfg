\* Block PU1b, README "SyncOrder": SyncOrderNoWake must violate AllDelivered: Q1 (P-9): the successor of a drained stream waits for it for ever, its frames never delivered.
\* Constants as the sound config (SyncOrderHonest.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Streams = {1, 2, 3}
  Cap = 2
  MaxFrames = 3
  Byzantine = FALSE
  Stall = FALSE
  MaxDrops = 1
  D = 3
  HonestTiming = TRUE
  Rewire <- RewireStale
PROPERTIES
  AllDelivered
CHECK_DEADLOCK FALSE
