\* Block PU1, README "PeerUpAck": PeerUpAckTimeoutGuarded must violate OpenResolves: M6 (P-5): a deadline that waits for the stream to fall silent never fires against a handler stuck in its decision.
\* Constants as the sound config (PeerUpAckStuck.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Conns = {1}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 0
  CachedInit = {TRUE, FALSE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {"b"}
  MaxOpens = 2
  D = 2
  HonestTiming = FALSE
  TickFair = TRUE
  TimeoutReady <- TimeoutWhenSilent
PROPERTIES
  OpenResolves
CHECK_DEADLOCK FALSE
