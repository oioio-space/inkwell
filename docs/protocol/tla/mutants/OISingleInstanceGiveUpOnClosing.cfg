\* MUTANT (README.md, OISingleInstance): OISingleInstanceGiveUpOnClosing must violate GaveUpJustified: an answer closing is read as already running, and the launch is lost.
\* Constants as the sound config (OISingleInstance.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Launch = {p1, p2, p3}
  None = None
  MaxCrashes = 1
  Hangs = FALSE
  GiveUpOnClosing <- GiveUpClosing
INVARIANTS
  GaveUpJustified
CHECK_DEADLOCK FALSE
