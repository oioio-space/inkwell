\* Block PU1d, README "CloseScope": CloseScopeUnnamedCollateral must violate CrossedIndependent: MC3's consequence: a deadline before NewStream returns names no connection, so the node closes them all, the one carrying the peer's acknowledged session included.
\* Constants as the sound config (CloseScopeNegotiated.cfg); the override (if any) is the only difference.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 0
  CachedInit = {FALSE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  Moves = FALSE
  CrashBy = {}
  Names <- NamesAtReturn
INVARIANTS
  CrossedIndependent
CHECK_DEADLOCK FALSE
