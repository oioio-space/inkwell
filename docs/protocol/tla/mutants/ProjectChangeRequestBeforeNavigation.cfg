\* MUTANT (README.md, ProjectChange): ProjectChangeRequestBeforeNavigation must violate NoOldStateAfterChange: the request is sent before the page discards its context (N-15); a continuation authorised under the old project persists through the new image.
\* Constants as the sound config (ProjectChange.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Platform = "exec"
  Kinds = {"takeover", "join"}
  MaxImg = 3
  MaxCrashes = 1
  MaxErrors = 1
  DiscardContext <- No
INVARIANTS
  NoOldStateAfterChange
CHECK_DEADLOCK FALSE
