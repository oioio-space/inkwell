\* Block PU1, README "PeerUpAck": PeerUpAckBeforeAdmit must violate UpAfterAccept: M2 (P-2): an ACK sent before the admission check announces a peer that refuses us.
\* Constants as the sound config (PeerUpAckByzantine.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {1, 2}
  MaxCloses = 0
  MaxFlips = 1
  CachedInit = {TRUE, FALSE}
  AdmitInit = {TRUE, FALSE}
  Silent = TRUE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = TRUE
  TickFair = FALSE
  AckReady <- AckAlways
INVARIANTS
  UpAfterAccept
CHECK_DEADLOCK FALSE
