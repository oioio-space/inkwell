\* MUTANT (README.md, WriteBudget): neither bound (a plain blocking write) must violate CutEventually.
\* Constants as the sound config (WriteBudgetAny.cfg); the override is the only difference. Only the
\* liveness property is listed, so that it, not the StopCut invariant, is what catches the mutant.
SPECIFICATION Spec
CONSTANTS
  S = 8
  Idle = 2
  Floor = 1
  MaxRate = 4
  Burst = 1
  MaxMsg = 1
  Honest = FALSE
  FixedRate = 2
  Expired <- NeverExpired
INVARIANTS
  TypeOK
PROPERTIES
  CutEventually
CHECK_DEADLOCK FALSE
