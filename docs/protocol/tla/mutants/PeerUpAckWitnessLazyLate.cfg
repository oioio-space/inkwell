\* Block PU1, README "PeerUpAck": PeerUpAckWitnessLazyLate must violate NotLazyLate: witness: the lazy path on a connection the peer closed at registration is reached (S3 is not vacuous).
\* Constants as the sound config (PeerUpAckLate.cfg); the override is the only difference.
SPECIFICATION Spec
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {2}
  MaxCloses = 1
  MaxFlips = 1
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
INVARIANTS
  NotLazyLate
CHECK_DEADLOCK FALSE
