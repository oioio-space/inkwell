\* Block PU1d, README "CloseScope": two connections both sides keep, the negotiated path (the protocol not cached:
\* NewStream returns only after the responder's echo, so a deadline can fire before it returns), two openings per node
\* (a failed one, then its reopening), no Drop (with Any's Drop this path takes 14.8 M distinct states and 9 min), no
\* move, any timing. Invariants (safety run): PeerUpAck's S1-S4, S6 CrossedIndependent, S7 OpeningNamed.
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 0
  CachedInit = {FALSE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 2
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  Moves = FALSE
  CrashBy = {}
INVARIANTS
  TypeOK
  TypeS
  UpAfterAccept
  SessionOnAccepted
  NoUpOnRefused
  Budget
  CrossedIndependent
  OpeningNamed
CHECK_DEADLOCK FALSE
