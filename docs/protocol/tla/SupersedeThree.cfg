\* Block HP1c2 (review 3b), README "Supersede": the sound rule on three connections, checked by TLC's simulation mode
\* (seed 20771, depth 60, 100000 traces per worker; tla-check.sh mode `simulate`), not exhaustively: an exhaustive run
\* on three connections does not end within the gate's budget (residual -> HP1). SupersedeAnyTiming's constants with
\* three connections: the case where a dead acknowledged middle connection must not lift the oldest one's exemption is
\* reachable here (the mutant HP1cSupersedeBackwardAck is caught on the same constants).
SPECIFICATION SpecS
CONSTANTS
  Conns = {1, 2, 3}
  RefuseOK = {}
  MaxCloses = 1
  MaxFlips = 0
  CachedInit = {TRUE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 1
  D = 1
  HonestTiming = FALSE
  TickFair = FALSE
  LearnFair = FALSE
  Moves = FALSE
  CrashBy = {"a", "b"}
INVARIANTS
  TypeOK
  TypeS
  UpAfterAccept
  SessionOnAccepted
  NoUpOnRefused
  Budget
  SupersededBounded
  FallbackKept
  NeverCloseSole
CHECK_DEADLOCK FALSE
