\* Block PU1, README "PeerUpAck": honest peers, one connection, both protocol paths (cached or negotiated), honest
\* timing (the deadline is longer than any honest exchange). S1-S4 and liveness: both sides come up (L1, no deadlock:
\* P-3), every opening resolves (L2).
SPECIFICATION Spec
CONSTANTS
  Conns = {1}
  RefuseOK = {}
  MaxCloses = 0
  MaxFlips = 0
  CachedInit = {TRUE, FALSE}
  AdmitInit = {TRUE}
  Silent = FALSE
  StuckNodes = {}
  MaxOpens = 1
  D = 1
  HonestTiming = TRUE
  TickFair = TRUE
INVARIANTS
  TypeOK
  UpAfterAccept
  SessionOnAccepted
  NoUpOnRefused
  Budget
PROPERTIES
  BothUp
  OpenResolves
  MoveResolves
CHECK_DEADLOCK FALSE
