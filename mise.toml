# mise — single source of truth for the toolchain, env, and project commands.
# Docs: https://mise.jdx.dev
#
#   mise run setup      # install tools + wire git hooks (one-shot bootstrap)
#   mise run            # list available tasks
#   mise run lint       # full Go style-guide gate
#   mise run ci         # everything CI runs (lint + scans + tests + coverage)
#
# Token optimization: build/test/lint tasks route through scripts/rtkx.sh, which uses
# `rtk err` when rtk is installed (compact output, exit code preserved) and runs raw
# otherwise. Install rtk with `mise run tools:rtk` (optional, never blocks).

min_version = "2024.1.0"

[settings]
experimental = true

# ── Tools ─────────────────────────────────────────────────────────────────────
[tools]
go            = "1.27.3"
gh            = "2.95.0" # pinned: used by the release workflow (supply chain)
golangci-lint = "2.15.0"
gofumpt       = "latest"
shellcheck    = "latest"
gitleaks      = "latest"
"go:github.com/securego/gosec/v2/cmd/gosec" = "2.30.0" # pinned: "latest" resolved differently locally and in CI
"go:golang.org/x/vuln/cmd/govulncheck"      = "latest"
# gopls also serves the Go MCP server (`gopls mcp`, wired in .mcp.json) for agents.
"go:golang.org/x/tools/gopls"              = "latest"
# Wails v3 CLI — beta: pin the exact tag, upgrade deliberately (ADR 0003, 0009).
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "v3.0.0-beta.34"
# x/perf has no tagged releases — "latest" breaks mise's go-backend resolution; pin the pseudo-version.
"go:golang.org/x/perf/cmd/benchstat"        = "v0.0.0-20260709024250-82a0b07e230d"
"go:github.com/dkorunic/betteralign/cmd/betteralign" = "latest"
syft          = "1.45.1" # pinned: the SBOM generator of the release
grype         = "0.114.0"
gotestsum     = "latest"
actionlint    = "1.7.12"
zizmor       = "1.31.1" # static analysis of the workflows (lint:actions)
yamlfmt       = "latest"
watchexec     = "latest"
goreleaser    = "2.18.0" # pinned: the release is reproducible (ADR 0025); nfpm is built in
git-cliff     = "2.14.2" # CHANGELOG.md and release notes from Conventional Commits (ADR 0025)
cosign        = "3.1.4"  # keyless signing in CI, and `pkg:verify` locally (ADR 0025)
# Frontend toolchain (ADR 0010).
node          = "24.22.1"
pnpm          = "12.15.0"

# ── Environment ───────────────────────────────────────────────────────────────
[env]
# INKWELL_GOFLAGS adds flags to every go command run by a task (GOFLAGS has no quoting), e.g. a
# per-test-binary address-space cap: INKWELL_GOFLAGS=-exec=$PWD/scripts/memcap.sh mise run mutate:go -- ./internal/trust
GOFLAGS = "-mod=readonly {{ get_env(name='INKWELL_GOFLAGS', default='') }}"
# Minimum test coverage enforced by `mise run cover:check` / CI (cmd/ excluded).
COVER_MIN = "85"
# Wails' own C code calls deprecated X11 helpers; silence that noise (not ours) in every cgo build.
CGO_CFLAGS = "-O2 -Wno-deprecated-declarations"

# ── Hooks ─────────────────────────────────────────────────────────────────────
[hooks]
enter = "git config core.hooksPath .githooks >/dev/null 2>&1 || true"

# ── Tasks ─────────────────────────────────────────────────────────────────────
[tasks.fmt]
description = "Format all Go code with gofumpt"
run = "gofumpt -w ."

[tasks.vet]
description = "go vet"
depends = ["sidecar:fetch"]
run = "./scripts/rtkx.sh go vet ./..."

[tasks.build]
description = "Build all packages"
depends = ["sidecar:fetch"]
run = "./scripts/rtkx.sh go build ./..."

[tasks."relay:run"]
description = "Run a circuit relay (cmd/inkwell-relay, pure Go), key in bin/relay.key (ignored by VCS); extra flags: mise run relay:run -- --print-addr"
env = { CGO_ENABLED = "0" }
run = "mkdir -p bin && go run ./cmd/inkwell-relay --key bin/relay.key"

[tasks.align]
description = "Reorder struct fields for optimal memory alignment (betteralign -apply)"
run = "betteralign -apply ./... && gofumpt -w ."

[tasks."align:check"]
description = "Report structs whose field order wastes memory (betteralign, no changes)"
run = "betteralign ./..."

[tasks.gen]
description = "go generate over the module"
run = "go generate ./..."

[tasks."gen:check"]
description = "Verify committed generated files match the generators (fails on drift)"
run = "go generate ./... && git diff --exit-code"

[tasks."sidecar:fetch"]
description = "Download the pinned typst and tinymist releases (SHA-256 verified, idempotent) into internal/sidecar/bin for this platform; all platforms: mise run sidecar:fetch -- -target all"
run = "go run ./cmd/sidecar-fetch"

[tasks.test]
description = "Run tests (gotestsum, readable output)"
depends = ["sidecar:fetch"]
run = "./scripts/heavy.sh ./scripts/rtkx.sh gotestsum --format pkgname -- ./..."

[tasks."test:ci"]
description = "Run tests once, producing a JUnit report AND coverage.out"
depends = ["sidecar:fetch"]
run = "./scripts/heavy.sh ./scripts/rtkx.sh gotestsum --junitfile junit.xml --format pkgname -- -short -timeout=8m -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./..."

[tasks."test:watch"]
description = "Re-run tests on every file change (TDD loop)"
run = "mise watch -t test"

[tasks.bench]
description = "Run Go benchmarks (-benchmem); set BENCH_PATTERN to filter"
run = "./scripts/bench.sh run"

[tasks."bench:baseline"]
description = "Run benchmarks and save bench-baseline.txt (before optimizing)"
run = "./scripts/bench.sh baseline"

[tasks."bench:compare"]
description = "Run benchmarks and benchstat vs baseline (after optimizing)"
run = "./scripts/bench.sh compare"

[tasks.cover]
description = "Test coverage report (coverage.out + total %)"
depends = ["sidecar:fetch"]
run = "./scripts/heavy.sh ./scripts/cover.sh"

[tasks."cover:check"]
description = "Enforce minimum coverage (COVER_MIN); reuses coverage.out from test:ci"
depends = ["test:ci"]
run = "./scripts/cover.sh --check"

[tasks.lint]
description = "Google Go style-guide gate (gofmt + vet + golangci-lint + build)"
depends = ["sidecar:fetch"]
run = "./scripts/rtkx.sh ./scripts/lint.sh"

[tasks."lint:staged"]
description = "Style-guide gate on staged files only (used by the git pre-commit hook)"
run = "./scripts/rtkx.sh ./scripts/lint.sh --staged"

[tasks."lint:sh"]
description = "Lint the bash hook scripts with shellcheck"
run = "shellcheck -x --source-path=SCRIPTDIR .githooks/* .claude/hooks/*.sh .claude/hooks/lib/*.sh scripts/*.sh scripts/netsim/*.sh scripts/pkg/*.sh scripts/pkgtest/*.sh"

[tasks."lint:yaml"]
description = "Lint YAML config formatting with yamlfmt"
run = "yamlfmt -lint .golangci.yml .github/workflows"

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows with actionlint and zizmor (security: pinned actions, injection, secrets)"
run = ["actionlint", "zizmor --offline --min-severity low .github/workflows"]

[tasks."scan:secrets"]
description = "Scan full git history for leaked secrets (gitleaks)"
run = "./scripts/rtkx.sh gitleaks git --redact ."

[tasks."scan:secrets:staged"]
description = "Scan staged changes for secrets (pre-commit gate)"
run = "./scripts/rtkx.sh gitleaks git --staged --redact"

[tasks."scan:code"]
description = "Code vuln scan: gosec (SAST) + govulncheck (reachable CVEs)"
depends = ["sidecar:fetch"]
run = "./scripts/sec-scan.sh"

[tasks."scan:code:staged"]
description = "Code vuln scan on staged Go (pre-commit gate)"
run = "./scripts/sec-scan.sh --staged"

[tasks.sbom]
description = "Generate a CycloneDX SBOM (syft)"
run = "syft scan dir:. --exclude './.claude/**' -o cyclonedx-json=sbom.cdx.json -q"

[tasks."scan:sbom"]
description = "Scan the SBOM for CVEs (grype) — fails on high/critical"
depends = ["sbom"]
run = "./scripts/rtkx.sh grype sbom:sbom.cdx.json --fail-on high"


[tasks.arch]
description = "Dependency rules: libp2p only in transport/p2p, wormhole only in invite, no Go automerge, no network code in sidecar/typst"
run = "./scripts/arch-check.sh"

[tasks.ci]
description = "Everything CI must pass"
depends = ["arch", "scan:secrets", "scan:code", "scan:sbom", "lint", "lint:sh", "lint:yaml", "lint:actions", "pkg:lint", "test:ci", "cover:check", "fe:check"]

# ── Versions and packages (ADR 0025) ──────────────────────────────────────────
# The release is cut by a human: `mise run changelog:next`, `mise run changelog -- --tag vX.Y.Z`,
# commit CHANGELOG.md, tag, push the tag; .github/workflows/release.yml does the rest.
[tasks.changelog]
description = "Regenerate CHANGELOG.md from the Conventional Commits (git-cliff); extra flags: -- --tag v0.1.0-rc.1"
run = "git-cliff --output CHANGELOG.md"

[tasks."changelog:next"]
description = "The next SemVer version the Conventional Commits call for"
run = "git-cliff --bumped-version"

[tasks."fe:build"]
description = "Build the frontend into frontend/dist (what the executable embeds)"
depends = ["fe:install", "fe:bindings"]
dir = "frontend"
run = "pnpm run build"

[tasks."pkg:build"]
description = "Build the executable, tar.gz, .deb and .rpm of THIS machine's architecture into dist/ (goreleaser snapshot, no publish)"
run = "./scripts/pkg/build.sh"

[tasks."pkg:lint"]
description = "Validate the desktop entry, the AppStream metadata and the MIME definition that the packages install"
run = "./scripts/pkg/lint.sh"

[tasks."pkg:test"]
description = "Install the packages of dist/ on fresh Debian, Ubuntu and Fedora containers (podman) and check them (PKG-01…PKG-11); PKG_DISTROS=debian:13 limits it"
run = "./scripts/pkgtest/run.sh"

[tasks."pkg:verify"]
description = "Verify the checksums, the cosign bundle and the SBOMs of a downloaded release (first argument: dir; second: its tag, required for a signed release)"
run = "./scripts/pkg/verify.sh"

[tasks.release]
description = "Native build of one architecture, no publish: the CI release publishes after assembling both (goreleaser, ADR 0025)"
run = "./scripts/pkg/build.sh --release"

[tasks."release:snapshot"]
description = "Local package build, no publish (same as pkg:build)"
run = "./scripts/pkg/build.sh"

[tasks."tools:rtk"]
description = "Best-effort install of rtk (token-optimized task output) — never blocks"
run = '''
if command -v rtk >/dev/null 2>&1; then
  echo "✓ rtk already available: $(rtk --version 2>/dev/null)"
  exit 0
fi
echo "Installing rtk from GitHub releases (prebuilt, non-blocking)…"
mise use -g "github:rtk-ai/rtk@latest" >/dev/null 2>&1 \
  && echo "✓ rtk installed via mise (github releases)" \
  || echo "⚠ rtk not installed — tasks still run, just without token optimization."
exit 0
'''

[tasks.gh]
description = "GitHub CLI via mise + rtk (use: mise run gh -- pr list)"
run = "./scripts/ghx.sh"

[tasks.clean]
description = "Remove regenerable build/scan artifacts + go build cache"
run = "./scripts/clean-artifacts.sh"

[tasks."clean:check"]
description = "Pre-commit gate: tidy artifacts + block any staged artifact"
run = "./scripts/clean-artifacts.sh --check"

[tasks."hooks:install"]
description = "Point git at .githooks (pre-commit + post-commit + pre-push)"
run = "./scripts/install-hooks.sh"

[tasks.setup]
description = "One-shot bootstrap: install tools + wire git hooks (+ optional rtk)"
depends = ["hooks:install", "tools:rtk"]
run = "mise install"

# ── Frontend & desktop app (ADR 0009, 0010) ───────────────────────────────────
[tasks."fe:install"]
description = "Install frontend dependencies from the lockfile (pnpm, age-gated)"
dir = "frontend"
run = "pnpm install --frozen-lockfile"

[tasks."fe:bindings"]
description = "Generate the TypeScript bindings for the Go services"
depends = ["sidecar:fetch"]
run = "wails3 generate bindings -ts -i ./cmd/inkwell"

[tasks."fe:check"]
description = "Frontend gate: Biome, svelte-check, Vitest"
depends = ["fe:install", "fe:bindings"]
dir = "frontend"
run = "pnpm run check"

[tasks."fe:fmt"]
description = "Format and fix the frontend with Biome"
dir = "frontend"
run = "pnpm run fmt"

[tasks."app:dev"]
description = "Run the desktop app with hot reload (wails3 dev)"
run = "wails3 task dev"

[tasks."app:build"]
description = "Build the desktop app for this OS into bin/"
depends = ["fe:install", "sidecar:fetch"]
run = "wails3 task build"

[tasks."e2e:build"]
description = "Build what the end-to-end tests run: frontend, bin/inkwell-server, bin/inkwell-relay, the Playwright browser"
depends = ["fe:install", "fe:bindings", "sidecar:fetch"]
run = """
(cd frontend && pnpm run build)
go build -tags server -o bin/inkwell-server ./cmd/inkwell
CGO_ENABLED=0 go build -o bin/inkwell-relay ./cmd/inkwell-relay
cd frontend
pnpm exec playwright install ${CI:+--with-deps} "${INKWELL_E2E_BROWSER:-$([ -n "${CI:-}" ] && echo webkit || echo chromium)}" >/dev/null
"""

[tasks."e2e"]
description = "End-to-end: two real instances (Wails server mode) driven by Playwright; includes the relay killed and restarted"
depends = ["e2e:build"]
dir = "frontend"
run = """
browser="${INKWELL_E2E_BROWSER:-$([ -n "${CI:-}" ] && echo webkit || echo chromium)}"
INKWELL_E2E_BROWSER="$browser" ../scripts/heavy.sh pnpm exec playwright test
"""

[tasks."e2e:webkit"]
description = "End-to-end under WebKit, as CI runs it, on a machine where Playwright's WebKit does not run (Fedora): WebKit in the official Playwright container (podman), tests and instances on the host"
depends = ["e2e:build"]
dir = "frontend"
run = """
set -eu
version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
# a port per checkout (host network): concurrent worktrees must not share the server
port=${INKWELL_E2E_WS_PORT:-$((37000 + $(printf %s "$PWD" | cksum | cut -d" " -f1) % 1000))}
name="inkwell-webkit-$port"
podman rm -f "$name" >/dev/null 2>&1 || true
podman run -d --rm --name "$name" --network host --ipc host --init \
  "mcr.microsoft.com/playwright:v$version-noble" \
  npx -y "playwright@$version" run-server --port "$port" --host 127.0.0.1 >/dev/null
trap 'podman rm -f "$name" >/dev/null 2>&1 || true' EXIT
for _ in $(seq 60); do (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null && break; sleep 1; done
INKWELL_E2E_BROWSER=webkit INKWELL_E2E_WS="ws://127.0.0.1:$port/" ../scripts/heavy.sh pnpm exec playwright test "$@"
"""

[tasks."mutate:go"]
description = "Mutation testing of Go packages (gremlins), memory-capped: mise run mutate:go -- ./internal/trust"
run = "./scripts/heavy.sh go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash --workers 4 --timeout-coefficient 3"

[tasks."e2e:netsim"]
description = "Network simulation (Chromium; set INKWELL_E2E_BROWSER=chromium in CI), no root: two instances behind NATs (cone, symmetric) and a relay in network namespaces (scripts/netsim); skips with the reason when namespaces or nftables are unavailable (fails in CI)"
depends = ["e2e:build"]
run = "INKWELL_E2E_BROWSER=chromium ./scripts/heavy.sh ./scripts/netsim/run.sh"

[tasks."app:duo"]
description = "Run two isolated instances to try collaboration on one machine (Invite in one, paste the invitation in the other)"
depends = ["app:build"]
run = """
for who in alice bob; do
  mkdir -p .task/duo/$who
  INKWELL_HOME=$PWD/.task/duo/$who/home XDG_DATA_HOME=$PWD/.task/duo/$who/data XDG_CACHE_HOME=$PWD/.task/duo/$who/cache ./bin/inkwell &
done
wait
"""

# ── Hosted open-weight models (mechanical text only — see CLAUDE.md routing) ──
[tasks."llm:commit-msg"]
description = "Draft a Conventional Commit message from the staged diff (OpenRouter, ZDR)"
run = "./scripts/llm.sh commit-msg"

[tasks."ci:triage"]
description = "Failing items of the latest failed GitHub Actions run, reduced by a hosted model (saves Claude context)"
run = """
id=$(./scripts/ghx.sh run list --status failure -L 1 --json databaseId --jq '.[0].databaseId')
./scripts/ghx.sh run view "$id" --log-failed | ./scripts/llm.sh triage
"""

[tasks."llm:triage"]
description = "Reduce a long CI/test log (stdin) to its failing items (OpenRouter, ZDR)"
run = "./scripts/llm.sh triage"

[tasks.icons]
description = "Render the app icon (build/icons/*.svg) to PNG, .ico and .icns; the pre-release (nightly) tree too"
dir = "frontend"
depends = ["fe:install"]
run = [
  "node scripts/render-icons.mjs",
  "mkdir -p ../build/linux/icons-nightly/hicolor/scalable/apps ../build/linux/icons-nightly/hicolor/symbolic/apps",
  "cp ../build/icons/inkwell.svg ../build/linux/icons/hicolor/scalable/apps/io.github.oioio_space.Inkwell.svg",
  "cp ../build/icons/inkwell-nightly.svg ../build/linux/icons-nightly/hicolor/scalable/apps/io.github.oioio_space.Inkwell.svg",
  "cp ../build/icons/inkwell-symbolic.svg ../build/linux/icons/hicolor/symbolic/apps/io.github.oioio_space.Inkwell-symbolic.svg",
  "cp ../build/icons/inkwell-symbolic.svg ../build/linux/icons-nightly/hicolor/symbolic/apps/io.github.oioio_space.Inkwell-symbolic.svg",
  "cd .. && wails3 generate icons -input build/appicon.png -windowsfilename build/windows/icon.ico -macfilename build/darwin/icons.icns",
]
