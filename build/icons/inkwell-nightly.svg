  <rect x="32" y="30" width="74" height="88" rx="11" fill="#c0bfbc"/>
  <rect x="32" y="24" width="74" height="88" rx="11" fill="#ffffff"/>
  <rect x="33" y="25" width="72" height="86" rx="10" fill="none" stroke="#deddda" stroke-width="2"/>
  <g stroke="#deddda" stroke-width="5" stroke-linecap="round"><path d="M46 40h44M46 96h28"/></g>
  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 55c13 0 15 13 30 13" stroke="#3584e4"/>
    <path d="M45 81c13 0 15-13 30-13" stroke="#ff7800"/>
    <path d="M75 68h18" stroke="#813d9c"/>
  </g>
</svg>
