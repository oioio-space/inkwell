# DRAFT - NOT FROZEN. Acceptance for block PC1a (take over a document by a restart: N-5..N-10, the shared restart rules N-11..N-16 and the gate deadline G-1). Rigour: complete. Plan: docs/plans/2026-11-15-pc1a-take-over.md; shared part, restart
# mechanism and formal model: docs/plans/2026-11-14-pc1-project-change-by-restart.md. ADR 0043, part 2. Split on 2026-11-15 from the draft PC1 gate; reviewed by Codex,
# then frozen. The frozen gates/W58.toml stays untouched and superseded (scripts/gate.py has no notion of a superseded
# gate: the convention is these headers and gates/W58/REVIEW.md « Round 6 » and « Round 8 »).
# Every long command is `timeout -k 10 N ./scripts/heavy.sh …` (the timeout covers the wait for a slot). No nested gate.
# Deadline (Codex round 2, D-B): scripts/gate.py refuses caps that sum past max_minutes and stops the run at it (plan rule G-1).
max_minutes = 45
raw_results = ["docs/plans/2026-11-15-pc1a-take-over.md", "docs/plans/2026-11-14-pc1-project-change-by-restart.md", "docs/adr/0043-foreign-project.md", "docs/objectif-en-cours.md", "gates/PC1a/*"]

[[criteria]]
# Each rule row is in the plans (literal « | id | » at a line start), each catalogue key exists, the ADR's status line carries « part 2 PC1a accepted » and not « part 2 PC1a proposed » (ADR 0043, « Status of the parts »).
id = "docs"
command = '''python3 -I - <<'PY'
import json, pathlib, sys
plan = "".join(pathlib.Path(p).read_text() for p in ["docs/plans/2026-11-15-pc1a-take-over.md", "docs/plans/2026-11-14-pc1-project-change-by-restart.md"])
fr = json.load(open("frontend/src/i18n/fr.json"))
rows = ["N-5", "N-6", "N-7", "N-8", "N-9", "N-10", "N-11", "N-12", "N-13", "N-14", "N-15", "N-16", "G-1"]
keys = ["foreign.takeOver", "foreign.takeOver.confirm.title", "foreign.takeOver.confirm.body", "foreign.takeOver.done", "foreign.takeOver.failed", "foreign.takeOver.busy", "change.flushFailed"]
bad = [f"plan row {i}" for i in rows if f"\n| {i} |" not in plan]
bad += [f"fr.json {k}" for k in keys if k not in fr]
st = [l for l in pathlib.Path("docs/adr/0043-foreign-project.md").read_text().splitlines() if l.startswith("status:")]
if not st or "part 2 PC1a accepted" not in st[0] or "part 2 PC1a proposed" in st[0]:
    bad.append("ADR 0043 status line: part 2 PC1a not accepted")
sys.exit(f"PC1a docs: {bad}" if bad else 0)
PY'''

[[criteria]]
# N-5..N-8, N-11..N-13, N-16 in Go: the run succeeds and every named test passes.
id = "go"
command = '''out=$(timeout -k 10 300 ./scripts/heavy.sh go test -count=1 -race -v -run 'TestTakeOver|TestNoTrustWrite|TestRequestsRefused|TestTrustStoreUsable|TestRestart(Only|After|Argv|Execs|Failure|LosesLock)|TestStorageWriteBeforeRequest|TestChangeRequest|TestStartupNotice' ./internal/app/ ./internal/bridge/ ./cmd/inkwell/ 2>&1) || { echo "$out" | tail -40; exit 1; }
for t in TestTakeOverRequestWritesNothing TestTakeOverThenNextStartInvites TestTakeOverArchivesOldList TestTakeOverLeavesTextAndFilesIdentical TestTakeOverCrashAtEachStep TestTakeOverFailureAtEachStep TestTakeOverNoOpForMember TestTakeOverIdDiffersFromOwnProject TestTakeOverNeverAdoptsBeforeShutdown TestTakeOverIdentityOnlyAtNextStart TestTakeOverOutcomeFollowsTheLoadedList TestNoTrustWriteNorSignatureOnceTheWriteStarts TestRequestsRefusedOnceTakeOverRequested TestTrustStoreUsableAfterWiringClose TestRestartOnlyAfterARequestAndOnce TestRestartAfterStopAllReturned TestRestartArgvAndEnvRebuilt TestRestartExecsTheRunningImage TestRestartFailureIsReported TestStartupNoticeShownOnce TestRestartLosesLockToAnotherLaunch TestStorageWriteBeforeRequestLandsOrIsRefused TestChangeRequestClosesBridgeStreamsForGood TestChangeRequestFailsWhenDrainTimesOut; do
  echo "$out" | grep -q -- "--- PASS: $t" || { echo "missing or not passing: $t"; exit 1; }
done'''

[[criteria]]
# G-1: scripts/gate.py refuses caps past max_minutes, stops the run at the deadline, refuses a gate without max_minutes unless legacy.
id = "gate-deadline"
command = '''out=$(timeout -k 10 60 ./scripts/heavy.sh python3 -m unittest -v scripts/gate_deadline_test.py 2>&1) || { echo "$out" | tail -40; exit 1; }
for t in test_caps_over_max_minutes_refused_before_any_run test_run_stopped_at_the_deadline test_gate_without_max_minutes_refused_unless_legacy test_legacy_list_is_closed; do
  echo "$out" | grep -qE "^$t .* ok$" || { echo "missing or not passing: $t"; exit 1; }
done'''

[[criteria]]
# Every PC1a mutant entry exists with its test and an expect text starting with its rule tag.
id = "mutant-tool"
command = '''timeout -k 10 60 ./scripts/heavy.sh python3 -m unittest scripts/netsim/mutants_test.py && python3 -I - <<'PY'
import re, sys, tomllib
ms = {m["id"]: m for m in tomllib.load(open("scripts/netsim/mutants.toml", "rb"))["mutant"] if m.get("block") == "PC1a"}
