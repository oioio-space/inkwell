    sys.exit(f"PC1a frontend: exit {rc}, failed {r['numFailedTests']}, missing {miss}")
PY'''

[[criteria]]
# N-10, N-11 end to end on the built candidate, retries 0, no error, unexpected, flaky or skipped test.
id = "e2e"
command = '''timeout -k 10 240 ./scripts/heavy.sh mise run e2e:build && cd frontend && timeout -k 10 300 ../scripts/heavy.sh ./node_modules/.bin/playwright test e2e/project-change.spec.ts --retries=0 --reporter=json > ../.task/pc1a-e2e.json; rc=$?; cd .. && python3 -I - "$rc" <<'PY'
import json, sys
rc = int(sys.argv[1])
r = json.load(open(".task/pc1a-e2e.json"))
st = r.get("stats", {})
ok = set()
stack = list(r["suites"])
while stack:
    x = stack.pop()
    stack += x.get("suites", [])
    for sp in x.get("specs", []):
        if sp["ok"] and all(t["status"] == "expected" for t in sp["tests"]):
            ok.add(sp["title"])
need = ['PC1-E2E the take-over restarts Inkwell on the same document, writable', 'PC1-E2E nothing of the old session survives the restart', 'PC1-E2E a third profile joins after the take-over and receives the earlier text', 'PC1-E2E the first profile then opens the folder as a readable non-member']
miss = [n for n in need if n not in ok]
if rc or r.get("errors") or st.get("unexpected") or st.get("flaky") or st.get("skipped") or miss:
    sys.exit(f"PC1a e2e: exit {rc}, stats {st}, missing {miss}")
PY'''

