[[criteria]]
# P-1, judged by the gate and not only by the test. The gate draws the seeds (text, keystrokes, file name, path, an
# Automerge-like document id, a peer id, a distinctive expected count) and passes them with -args; the seeded session
# writes its profile (INKWELL_HOME), the pseudonymous export and the network debug snapshot to .task/obs1/privacy. The
# gate then reads stats/key: no file outside `key` holds the key, and no file holds a seed or sha256(document id), in raw,
# JSON-escaped, percent-encoded, hex, base64 at three alignments, UTF-16 LE or BE form; the export's document keys are
# exactly HMAC-SHA-256(key, id)[:8] in hex; the store holds the expected count, so an empty store cannot pass.
id = "privacy"
command = '''set -eu
rm -rf .task/obs1/privacy
mkdir -p .task/obs1/privacy
timeout -k 10 10 python3 -I - <<'PY'
import json, pathlib, secrets
b58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
r = lambda n, a=b58: "".join(secrets.choice(a) for _ in range(n))
seeds = {"text": "canary " + r(16), "keystrokes": "kq" + r(14).lower(), "file_name": "Mémoire-" + r(10) + ".typ",
         "path": "chapitres/" + r(10) + "/notes.typ", "document_id": r(28), "peer_id": "12D3KooW" + r(44),
         "expect_count": 100000 + secrets.randbelow(800000) * 1 + 7}
pathlib.Path(".task/obs1/privacy/seeds.json").write_text(json.dumps(seeds, ensure_ascii=False))
PY
timeout -k 10 120 ./scripts/heavy.sh go test -count=1 -run '^TestOBS1P1SeededSessionHoldsNothingPrivate$' ./internal/obs -args -obs1-seeds="$PWD/.task/obs1/privacy/seeds.json" -obs1-privacy-out="$PWD/.task/obs1/privacy"
timeout -k 10 30 python3 -I - <<'PY'
import base64, hashlib, hmac, json, pathlib, sys, urllib.parse
out = pathlib.Path(".task/obs1/privacy")
seeds = json.loads((out / "seeds.json").read_text())
stats = out / "profile" / "stats"
bad = []
key = (stats / "key").read_bytes() if (stats / "key").is_file() else b""
if len(key) != 32:
    bad.append(f"stats/key holds {len(key)} bytes, not 32")
doc = seeds["document_id"].encode()
private = {k: seeds[k].encode() for k in ("text", "keystrokes", "file_name", "path", "document_id", "peer_id")}
private["sha256(document_id)"] = hashlib.sha256(doc).digest()[:8]
private["key"] = key
def b64_forms(b):
    found = set()
    for k in range(3):  # b starts at byte k of a 3-byte group: keep the characters made of b's bits only
        enc = base64.b64encode(b"\0" * k + b + b"\0\0").decode()
        core = enc[-(-8 * k // 6):8 * (k + len(b)) // 6]
        found |= {core, core.replace("+", "-").replace("/", "_")}
    return found
def forms(b):
    s = b.decode("utf-8", "replace")
    text = {s, json.dumps(s)[1:-1], urllib.parse.quote(s), urllib.parse.quote(s, safe=""), b.hex(), b.hex().upper()}
    text |= b64_forms(b)
    raw = {b} | {x.encode() for x in text if len(x) >= 6} | {s.encode("utf-16-le"), s.encode("utf-16-be")}
    return [x for x in raw if len(x) >= 6]
def scan(f):
    data = f.read_bytes()
    low = data.lower()
    return [f"{f.relative_to(out)} holds {k}" for k, v in private.items()
            if v and not (k == "key" and f == stats / "key") and any(x in data or x.lower() in low for x in forms(v))]
files = sorted(p for p in (out / "profile").rglob("*") if p.is_file()) + [out / n for n in ("export.json", "debug.json")]
for f in files:
    bad += scan(f) if f.is_file() else [f"{f.relative_to(out)} absent"]
days = [p for p in stats.glob("v1/*.json")]
if not days or not any(str(seeds["expect_count"]) in p.read_text() for p in days):
    bad.append("no day file holds the seeded count")
if (out / "export.json").is_file() and key:
    want = hmac.new(key, doc, hashlib.sha256).digest()[:8].hex()
    keys = {r.get("k") for r in json.loads((out / "export.json").read_text()).get("records", []) if r.get("k") != "app"}
    if keys != {want}:
        bad.append(f"export document keys {sorted(map(str, keys))} are not exactly HMAC(key, id)[:8] = {want}")
sys.exit(f"OBS1 privacy: {bad}" if bad else 0)
PY'''

[[criteria]]
# P-3, static half. Go: internal/obs reaches no network, transport, invitation, bridge or protocol code. Webview: the
# modules of src/obs and src/ext/activity, and every module importing src/obs, hold no runtime import (side-effect and
# dynamic ones included; `import type` is erased and allowed) of network, transport or CRDT code, import from the Wails
# bindings nothing but `StatsService`, and call no network API. The dynamic halves are TestOBS1P3NothingLeaves (`go`)
# and the Vitest P-3 (`frontend`).
id = "local-only"
command = '''set -eu
timeout -k 10 30 python3 -I - <<'PY'
import pathlib, re, subprocess, sys
bad = []
r = subprocess.run(["go", "list", "-deps", "./internal/obs/..."], capture_output=True, text=True)
deps = r.stdout.split()
if r.returncode or not deps:
    bad.append(f"go list ./internal/obs/... failed: {r.stderr.strip()[:200]}")
banned = re.compile(r"^(net|net/http|crypto/tls|github\.com/libp2p/.*|github\.com/psanford/wormhole-william.*"
                     r"|github\.com/oioio-space/inkwell/(internal/(transport|invite|bridge)|protocol)(/.*)?)$")
bad += [f"internal/obs reaches {d}" for d in deps if banned.match(d)]
root = pathlib.Path("frontend/src")
code = [p for p in [*root.rglob("*.ts"), *root.rglob("*.svelte")] if ".test." not in p.name and "testkit" not in p.name]
own = [p for p in code if p.is_relative_to(root / "obs") or p.is_relative_to(root / "ext" / "activity")]
if not any(p.is_relative_to(root / "obs") for p in own):
    bad.append("frontend/src/obs has no module")
if not any(p.is_relative_to(root / "ext" / "activity") for p in own):
    bad.append("frontend/src/ext/activity has no module")
stmt = re.compile(r"""(?ms)^\s*import\s+(type\s+)?([^;'"]*?)\s*from\s*["']([^"']+)["']|^\s*import\s*["']([^"']+)["']|import\(\s*["']([^"']+)["']\s*\)|^\s*export\s+(type\s+)?[^;'"]*?\s*from\s*["']([^"']+)["']""")
def specs(text):
    for m in stmt.finditer(text):
        if m.group(3):
            yield bool(m.group(1)), m.group(2), m.group(3)
        elif m.group(4) or m.group(5):
            yield False, "", m.group(4) or m.group(5)
        else:
            yield bool(m.group(6)), "*", m.group(7)
def resolves_to_obs(f, spec):
    if not spec.startswith("."):
        return False
    target = (f.parent / spec).resolve()
    return target.is_relative_to((root / "obs").resolve())
importers = [f for f in code if f not in own and any(resolves_to_obs(f, s) for _, _, s in specs(f.read_text()))]
api = re.compile(r"\b(fetch|WebSocket|XMLHttpRequest|sendBeacon|EventSource|RTCPeerConnection)\s*\(|\bnew\s+(WebSocket|EventSource|RTCPeerConnection)\b")
net = re.compile(r"(^|/)net(/|$)|automerge|@libp2p|(^|/)transport(/|$)|WailsNetworkAdapter|amSync")
for f in own + importers:
    text = f.read_text()
    for type_only, names, spec in specs(text):
        if type_only:
            continue
        if "/bindings/" in spec:
            got = {n.strip().split(" as ")[0] for n in names.strip("{} \n").split(",") if n.strip()}
            if got != {"StatsService"}:
                bad.append(f"{f}: imports {sorted(got) or 'everything'} from the bindings")
        elif net.search(spec):
            bad.append(f"{f}: imports {spec}")
    for n, line in enumerate(text.splitlines(), 1):
        if not line.lstrip().startswith(("//", "*")) and api.search(line):
            bad.append(f"{f}:{n}: network API")
sys.exit(f"OBS1 local-only: {bad}" if bad else 0)
PY'''

[[criteria]]
# Each rule test must fail when its rule breaks. Block OBS1's mutants (scripts/netsim/mutants.toml, written at step 2
# with the code) each break one rule; a vitest entry's `name` equals one of the `frontend` criterion's exact titles, a go
# entry names its rule's test with an `expect` text, so only that test failing is a catch.
id = "mutants"
command = '''set -eu
timeout -k 10 20 python3 -I - <<'PY'
import re, sys, tomllib
gate = tomllib.load(open("gates/OBS1.toml", "rb"))
front = next(c["command"] for c in gate["criteria"] if c["id"] == "frontend")
titles = {t: t.split()[1] for t in re.findall(r'"(OBS1 [A-Z]-\d [^"]+)"', front)}
ms = [m for m in tomllib.load(open("scripts/netsim/mutants.toml", "rb"))["mutant"] if m.get("block") == "OBS1" and not m.get("retired")]
go = {"V-2": "TestOBS1V2DeclareAndBatchValueRule", "V-3": "TestOBS1V3DebugSnapshotRedacted",
      "S-1": "TestOBS1S1DailyAggregation", "S-2": "TestOBS1S2CrashLosesAtMostOneInterval",
      "S-3": "TestOBS1S3RetentionAndBound", "P-1": "TestOBS1P1SeededSessionHoldsNothingPrivate",
      "P-2": "TestOBS1P2StoreOutsideProjects", "P-3": "TestOBS1P3NothingLeaves",
      "P-4": "TestOBS1P4ExportOnlyAskedOutsideProjects", "P-5": "TestOBS1P5EraseRemovesKey",
      "P-6": "TestOBS1P6SwitchOffWritesNothing", "Z-1": "TestOBS1Z1AddIsFree", "Z-5": "TestOBS1Z5LinkCountersSummedOnRead"}
seen_v, seen_g = set(), set()
for m in ms:
    if m.get("kind") == "vitest" and m.get("name") in titles and m.get("test", "").startswith("frontend/src/"):
        seen_v.add(titles[m["name"]])
    elif m.get("kind") == "go" and m.get("test") in go.values() and m.get("expect"):
        seen_g.add(next(r for r, t in go.items() if t == m["test"]))
missing = sorted((set(titles.values()) - seen_v) | {f"go {r}" for r in set(go) - seen_g})
if len(titles) != 9:
    missing.append(f"the frontend criterion lists {len(titles)} titles, not 9")
sys.exit(f"OBS1 mutants: no named mutant for rules {missing}" if missing else 0)
PY
timeout -k 10 300 ./scripts/heavy.sh python3 -I scripts/netsim/mutants.py OBS1'''

