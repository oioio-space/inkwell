import pathlib, re, sys
bad = []
plan = pathlib.Path("docs/plans/2026-11-24-obs1-observability.md").read_text()
rows = ["M-1", "M-2", "M-3", "V-1", "V-2", "V-3", "T-1", "T-2", "S-1", "S-2", "S-3",
        "P-1", "P-2", "P-3", "P-4", "P-5", "P-6", "Z-1", "Z-2", "Z-4", "Z-5", "Z-6"]
