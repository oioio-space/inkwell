# Written 2026-11-24 at step 1 of block OBS1, before any code; revised 2026-11-25 after the blind Opus review
# (gates/OBS1/REVIEW.md, « accept with corrections », 3 major findings answered at their root); frozen 2026-11-25
# (standard tier: the blind Opus review is the spec review; Gemini, quota exhausted, reviews the code after the smoke).
# OBS1: one `metrics` point of the contribution registry, a local daily store under INKWELL_HOME, nothing sent or
# synced, zero cost when unused. Rigour: standard. Plan: docs/plans/2026-11-24-obs1-observability.md (rules M, V, T, S,
# P, Z of its section 4); witnesses: gates/OBS1/WITNESSES.md.
