# Caps: 30 + 420 + 180 + (10 + 120 + 30) + 30 + (20 + 300) + 1200 + 300 + 30 = 2670 s <= 2700 s (rule G-1), each set
# from a measured run (gates/OBS1/WITNESSES.md). `bench` and `perf-start` are exclusive: they wait for an idle machine.
