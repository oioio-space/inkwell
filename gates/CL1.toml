command = '''base=$(git merge-base HEAD main) && files=$( { git diff --name-only --diff-filter=d "$base" -- frontend/src | grep -E '[.]test[.]ts$' | sed 's#^frontend/##'; cd frontend && ls src/ui/history/*.test.ts src/history/*.test.ts; } | sort -u | tr '\n' ' ') && timeout -k 10 30 mise run fe:bindings && cd frontend && timeout -k 10 180 ../scripts/heavy.sh sh -c "pnpm exec biome check . && pnpm exec svelte-check --tsconfig ./tsconfig.json && pnpm exec vitest run --configLoader runner $files"'''

