[[criteria]]
# No regression: frontend checks and every flow that pairs or joins (each such join restarts the joiner since PC1b).
id = "regression"
# The user's decision of 2026-11-15 (gates/PC1b.toml, plan « Gate change on the user's word ») is kept: the Vitest
# part is the test files the block added or modified; the whole suite runs in `mise run ci`. The e2e part is now the
# specs that call `pair`, `joinAs` or `acceptJoin` (netsim.spec.ts belongs to PC1n/PC1n2, project-change.spec.ts to
# the e2e criterion), listed when the criterion runs so that a spec added later is not forgotten.
command = '''base=$(git merge-base HEAD main) && files=$(git diff --name-only --diff-filter=d "$base" -- frontend/src | grep -E '[.]test[.]ts$' | sed 's#^frontend/##' | tr '\n' ' ') && specs=$(cd frontend && grep -lE 'pair\(|joinAs\(|acceptJoin\(' e2e/*.spec.ts e2e/ux/*.spec.ts | grep -vE '(netsim|project-change)[.]spec[.]ts$' | tr '\n' ' ') && [ -n "$specs" ] && timeout -k 10 30 mise run fe:bindings && cd frontend && timeout -k 10 60 ../scripts/heavy.sh sh -c "pnpm exec biome check . && pnpm exec svelte-check --tsconfig ./tsconfig.json && { [ -z '$files' ] || pnpm exec vitest run --configLoader runner $files; }" && cd .. && timeout -k 10 400 ./scripts/heavy.sh mise run e2e -- $specs --retries=0'''

