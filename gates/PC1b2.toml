# contract change is stated, compared old/new and recorded, never an edit of a frozen gate). Block PC1b (an accepted
# invitation restarts Inkwell: J-1..J-7 and the drain N-16 on the join path, on PC1a's restart), its work re-applied on
# main 8a23f84 (PU1, HP1, WC1, CL1, CI3 since its base e637035). Rigour: complete. Plan:
# docs/plans/2026-11-15-pc1b-join.md (section « Re-applied on main and gates of 2026-11-23 »); shared part, restart
# mechanism and formal model: docs/plans/2026-11-14-pc1-project-change-by-restart.md. ADR 0043, part 2. The network
# proof is in gates/PC1n.toml and gates/PC1n2.toml (not nested: run alone, after this one).
# Every PC1b criterion is kept verbatim except these changes, one reason each:
# - docs: the plan rows include J-7 (the restart line the network gates read, new on 2026-11-23);
# - go: TestFinishJoinConsumesTheDesktopApproval (WC1's approval consumed at FinishJoin) and TestRestartLogsOneLine
#   (J-7; absent at step 1, so red until step 2) named; cap 300 -> 120 s (measured 19 s);
# - mutant-tool: MJ1..MJ20, not MJ1..MJ16 (MJ17..MJ19 came with the code review and the walkthrough; MJ20, J-7's « the
#   line removed », expect `J-7 restart line`, test TestRestartLogsOneLine, is frozen here: its anchor is written at
#   step 2, so this criterion is red until then);
# - mutants: cap 900 -> 300 s (nineteen mutants in 74 s on 2026-11-15);
# - frontend: cap 180 -> 60 s (measured 5 s, 52 tests); report path .task/pc1b2-fe.json;
# - e2e: run cap 300 -> 240 s (measured 88 s, nine tests); report path .task/pc1b2-e2e.json;
# - regression: the e2e part runs every spec that pairs or joins (helpers `pair`, `joinAs`, `acceptJoin`), since each
#   such join now restarts the joiner: on this tree `offline.spec.ts` fails on a second `status` element (the join
#   notice), which the old three-spec list never ran; frontend cap 180 -> 60 s (measured 8 s);
# - webkit-native (new): WC1's runner (scripts/wc1-webkit.sh) with WC1's oracles for SAV-03b and SHEET-MU-01b, plus
#   the native join `TestWC1NativeClose/PC1b-join`: on the desktop build a join is confirmed through the close
#   coordinator's project approval and the process restarts in place (same pid). Red at step 1, two named reasons:
#   the native SHEET-MU-01b's guest join stays held (the probe can neither confirm « Redémarrer et ouvrir » nor
#   follow a restart in place, so the guest keeps its own document and `sheet` never finds `#cell-2-2`), and
#   `TestWC1NativeClose/PC1b-join` does not exist. The browser SHEET-MU-01b passes since its fixture shows the table
#   again after the join restart (`tableAfterJoin`; the view mode is page memory);
#   a third, known and not PC1b's: WC1's TestWC1NativeRecovery is intermittent on main too (wc1_native_test.go:813,
#   gates/PC1b/SIMPLIFY.md → WC1);
# - ux-walkthrough: a walkthrough of the rebased tree, gates/PC1b2/UX.md (gates/PC1b/UX.md predates WC1's close and
#   HP1's upgrade: the join's restart now passes through « Enregistrement… »);
# - the header without « DRAFT » (gates/PC1b.toml was frozen with a stale « DRAFT - NOT FROZEN » line).
# Every long command is `timeout -k 10 N ./scripts/heavy.sh …` (the timeout covers the wait for a slot). No nested gate.
# Deadline: scripts/gate.py refuses caps that sum past max_minutes (PC1a rule G-1). Caps (measured on 2026-11-23):
# go 120 (19 s), mutant-tool 60, mutants 300 (74 s), frontend 60 (5 s), e2e 240 + 240 (7 s warm, 88 s), regression
# 30 + 60 + 400 (1 s, 8 s, 266 s for the fourteen specs that pair or join), tla 200, webkit-native 960 (WC1's cap):
# 2670 s of 2700 s.
max_minutes = 45
raw_results = ["docs/plans/2026-11-15-pc1b-join.md", "docs/plans/2026-11-14-pc1-project-change-by-restart.md", "docs/adr/0043-foreign-project.md", "docs/objectif-en-cours.md", "gates/PC1b/*", "gates/PC1b2/*"]

