[[criteria]]
# WC1's desktop path on the join (new): WC1's runner, WC1's oracles for SAV-03b and SHEET-MU-01b (WebKit and Chromium
# browser regressions, the native GTK walk and its window-manager close lifecycle), and the native join
# `TestWC1NativeClose/PC1b-join`, a subtest of the test the runner already selects. Its lifecycle trace (scenario
# « PC1b-join » in native-lifecycle.jsonl) is, in this order: join-held (the guest's Join answered a restart, the Welcome
# held), close-authorized (the coordinator's project approval, WC1), process-restarted (same pid, another startup id:
# the execution in place, N-12), project-joined (the new image shows the host's text and the guest is a member).
id = "webkit-native"
command = '''set -eu
out="$(realpath .task)/pc1b2-wc1"
rm -rf "$out" && mkdir -p "$out"
timeout -k 10 960 bash -s -- "$out" <<'PC1B2_NATIVE'
set -eu
out="$1"
./scripts/heavy.sh bash scripts/wc1-webkit.sh "$out"
python3 -I - "$out" <<'PY'
import json, sys
from pathlib import Path

out = Path(sys.argv[1])
report = json.loads((out / "webkit.json").read_text())
scenarios = ("SAV-03b", "SHEET-MU-01b")
expected = {(project, case) for project in ("webkit", "chromium") for case in scenarios}
suites = list(report["suites"])
passed = set()
while suites:
    suite = suites.pop()
    suites.extend(suite.get("suites", []))
    for spec in suite.get("specs", []):
        scenario = spec["title"].split()[0]
        for test in spec["tests"]:
            if (test["status"] == "expected"
                    and [r["status"] for r in test["results"]] == ["passed"]):
                passed.add((test["projectName"], scenario))
if expected - passed or report.get("errors"):
    sys.exit(f"PC1b2 browser regressions missing or failing: {sorted(expected - passed)}")

required = {"TestWC1NativeClose", "TestWC1NativeRecovery"}
required.update(f"TestWC1NativeClose/{case}" for case in (*scenarios, "PC1b-join"))
events = [json.loads(line) for line in (out / "native.jsonl").read_text().splitlines()]
terminal = {e.get("Test"): e["Action"] for e in events
            if e.get("Package") == "github.com/oioio-space/inkwell/cmd/inkwell"
            and e["Action"] in {"pass", "fail", "skip"}}
bad = {test: terminal.get(test, "absent") for test in required if terminal.get(test) != "pass"}
bad.update({test: action for test, action in terminal.items()
            if test and test.split("/")[0] in required and action != "pass"})
if bad:
    sys.exit(f"PC1b2 native scenarios missing or failing: {bad}")

trace = [json.loads(line) for line in (out / "native-lifecycle.jsonl").read_text().splitlines()]
for scenario, prepared, oracle in (
    ("SAV-03b", "input-accepted", ["save-ack-durable"]),
    ("SHEET-MU-01b", "selection-visible", ["goodbye-handed-off", "remote-selection-cleared"]),
):
    expected_trace = [prepared, "wm-close-sent", "gtk-close-request", "wails-close-vetoed",
                      *oracle, "close-authorized", "close-permit-consumed", "gtk-window-destroyed",
                      "process-exited", "process-relaunched", "project-reopened"]
    rows = [e for e in trace if e["scenario"] == scenario]
    if [e["event"] for e in rows] != expected_trace:
        sys.exit(f"PC1b2 native {scenario}: incorrect window-manager close lifecycle")
    for field in ("request", "window"):
        if not rows[0][field] or any(e[field] != rows[0][field] for e in rows):
            sys.exit(f"PC1b2 native {scenario}: mismatched {field} identity")
    old_pid, new_pid = rows[0]["pid"], rows[-1]["pid"]
    if (not all(type(pid) is int and pid > 0 for pid in (old_pid, new_pid))
            or old_pid == new_pid or rows[-3].get("exit_code") != 0
            or any(e["pid"] != old_pid for e in rows[:-2])
            or any(e["pid"] != new_pid for e in rows[-2:])):
        sys.exit(f"PC1b2 native {scenario}: no clean exit and distinct process relaunch")
rows = [e for e in trace if e["scenario"] == "PC1b-join"]
events = [e["event"] for e in rows]
want = ["join-held", "close-authorized", "process-restarted", "project-joined"]
it = iter(events)
if not rows or not all(w in it for w in want):
    sys.exit(f"PC1b2 native join: trace {events}, want the subsequence {want}")
pids = {e["pid"] for e in rows}
if len(pids) != 1 or not all(type(p) is int and p > 0 for p in pids):
    sys.exit(f"PC1b2 native join: the restart is not in place (pids {sorted(pids)})")
PY
PC1B2_NATIVE'''

