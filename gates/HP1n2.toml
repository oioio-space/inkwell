# FROZEN 2026-11-16 after two Codex reviews (gates/HP1/WITNESSES.md, plan « Codex debate »). Fourth gate of block HP1, run on the same candidate after gates/HP1.toml, HP1m and HP1n (header
# of gates/HP1.toml: five gates, split on 2026-11-16 to fit rule G-1's 45 min without dropping a proof of plan §9).
# Plan: docs/plans/2026-11-16-hp1-direct-upgrade.md; models docs/protocol/tla/DirectUpgrade.tla,
# alloy/DirectUpgradeRoles.als. This gate: scenario 8 in both variants on three seeds, and the netsim mutant MN1 (HP1
# disabled). Wall-clock criteria take the machine with `heavy.sh --exclusive`; every command is capped; scripts/gate.py
# refuses caps past max_minutes (PC1a rule G-1). Red witnesses: gates/HP1n2/WITNESSES.md.
max_minutes = 45
raw_results = ["docs/plans/2026-11-16-hp1-direct-upgrade.md", "docs/protocol/tla/DirectUpgrade.tla", "docs/protocol/alloy/DirectUpgradeRoles.als", "gates/HP1n2/*"]

[[criteria]]
# Plan §1 (b) and §9: scenario 8, editor and reader variants, seeds 20771, 20772, 20773, once each, strict: every clause
# passes on every run (on PC1b's return, plan §10, the reader variant is where the lost push showed).
id = "netsim"
command = '''rm -f .task/netsim/results/8-editor-s2077[123].json .task/netsim/results/8-reader-s2077[123].json && timeout -k 10 240 ./scripts/heavy.sh mise run e2e:build && { NETSIM_SCENARIOS=8 NETSIM_VARIANTS="editor reader" NETSIM_SEEDS="20771 20772 20773" NETSIM_EXPECT=strict INKWELL_E2E_BROWSER=chromium INKWELL_PERF_LOAD_WAIT=180 timeout -k 10 1300 ./scripts/heavy.sh --exclusive ./scripts/netsim/run.sh; rc=$?; python3 -I - "$rc" <<'PY'
import json, pathlib, sys
bad = []
for run in ("8-editor", "8-reader"):
    for seed in (20771, 20772, 20773):
        p = pathlib.Path(f".task/netsim/results/{run}-s{seed}.json")
        if not p.exists():
            bad.append(f"{p.name} missing")
            continue
        r = json.loads(p.read_text())
        got = {c["id"] for c in r["clauses"]}
        red = [f'{c["id"]} {c["status"]}: {c.get("measured", "")[:80]}' for c in r["clauses"] if c["status"] != "pass"]
        if r.get("expect") != "strict" or not {"C1", "C2", "C3", "C4", "C5"} <= got or red:
            bad.append(f"{p.name}: expect {r.get('expect')}, missing {sorted({'C1', 'C2', 'C3', 'C4', 'C5'} - got)}, red {red}")
if int(sys.argv[1]) or bad:
    sys.exit(f"HP1n2 netsim: exit {sys.argv[1]}, {bad}")
PY
}'''

