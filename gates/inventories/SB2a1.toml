# The mandatory inventory of block SB2a1 (decision D7, plan docs/plans/2026-11-14-sb2-sandbox-tiers.md « The mandatory
# inventory »), frozen with gates/SB2a1.toml. Read by scripts/gojson_check.py (columns local-N, local-F: the `go`
# criterion) and scripts/gh-verdict.py (columns stock-amd64, arm64: the `github` criterion), both added by the block.
#
# One [[test]] per test name, exactly as `go test -json` reports it (subtests with their path). Cell values:
#   "pass"               the test must report pass in that column;
#   "pass|n-unavailable" pass, or n-unavailable — accepted only in an N cell, and only when that test's tier report
#                        line says tier N is unavailable on that machine; a distinct status, never counted as a pass;
#   "refused"            the test must report the refusal of the sandbox with its sentence (arm64 until SB2a2);
#   "-"                  the test is not part of that column (it must not be required there; if it runs, it must pass).
# Rules: no skip is accepted in an F cell; a missing required cell, a failure, an extra skip or an unknown status fails;
# the local columns are one `-json` run on the development machine, where tier N is decided and tier F is forced.
columns = ["local-N", "local-F", "stock-amd64", "arm64"]

