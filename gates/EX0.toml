out="${INKWELL_PERF_OUT:-.task/ex0/perf}"
mkdir -p "$out"
INKWELL_PERF_OUT="$out" timeout -k 10 600 ./scripts/heavy.sh --exclusive python3 scripts/perf/baseline.py > "$out/baseline.log" 2>&1 || { tail -40 "$out/baseline.log"; exit 1; }
python3 -I - "$out" <<'PY'
import json, pathlib, subprocess, sys
