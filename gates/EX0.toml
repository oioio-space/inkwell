g = ms.get("MX13", {})
if g.get("kind") != "go" or g.get("test") != "TestEX0FileListV2" or not g.get("expect", "").startswith("R-9 "):
    bad.append("MX13")
for d in ("valid", "invalid"):
    if not list(pathlib.Path("frontend/src/extensions/testdata/manifests", d).glob("*.json")):
        bad.append(f"no vector in testdata/manifests/{d}/")
sys.exit(f"EX0 mutants: entries or vectors missing or wrong: {bad}" if bad else 0)
PY
timeout -k 10 300 ./scripts/heavy.sh python3 -I scripts/netsim/mutants.py EX0'''

[[criteria]]
# R-11 and the migration, end to end in Chromium (WebKit runs in CI on push): the files open by type (FM-OPEN), two CSV
# scenarios, EX0-E1 (which chunks load: main.typ none of the lazy ones, a CSV its grid, a Markdown file its grammar, read from
# the requests the page makes) and EX0-E2 (PERF-EXT-VIEWER-CSV, scenario in the plan: app already running, page
# reloaded and main.typ editable before each run, click in the file panel, marks ex0:open -> ex0:first-render read with
# performance.getEntriesByName, 1 warm-up + 10 runs, nearest-rank p95 = the slowest of the 10, <= 200 ms). Exclusive slot for the timing; first attempt only, nothing skipped.
id = "e2e"
command = '''set -eu
mkdir -p .task/ex0
rm -f .task/ex0/e2e.json
timeout -k 10 200 ./scripts/heavy.sh mise run e2e:build
rc=0
(cd frontend && PLAYWRIGHT_JSON_OUTPUT_NAME=../.task/ex0/e2e.json INKWELL_E2E_BROWSER=chromium timeout -k 10 240 ../scripts/heavy.sh --exclusive ./node_modules/.bin/playwright test files.spec.ts sheet.spec.ts ex0.spec.ts --grep "FM-OPEN-1|CSV-DIALECT|CSV-14|EX0-E1|EX0-E2" --reporter=json > /dev/null) || rc=$?
