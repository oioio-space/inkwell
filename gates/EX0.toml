# (gates/EX0/SPEC-REVIEW.md, « accepter avec corrections », applied) and a blind Opus review (gates/EX0/REVIEW-2.md,
# « accept with corrections »: 1 blocking and 3 major findings fixed at their root before this freeze).
# EX0, slice 1: one registry of contributions, the file-type, viewer and grammar points, built-in types migrated onto it,
# lazy entries, Go without a name table. Rigour: standard. Plan: docs/plans/2026-11-24-ex0-contribution-registry.md;
# decision: docs/adr/0027-contribution-registry.md. Witnesses: gates/EX0/WITNESSES.md. Written before any production change.
# Revised after the cross-family review gates/EX0/SPEC-REVIEW.md (findings 1-6; the integrator's decisions are in ADR 0027)
