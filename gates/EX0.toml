[[criteria]]
# R-10 on the build artefact (review round 2, finding 2): built with sourcemaps, no chunk of the start closure
# (index.html and App.svelte with their static imports) holds a source of what ADR 0027 rule 9 says leaves the start:
# Markdown (@codemirror/lang-markdown, @lezer/markdown), the grid (src/ui/sheet/), the native entries of the lazy
# built-ins. A JS chunk of the start closure without a sourcemap must be under 1 KiB (only Vite's generated
# modulepreload polyfill is). The lazy entries are dynamic entries of their own, and the types csv, markdown and png are
# not contributed at startup, so the check cannot pass with everything eager.
id = "chunks"
command = '''set -eu
mkdir -p .task/ex0
rm -rf .task/ex0/chunks
(cd frontend && timeout -k 10 120 ../scripts/heavy.sh pnpm --config.verifyDepsBeforeRun=false exec vite build --configLoader runner --mode production --manifest --sourcemap --outDir ../.task/ex0/chunks --emptyOutDir) > .task/ex0/chunks.log 2>&1 || { tail -30 .task/ex0/chunks.log; exit 1; }
timeout -k 10 30 python3 -I - <<'PY'
import json, pathlib, sys
out = pathlib.Path(".task/ex0/chunks")
m = json.loads((out / ".vite/manifest.json").read_text())
bad = []
if "src/App.svelte" not in m:
    bad.append("App.svelte is not a chunk of the build any more")
seen, stack = set(), ["index.html", "src/App.svelte"]
while stack:
    k = stack.pop()
    if k in m and k not in seen:
        seen.add(k)
        stack.extend(m[k].get("imports", []))
start = sorted({m[k]["file"] for k in seen})
mans = sorted(pathlib.Path("frontend/src/ext").glob("*/inkwell-plugin.json"))
lazy_dirs, lazy_types = [], set()
for f in mans:
    man = json.loads(f.read_text())
    if "startup" in man.get("activation", []):
        continue
    contributes = man.get("contributes", {})
    lazy_types |= {t["id"] for t in contributes.get("fileTypes", [])}
    if any(c.get("entry") for p in ("viewers", "grammars") for c in contributes.get(p, [])):
        lazy_dirs.append(f"frontend/src/ext/{f.parent.name}/native/")
    for point in ("viewers", "grammars"):
        for c in contributes.get(point, []):
            key = (f.parent / c["entry"]).relative_to("frontend").as_posix()
            if key not in m or not m[key].get("isDynamicEntry"):
                bad.append(f"{key}: not a dynamic chunk of its own")
forbidden = ["@codemirror/lang-markdown/", "@lezer/markdown/", "frontend/src/ui/sheet/", *lazy_dirs]
for file in start:
    path = out / file
    mp = out / (file + ".map")
    if not mp.is_file():
        if file.endswith(".js") and path.stat().st_size >= 1024:
            bad.append(f"{file}: start chunk of {path.stat().st_size} bytes without a sourcemap")
        continue
    for src in json.loads(mp.read_text())["sources"]:
        if any(x in src for x in forbidden):
            bad.append(f"{file} holds {src.split('node_modules/')[-1]}")
if not mans:
    bad.append("no built-in manifest under frontend/src/ext")
bad += [f"type {t} is contributed at startup or missing" for t in ("csv", "markdown", "png") if t not in lazy_types]
sys.exit(f"EX0 chunks: {len(bad)} problems: {bad[:40]}" if bad else 0)
PY'''

[[criteria]]
# Review findings 6 (round 1) and 3 (round 2): a rule test that asserts nothing must fail the gate. Block EX0's mutants
# MX1..MX14 (scripts/netsim/mutants.toml, written at step 2 with the code) each break one rule; every vitest entry names
# the exact title of its rule's test (`name`), so only that test failing is a catch (scripts/netsim/mutants.py); MX13 is
