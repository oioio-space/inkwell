command = '''set -eu
timeout -k 10 20 python3 -I - <<'PY'
import pathlib, re, sys, tomllib
ms = {m["id"]: m for m in tomllib.load(open("scripts/netsim/mutants.toml", "rb"))["mutant"] if m.get("block") == "EX0"}
rule = {"MX1": "R-1 ", "MX2": "R-12 ", "MX3": "R-3 ", "MX4": "R-4 ", "MX5": "R-5 ", "MX6": "R-13 ", "MX7": "R-6 ",
        "MX8": "R-14 ", "MX9": "R-7 ", "MX10": "R-2 ", "MX11": "R-8 ", "MX12": "R-9 ", "MX14": "R-15 "}
bad = []
for i, tag in rule.items():
    m = ms.get(i, {})
    if (m.get("kind") != "vitest" or m.get("retired") or not m.get("test", "").startswith("frontend/src/")
            or not m.get("name", "").startswith("EX0 " + tag)):
