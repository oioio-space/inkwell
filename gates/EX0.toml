[[criteria]]
# The decision and its amendments are written: ADR 0027 with its sections, the plan's rule rows R-1..R-15, spec MF-14
# no longer embeds the table in Go, the §4.4 target row `src/filetypes` is merged into `src/extensions`, AD-51 says it is
# superseded, and the requirement rows U26 and N20 point at the plan.
id = "docs"
command = '''timeout -k 10 30 python3 -I - <<'PY'
import pathlib, re, sys
bad = []
adr = pathlib.Path("docs/adr/0027-contribution-registry.md")
text = adr.read_text() if adr.is_file() else ""
if not re.search(r"^status: (proposed|accepted)\b", text, re.M):
    bad.append("ADR 0027 absent or without status")
bad += [f"ADR 0027 lacks {h!r}" for h in ("## Considered options", "## Decision", "### Never exposed", "### The file list Go sends is local", "### Confirmation") if h not in text.splitlines()]
plan = pathlib.Path("docs/plans/2026-11-24-ex0-contribution-registry.md")
rows = plan.read_text() if plan.is_file() else ""
bad += [f"plan row R-{i}" for i in range(1, 16) if f"\n| R-{i} |" not in rows]
spec = pathlib.Path("docs/architecture/spec.md").read_text()
mf14 = spec[spec.index("- **MF-14**"):spec.index("- **MF-15**")]
if "embarquée par Go" in mf14 or "ADR 0027" not in mf14:
    bad.append("spec MF-14 still embeds the table in Go, or does not name ADR 0027")
if re.search(r"^\| `src/filetypes` ", spec, re.M):
    bad.append("spec §4.4 still has the src/filetypes target row")
dec = pathlib.Path("docs/architecture/decisions.md").read_text()
ad51 = dec[dec.index("### AD-51"):dec.index("### AD-52")]
if "ADR 0027" not in ad51 or not re.search(r"[Rr]emplacée|superseded", ad51):
    bad.append("AD-51 is not marked superseded by ADR 0027")
req = pathlib.Path("docs/exigences.md").read_text()
for rid in ("U26", "N20"):
    row = next((l for l in req.splitlines() if l.startswith(f"| {rid} |")), "")
    if "2026-11-24-ex0-contribution-registry.md" not in row:
        bad.append(f"requirement {rid} does not point at the EX0 plan")
sys.exit(f"EX0 docs: {bad}" if bad else 0)
PY'''

[[criteria]]
# P-EXT-1, static part (review round 2, finding 4). Webview, every .ts and .svelte file outside tests and comment lines:
# no identifier of the old lists, no extension literal or extension regex, no bare type id or format word in a string
# literal (comparisons, arrays, `includes`, `endsWith("csv")`), and no name split on its dot (only the registry parses
# names: frontend/src/extensions/ is exempt from that last rule only). The type-id reads that remain are listed by file
# with the literals each may hold: EX0c moves them to the toolbar, menu and status points; client.ts is the LSP
# language id of the closed Typst engine (K-7). Go: no name table in internal/project, no kind on the file list.
id = "no-lists"
command = '''timeout -k 10 30 python3 -I - <<'PY'
import pathlib, re, sys
ALLOWED = {  # file: (tag, literals it may hold)
    "frontend/src/App.svelte": ("EX0c presentation", {"typst"}),
    "frontend/src/editor/format/commands.ts": ("EX0c format bar", {"typst"}),
    "frontend/src/editor/format/support.ts": ("EX0c format bar", {"typst", "markdown"}),
    "frontend/src/editor/format/insert.ts": ("EX0c Insert menu", {"typst", "csv", "json", "yaml", "toml", "xml"}),
    "frontend/src/editor/stats/words.ts": ("EX0c status: word count", {"typst", "markdown"}),
    "frontend/src/editor/setup.ts": ("EX0c Typst writing help", {"typst"}),
    "frontend/src/ui/shell/StatusBar.svelte": ("EX0c status: Typst problems", {"typst"}),
    "frontend/src/ui/toolbar/InsertMenu.svelte": ("EX0c Insert menu", {"typst", "markdown", "csv", "tsv", "psv", "bibtex", "json", "yaml", "toml", "xml", "png", "jpeg", "gif", "webp", "svg", "bmp", "pdf"}),
    "frontend/src/ui/toolbar/spec.ts": ("EX0c format bar", {"typst", "markdown"}),
    "frontend/src/language/problems.svelte.ts": ("EX0c diagnostics source", {"csv"}),
    "frontend/src/language/client.ts": ("K-7 LSP language id", {"typst"}),
}
WORDS = r"typst|typ|markdown|md|csv|tsv|psv|bib|bibtex|json|ya?ml|toml|xml|png|jpe?g|gif|webp|svg|bmp|pdf"
ident = re.compile(r"\b(langOf|isTabular|FileKind|forLang|looksTabular)\b")
dotted = re.compile(r"""["'`]\.(%s|markdown|tab|txt|cbor)["'`]""" % WORDS)
regex = re.compile(r"\\\.\(?(%s|txt)\b" % WORDS)
bare = re.compile(r"""["'`](%s)["'`]""" % WORDS)
split = re.compile(r"""\b(split|lastIndexOf|indexOf)\(\s*["'`]\.["'`]\s*\)|\.extname\(""")
bad = []
for f in sorted([*pathlib.Path("frontend/src").rglob("*.ts"), *pathlib.Path("frontend/src").rglob("*.svelte")]):
    s = f.as_posix()
    if ".test." in f.name or "testkit" in f.name:
        continue
    tag, allowed = ALLOWED.get(s, ("", set()))
    for n, line in enumerate(f.read_text().splitlines(), 1):
        if line.lstrip().startswith(("//", "*", "/*", "<!--")):
            continue
        why = []
        if ident.search(line):
            why.append("old list")
        if dotted.search(line) or regex.search(line):
            why.append("extension")
        extra = {w for w in bare.findall(line)} - allowed
        if extra:
            why.append("type id " + ",".join(sorted(extra)))
        if split.search(line) and not s.startswith("frontend/src/extensions/"):
            why.append("name split")
        if why:
            bad.append(f"{s}:{n} ({'; '.join(why)})")
for f in sorted(pathlib.Path("internal/project").glob("*.go")):
    t = f.read_text()
    if not f.name.endswith("_test.go") and ("extKinds" in t or re.search(r"^type Kind\b", t, re.M)):
        bad.append(f"{f.as_posix()}: name table or Kind")
for f in sorted(pathlib.Path("internal/bridge").glob("*.go")):
    if not f.name.endswith("_test.go") and "project.Kind" in f.read_text():
        bad.append(f"{f.as_posix()}: project.Kind on the wire")
sys.exit(f"EX0 no-lists: {len(bad)} sites: {bad}" if bad else 0)
PY'''

