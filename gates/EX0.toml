[[criteria]]
# R-11, start: the existing PERF-START (scripts/perf/baseline.py, ADR 0038) passes: paired against the merge-base build,
# 80 judged pairs, upper bound of the ratio < 1.10, and the absolute budget. Its evidence goes to this gate's folder,
# never to gates/L0. Blocked on main by the reference build deleting frontend/dist/.gitkeep (block PF1): kept as is.
