[[criteria]]
# One source for where a command shows (spec §4.31, architecture §15.13). Webview, every .ts and .svelte outside tests,
# testkits and comment lines: no command id placed in markup or code (`<CommandButton id="…">`, `<CommandMenuItem
# id="…">`, `id="format.{…}"`, `data-cmd="…"`, a registry call on a literal id), no toolbar, tab list, menu, context
# menu or menu button outside the location hosts (`ui/command/`) and the native items of built-ins (`ext/*/native/`),
# except the files listed with their tag (EX0c2, EX0c3, widgets that pick a value); the bar tables are gone. The points
# are filled (it cannot pass by deleting the bars). Then EX0's type-id lint with its list narrowed: the status bar,
# the bar's spec and the presentation leave it; App.svelte keeps only the K-7 line that opens a Typst file.
id = "no-hard-locations"
command = '''timeout -k 10 30 python3 -I - <<'PY'
import json, pathlib, re, sys
ALLOWED = {  # file: (tag, kinds it may hold)
    "frontend/src/ui/PeopleStack.svelte": ("protected header widget, its own app.people", {"place"}),
    "frontend/src/ui/popover/EncodingMenu.svelte": ("value picker, not commands", {"surface"}),
    "frontend/src/ui/sheet/SheetStatus.svelte": ("value pickers, not commands", {"surface"}),
    "frontend/src/ui/sheet/Sheet.svelte": ("EX0c2 grid toolbar and context menu", {"surface", "place"}),
    "frontend/src/ui/sheet/Grid.svelte": ("EX0c2 grid context menu", {"surface"}),
    "frontend/src/ui/sheet/ContextMenu.svelte": ("EX0c2 grid context menu", {"surface"}),
    "frontend/src/ui/sheet/FilterMenu.svelte": ("value picker of a column", {"surface"}),
    "frontend/src/ui/history/HistoryDrawer.svelte": ("EX0c2 drawer tabs (panels)", {"surface"}),
    "frontend/src/ui/toolbar/InsertMenu.svelte": ("EX0c3 Insert menu", {"surface"}),
}
PATTERNS = {
    "place": re.compile(r"""<Command(?:Button|MenuItem)\b[^>]*\bid=(?:["']|\{\s*["'`])|\bid=["'][a-z][a-z0-9-]*\.[a-z{]|data-cmd=["']|\b(?:run|shortcutOf|cmdAttrs|availability|runnable|isOn|labelOf|chordsOf)\(\s*["'`][a-z][a-z0-9-]*\.[a-z0-9-]+"""),
    "surface": re.compile(r"""role=["'](?:toolbar|tablist|menu)["']|<ContextMenu\b|\boncontextmenu=|<MenuButton\b"""),
    "table": re.compile(r"\b(BAR_ITEMS|itemsFor|barLang|BarId|HEADING_SYNTAX|HEADINGS)\b"),
}
bad = []
src = pathlib.Path("frontend/src")
for f in sorted([*src.rglob("*.ts"), *src.rglob("*.svelte")]):
    s = f.as_posix()
    if ".test." in f.name or "testkit" in f.name or "/testdata/" in s:
        continue
    host = s.startswith("frontend/src/ui/command/") or re.match(r"frontend/src/ext/[^/]+/native/", s)
    tag, kinds = ALLOWED.get(s, ("", set()))
    for n, line in enumerate(f.read_text().splitlines(), 1):
        if line.lstrip().startswith(("//", "*", "/*", "<!--")):
            continue
        hits = [f"{k} {m.group(0)[:40]}" for k, p in PATTERNS.items() for m in p.finditer(line)
                if k not in kinds and not (host and k == "surface")]
        if hits:
            bad.append(f"{s}:{n} ({'; '.join(hits)})")
ids_all = set()
for m in sorted(pathlib.Path("frontend/src/ext").glob("*/inkwell-plugin.json")):
    j = json.loads(m.read_text())
    ids_all |= {x.get("id") for x in j.get("contributes", {}).get("commands", [])}
exts = {m.parent.name for m in pathlib.Path("frontend/src/ext").glob("*/inkwell-plugin.json")}
lit = re.compile(r"""["'`]((%s)\.(?:[a-z0-9-]+|\$\{))""" % "|".join(sorted(exts)))
PLACING = ("frontend/src/App.svelte", "frontend/src/ui/shell/", "frontend/src/ui/toolbar/", "frontend/src/ui/popover/",
           "frontend/src/preview/")
for f in sorted([*src.rglob("*.ts"), *src.rglob("*.svelte")]):
    s = f.as_posix()
    if ".test." in f.name or "testkit" in f.name or not s.startswith(PLACING):
        continue
    for n, line in enumerate(f.read_text().splitlines(), 1):
        if line.lstrip().startswith(("//", "*", "/*", "<!--")):
            continue
        hits = [m.group(1) for m in lit.finditer(line) if m.group(1) in ids_all or m.group(1).endswith("${")]
        if hits:
            bad.append(f"{s}:{n} (command id in code {','.join(hits)})")
mts = pathlib.Path("frontend/src/extensions/manifest.ts").read_text()
for loc in ("main", "header/start", "header/end", "format", "format/heading", "status/zoom", "preview/toolbar", "grid/toolbar",
            "grid/context", "view", "history/toolbar", "diff/toolbar", "insert", "editor/context", "files/context",
            "tabs/context", "preview/context", "people/context", "link/context"):
    if not re.search(r"""["']?%s["']?\s*:\s*\{""" % re.escape(loc), mts):
        bad.append(f"LOCATIONS lacks {loc}")
if "reserved" not in mts or not all(f'"{g}"' in mts for g in ("insert", "export", "extensions")):
    bad.append("LOCATIONS has no reserved mark, or main lacks the insert, export, extensions groups")
for path, keys in {"frontend/src/preview/Preview.svelte": ("preview.zoomOut", "preview.zoomIn", "preview.jumpToCursor"),
                   "frontend/src/ui/shell/StatusBar.svelte": ('data-testid="position"', 'data-testid="words"',
                   'data-testid="page-indicator"', 'data-testid="unsaved"', 'data-testid="language"', 'data-testid="problems"')}.items():
    text = pathlib.Path(path).read_text()
    bad += [f"{path}: still draws {k}" for k in keys if k in text]
menus, status, icons = {}, {}, {}
for m in sorted(pathlib.Path("frontend/src/ext").glob("*/inkwell-plugin.json")):
    c = json.loads(m.read_text()).get("contributes", {})
    for x in c.get("menus", []):
        menus.setdefault(x.get("location"), []).append(x)
    for x in c.get("status", []):
        status[x.get("id")] = x
    for x in c.get("commands", []):
        icons[x.get("id")] = x.get("icon")
ids = lambda loc: {x.get("command") for x in menus.get(loc, [])}
need = {"header/start": {"app.sidebar"}, "header/end": {"app.preview", "typst.present", "app.share", "app.review"},
        "format/heading": {"format.paragraph", "format.h1", "format.h2", "format.h3", "format.h4"},
        "status/zoom": {"app.zoom-out", "app.zoom-in", "app.zoom-reset"},
        "preview/toolbar": {"typst.preview-zoom-out", "typst.preview-zoom-in", "typst.jump-to-preview"}}
bad += [f"location {loc} lacks {sorted(want - ids(loc))}" for loc, want in need.items() if not want <= ids(loc)]
bar = {f"format.{b}" for b in ("bold", "italic", "underline", "strike", "link", "code", "codeblock", "formula", "ul", "ol", "task", "quote", "table")}
bad += [f"location format lacks {sorted(bar - ids('format'))}"] if not bar <= ids("format") else []
bad += [f"{c}: no icon" for c in sorted(bar | {"app.sidebar", "app.preview", "typst.present", "app.review",
        "typst.preview-zoom-out", "typst.preview-zoom-in", "typst.jump-to-preview"}) if not icons.get(c)]
present = [x for x in menus.get("header/end", []) if x.get("command") == "typst.present"]
if not present or present[0].get("when") != "canPresent && fileType == typst":
    bad.append("typst.present in header/end: when is not exactly 'canPresent && fileType == typst'")
STATUS = {  # id: (side, group, exact when or None)
    "app.presence": ("start", "presence", None), "typst.problems": ("end", "problems", "fileType == typst"),
    "typst.page": ("end", "preview", "main && previewOpen"), "app.unsaved": ("end", "save", None),
    "app.position": ("end", "caret", "text"), "app.words": ("end", "caret", "text"), "app.zoom": ("end", "file", None),
    "app.encoding": ("end", "file", None), "app.language": ("end", "type", "text")}
for i, (side, group, when) in STATUS.items():
    x = status.get(i)
    got = None if x is None else (x.get("side"), x.get("group"), x.get("when"))
    if got != (side, group, when) or not (x or {}).get("label"):
        bad.append(f"status item {i}: {got}, want {(side, group, when)} and a label")
# EX0's type-id lint (gates/EX0.toml, no-lists), its list narrowed by EX0c1.
TYPED = {  # file: (tag, literals it may hold, and the only lines that may hold them)
    "frontend/src/App.svelte": ("K-7 the Typst engine opens a Typst file", {"typst"}, r"language\.open|fileTypeOf"),
    "frontend/src/editor/format/commands.ts": ("EX0c3 format language", {"typst"}, ""),
    "frontend/src/editor/format/support.ts": ("EX0c3 format language", {"typst", "markdown"}, ""),
    "frontend/src/editor/format/insert.ts": ("EX0c3 Insert menu", {"typst", "csv", "json", "yaml", "toml", "xml"}, ""),
    "frontend/src/editor/stats/words.ts": ("EX0c3 word stripping", {"typst", "markdown"}, ""),
    "frontend/src/editor/setup.ts": ("EX0c3 Typst writing help", {"typst"}, ""),
    "frontend/src/ui/toolbar/InsertMenu.svelte": ("EX0c3 Insert menu", {"typst", "markdown", "csv", "tsv", "psv", "bibtex", "json", "yaml", "toml", "xml", "png", "jpeg", "gif", "webp", "svg", "bmp", "pdf"}, ""),
    "frontend/src/language/problems.svelte.ts": ("EX0c3 diagnostics source", {"csv"}, ""),
    "frontend/src/language/client.ts": ("K-7 LSP language id", {"typst"}, ""),
}
WORDS = r"typst|typ|markdown|md|csv|tsv|psv|bib|bibtex|json|ya?ml|toml|xml|png|jpe?g|gif|webp|svg|bmp|pdf"
bare = re.compile(r"""["'`](%s)["'`]""" % WORDS)
for f in sorted([*src.rglob("*.ts"), *src.rglob("*.svelte")]):
    s = f.as_posix()
    if ".test." in f.name or "testkit" in f.name or "/testdata/" in s:
        continue
    tag, allowed, only = TYPED.get(s, ("", set(), ""))
    for n, line in enumerate(f.read_text().splitlines(), 1):
        if line.lstrip().startswith(("//", "*", "/*", "<!--")):
            continue
        found = set(bare.findall(line))
        extra = found - allowed if not only or re.search(only, line) else found
        if extra:
            bad.append(f"{s}:{n} (type id {','.join(sorted(extra))})")
sys.exit(f"EX0c1 no-hard-locations: {len(bad)} problems: {bad[:120]}" if bad else 0)
PY'''

