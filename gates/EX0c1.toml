[[criteria]]
id = "simplify-report"
command = '''timeout -k 10 30 python3 -I - <<'PY'
import sys
from pathlib import Path

report = Path("gates/EX0c1/SIMPLIFY.md")
if not report.is_file():
    sys.exit("EX0c1 /simplify review evidence is absent")
lines = report.read_text().splitlines()
if not any(line.startswith("Reviewer: ") and line[10:].strip() for line in lines):
    sys.exit("EX0c1 /simplify reviewer is absent")
for heading in ("## Applied", "## Set aside", "## Verified"):
    if heading not in lines:
        sys.exit(f"EX0c1 /simplify review lacks {heading}")
    body = []
    for line in lines[lines.index(heading) + 1:]:
        if line.startswith("## "):
            break
        body.append(line)
    if not any(line.strip() for line in body):
        sys.exit(f"EX0c1 /simplify review is empty under {heading}")
PY'''
