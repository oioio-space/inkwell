    "frontend/src/present/PresenterView.svelte": ("the presenter's notes column, not a side", {"surface"}),
}
PATTERNS = {
    "place": re.compile(r"""<Command(?:Button|MenuItem)\b[^>]*\bid=(?:["']|\{\s*["'`])|\bid=["'][a-z][a-z0-9-]*\.[a-z{]|data-cmd=["']|\b(?:run|shortcutOf|cmdAttrs|availability|runnable|isOn|labelOf|chordsOf|openPanel)\(\s*["'`][a-z][a-z0-9-]*\.[a-z0-9-]+"""),
    "surface": re.compile(r"""role=["'](?:toolbar|tablist|tab|tabpanel|menu)["']|<ContextMenu\b|\boncontextmenu=|<MenuButton\b|<aside\b|class=["'][^"']*\bviewbar\b"""),
    "table": re.compile(r"\b(BAR_ITEMS|itemsFor|barLang|BarId|HEADING_SYNTAX|HEADINGS|menuItems|ownView|MD_SYNTAX|MD_WORDING|PICTURES|READERS|EMPTY_PAIRS|syntaxOf|formatLanguage)\b"),
}
bad = []
src = pathlib.Path("frontend/src")
files = sorted([*src.rglob("*.ts"), *src.rglob("*.svelte")])
for f in files:
    s = f.as_posix()
    if ".test." in f.name or "testkit" in f.name or "/testdata/" in s:
        continue
    host = s.startswith("frontend/src/ui/command/") or re.match(r"frontend/src/ext/[^/]+/native/", s)
    tag, kinds = ALLOWED.get(s, ("", set()))
    for n, line in enumerate(f.read_text().splitlines(), 1):
        if line.lstrip().startswith(("//", "*", "/*", "<!--")):
            continue
        hits = [f"{k} {m.group(0)[:40]}" for k, p in PATTERNS.items() for m in p.finditer(line)
