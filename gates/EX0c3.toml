# Written 2026-11-25 at step 1 of block EX0c3, before any code; not yet frozen (blind review first).
# EX0c3: the Insert menu as the `insert` location (thirteen `format.insert-*` commands, groups with captions), the
# formatting language as the `format` entry of a grammar (syntax tables, cleanup pairs, quote wrapping, word stripping,
# insertion renderers; `accepts` and `readers` in the manifests), and the last type-id reads, K-7 alone left.
# Rigour: standard. Plan: docs/plans/2026-11-25-ex0c3-insert-format.md; decision: ADR 0027, section « The Insert menu
# and the formatting language (EX0c3) ». Witnesses: gates/EX0c3/WITNESSES.md. Shape and pitfalls from
# gates/EX0c2.toml and its REVIEW.md and SIMPLIFY.md; `lint` and `test-py` added because EX0c2's push failed on them.
# Every long command is `timeout -k 10 N …/scripts/heavy.sh …` (the timeout covers the wait for a slot). No nested gate:
# `no-hard-locations` carries its own copy of EX0c2's lint, narrowed to what EX0c3 leaves.
# Caps: 30 + 30 + 300 + 120 + 480 + 30 + (20 + 300) + (20 + 240) + (200 + 420) + 150 + 300 + 30 = 2670 s <= 2700 s
# (rule G-1). The order matters: `e2e-mutant` mutates and builds a throwaway copy only (mutants.py); `e2e` then builds
# bin/inkwell-server and frontend/dist from the restored tree, which `e2e-webkit` and `perf-start` use.
