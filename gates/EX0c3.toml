[[criteria]]
# The codemod lives in scripts/codemods/ because a gate run empties gates/EX0c3/ of everything but its .md reports.
# Review major 1: the ~325 lines of test edits that pass TYPST, MARKDOWN and PLAIN instead of the names are proved
# mechanical. scripts/codemods/ex0c3_type_literals.py writes them; this criterion carries its own reverse, frozen with the gate. Every
# test file that existed at the merge-base and differs now is either one of the codemod's FILES, whose reverse must
# give the merge-base text back (formatting-blind: whitespace and trailing commas), or listed in NAMED with the exact
# edits declared here, applied to the merge-base text before the comparison. Every such file keeps its set of test
# titles; no base test file is deleted. Then the `frontend` run (before this) passed at least the merge-base's 1513.
id = "mechanical"
command = '''timeout -k 10 30 python3 -I - <<'PY'
import json, pathlib, re, subprocess, sys
base = subprocess.check_output(["git", "merge-base", "HEAD", "main"], text=True).strip()
show = lambda path: subprocess.run(["git", "show", f"{base}:{path}"], capture_output=True, text=True).stdout
listed = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", base, "frontend/src"], text=True).split()
tests = [f for f in listed if f.endswith(".test.ts")]
cm = pathlib.Path("scripts/codemods/ex0c3_type_literals.py")
FILES = {"frontend/src/" + f for f in re.findall(r'^\s+"([^"]+\.test\.ts)",$', cm.read_text(), re.M)} if cm.is_file() else set()
NAMED = {  # file: (exact substitutions on the merge-base text, the added lines allowed)
    "frontend/src/ui/command/locations.test.ts": ([  # L-1's reserved case leaves `insert`, now hosted (EX0c2's precedent)
        ('item("plug.go", "insert", "blocks", 1)', 'item("plug.go", "editor/context", "extensions", 1)'),
        ('reason: "reserved location insert"', 'reason: "reserved location editor/context"'),
        ('"history/toolbar", "diff/toolbar"])', '"history/toolbar", "diff/toolbar", "insert"])'),
        ('expect(reserved("insert")).toBe("EX0c3");', 'expect(reserved("editor/context")).toBe("UX1-D");'),
    ], None),
    "frontend/src/extensions/commands.test.ts": ([], r'^\s*"format\.insert-[a-z-]+": \{.*\},$'),  # C-7: one row per new command
    "frontend/src/extensions/context.test.ts": ([('lang: "plain" as const,', "lang: undefined,")], None),
}
NAMES = ["TYPST", "MARKDOWN", "PLAIN", "AnyLang", "TestLang", "LangArg"]
BACK = [("AnyLang", '"typst" | "markdown" | "plain"'), ("TestLang", '"typst" | "markdown"'), ("LangArg", "string"),
        ("PLAIN", '"plain"'), ("MARKDOWN", '"markdown"'), ("TYPST", '"typst"')]
WORD = lambda n: re.compile(r"(?<![\w$-])%s(?![\w$-])" % re.escape(n))
def strip(m):
    kept = [x.strip() for x in m.group(1).split(",") if x.strip() and x.strip().removeprefix("type ").strip() not in NAMES]
    return "" if not kept else "import { %s } from %s;%s" % (", ".join(kept), m.group(2), m.group(3))
def reverse(text):
    text = re.sub(r'import \{([^}]*)\} from ("(?:\./|(?:\.\./)+editor/format/)testkit");(\n?)', strip, text)
    for a, b in BACK:
        text = WORD(a).sub(b, text)
    return text
def norm(t):
    """Formatting-blind outside strings and comments: whitespace dropped, a trailing comma before a closer dropped."""
    out, i, n = [], 0, len(t)
    while i < n:
        c = t[i]
        if c in "\"'`":
            j = i + 1
            while j < n and t[j] != c:
                j += 2 if t[j] == "\\" else 1
            out.append(t[i:j + 1])
            i = j + 1
        elif t.startswith("//", i):
            j = t.find("\n", i)
            j = n if j < 0 else j
            out.append(re.sub(r"\s+", "", t[i:j]))
            i = j
        elif t.startswith("/*", i):
            j = t.find("*/", i + 2)
            j = n if j < 0 else j + 2
            out.append(re.sub(r"\s+", "", t[i:j]))
            i = j
        elif c.isspace():
            i += 1
        else:
            out.append(c)
            i += 1
    return re.sub(r",(?=[)\]}>])", "", "".join(out))
TITLE = re.compile(r"\b(?:it|test)(?:\.(?:each\([^)]*\)|skip|only|todo|fails))*\(\s*([\"'`])((?:\\.|(?!\1).)*)\1")
bad, changed = [], 0
for f in tests:
    p = pathlib.Path(f)
    old = show(f)
    if not p.is_file():
        bad.append(f"{f}: deleted")
        continue
    new = p.read_text()
    if new == old:
        continue
    changed += 1
    if {m.group(2) for m in TITLE.finditer(new)} != {m.group(2) for m in TITLE.finditer(old)}:
        bad.append(f"{f}: its test titles changed")
    if f not in FILES and f not in NAMED:
        bad.append(f"{f}: changed, neither the codemod's nor a named edit")
        continue
    if f in FILES and any(WORD(n).search(old) for n in NAMES):
        bad.append(f"{f}: holds a codemod name at the merge-base")
        continue
    subs, added = NAMED.get(f, ([], None))
    want = old
    for a, b in subs:
        if want.count(a) != 1:
            bad.append(f"{f}: named edit {a!r} not found once at the merge-base")
        want = want.replace(a, b)
    got = reverse(new) if f in FILES else new
    if added:
        got = "\n".join(l for l in got.splitlines() if not re.match(added, l))
    if norm(got) != norm(want):
        bad.append(f"{f}: not mechanical (its reverse differs from the merge-base)")
report = pathlib.Path(".task/ex0c3/vitest.json")
passed = json.loads(report.read_text())["numPassedTests"] if report.is_file() else 0
if passed < 1513:
    bad.append(f"vitest passed {passed} < 1513 (no frontend report, or tests lost)")
if len(FILES) != 17:
    bad.append(f"scripts/codemods/ex0c3_type_literals.py lists {len(FILES)} FILES, the plan 17")
if changed == 0:
    bad.append("no test file carries the codemod yet")
sys.exit(f"EX0c3 mechanical: {len(bad)} problems ({changed} test files changed): {bad[:40]}" if bad else 0)
PY'''

