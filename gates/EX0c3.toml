DRAWS = {  # what the old drawings held (EX0c2's, then EX0c3's)
    "frontend/src/ui/sheet/Sheet.svelte": ('role="toolbar"', "data-sheet=", 't("sheet.undo")', "<ContextMenu", "problems.csv("),
    "frontend/src/App.svelte": ('class="viewbar"', 'data-sheet="open-table"', "<Sidebar", "textEditor &&", "shown !== textEditor", 'lang !== "plain"'),
    "frontend/src/ui/history/HistoryDrawer.svelte": ('role="tablist"', 'role="tab"', "const tabs"),
    "frontend/src/ui/history/HistoryBars.svelte": ("history.markSeen()", 't("history.seen")'),
    "frontend/src/ui/history/DiffView.svelte": ("go(-1)", "go(1)", 't("diff.prev")', 't("diff.next")'),
    "frontend/src/ui/history/history.svelte.ts": ('this.tab = "history"',),
    "frontend/src/language/problems.svelte.ts": ('history.tab = "problems"', "csv("),
    "frontend/src/ui/shell/Sidebar.svelte": ("<aside",),
    "frontend/src/ui/command/FormatBar.svelte": ("lang.${", "../toolbar/InsertMenu"),
    "frontend/src/ext/app/native/status/Language.svelte": ("lang.${",),
    "frontend/src/editor/setup.ts": ("lang ===",),
    "frontend/src/ui/command/InsertMenu.svelte": ("const ENTRIES", "types: ["),  # the host keeps no item table
}
for path, keys in DRAWS.items():
    p = pathlib.Path(path)
    text = p.read_text() if p.is_file() else ""
    bad += [f"{path}: still holds {k}" for k in keys if k in text]
for gone in ("frontend/src/ui/sheet/ContextMenu.svelte", "frontend/src/ui/sheet/menu.ts",
             "frontend/src/ui/toolbar/InsertMenu.svelte", "frontend/src/editor/format/typst.ts",
             "frontend/src/editor/format/markdown.ts"):
    if pathlib.Path(gone).exists():
        bad.append(f"{gone} still exists")
for must in ("frontend/src/ui/command/InsertMenu.svelte", "frontend/src/ext/typst/native/format.ts",
             "frontend/src/ext/markdown/native/format.ts"):
    if not pathlib.Path(must).is_file():
        bad.append(f"{must} absent")
mts = pathlib.Path("frontend/src/extensions/manifest.ts").read_text()
if re.search(r'reserved: "EX0c[23]"', mts):
    bad.append("LOCATIONS still reserves locations for EX0c2 or EX0c3")
ins = mts[mts.index("  insert: {"):] if "  insert: {" in mts else ""
ins = ins[:ins.index("\n  },")] if "\n  }," in ins else ins
grp = re.findall(r'id: "([a-z-]+)"', ins)
if grp != ["files", "refs", "layout", "extensions"]:
    bad.append(f"LOCATIONS.insert groups are {grp}, want files, refs, layout, extensions")
bad += [f"LOCATIONS.insert group {g} has no caption insert.group.{g}" for g in ("files", "refs", "layout")
        if f'caption: "insert.group.{g}"' not in ins]
fe = pathlib.Path("frontend/src/extensions/formatEntries.ts")
if not fe.is_file() or "eager: true" not in fe.read_text():
    bad.append("extensions/formatEntries.ts (eager built-in format entries) absent")
whn = pathlib.Path("frontend/src/extensions/when.ts").read_text()
keys = whn[whn.index("CONTEXT_KEYS"):whn.index("} as const satisfies")]
if not re.search(r"\binserts:", keys):
    bad.append("context key inserts absent")
menus, cmds, grammars = {}, {}, {}
for name, j in manifests.items():
    c = j.get("contributes", {})
    for x in c.get("menus", []):
        menus.setdefault(x.get("location"), []).append(x)
    for x in c.get("commands", []):
        cmds[x.get("id")] = x
    for x in c.get("grammars", []):
        grammars[x.get("id")] = x
ITEMS = {  # command suffix: (Insert item, group)
    "image": ("image", "files"), "figure": ("figure", "files"), "include": ("include", "files"),
    "attach": ("attach", "files"), "csv-table": ("csvTable", "files"), "data": ("data", "files"),
    "bibliography": ("bibliography", "files"), "file-link": ("link", "files"), "cite": ("cite", "refs"),
    "ref": ("ref", "refs"), "footnote": ("footnote", "refs"), "outline": ("outline", "layout"),
    "pagebreak": ("pagebreak", "layout"),
}
placed = {x.get("command"): x for x in menus.get("insert", [])}
fr = json.loads(pathlib.Path("frontend/src/i18n/fr.json").read_text())
for suffix, (item, group) in ITEMS.items():
    cid = f"format.insert-{suffix}"
    c, p = cmds.get(cid) or {}, placed.get(cid) or {}
    want_item = f"{item} in inserts" if item != "link" else "link in inserts && !(attach in inserts)"
    # Review minor 6: the Insert host is the shell's, so a step needs no bar; a big file is read-only, so the
    # reason is the format commands' one (« Indisponible pour ce fichier ou en lecture seule »), never a bar's.
    want_cmd = f"{item} in inserts && !readOnly"
