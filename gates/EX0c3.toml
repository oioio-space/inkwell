        bad.append(f"insert item {cid}: group {p.get('group')}, when {p.get('when')}; want {group}, {want_item}")
orders = [placed.get(f"format.insert-{s}", {}).get("order", -1) for s in ITEMS]
if orders != sorted(orders) or len(set(orders)) != len(orders):
    bad.append(f"insert items not in today's order: {orders}")
PICT = ["png", "jpeg", "gif", "webp", "svg", "bmp", "pdf"]
FORMAT = {  # review major 2: the language's name is the grammar's `label`, the format holds formatting only
    "typst": ("lang.typst", {"image": PICT, "figure": PICT, "include": ["typst"], "csvTable": ["csv", "tsv", "psv"],
              "data": ["json", "yaml", "toml", "xml", "cbor"], "bibliography": ["bibtex"]},
              {"csv": "csv", "json": "json", "yaml": "yaml", "toml": "toml", "xml": "xml"}),
    "markdown": ("lang.markdown", {"image": PICT, "csvTable": ["csv", "tsv", "psv"]}, None),
}
for g, (label, accepts, readers) in FORMAT.items():
    gr = grammars.get(g) or {}
    f = gr.get("format") or {}
    if gr.get("label") != label or "label" in f or f.get("entry") != "native/format.ts" or f.get("accepts") != accepts \
            or (readers is not None and f.get("readers") != readers):
        bad.append(f"grammar {g}: not label {label} with a format of entry native/format.ts and today's accepts/readers")
en = json.loads(pathlib.Path("frontend/src/i18n/en.json").read_text())
if "insérer" not in fr.get("kw.insert", "").lower() or "insert" not in en.get("kw.insert", "").lower():
    bad.append("kw.insert does not hold « insérer » (fr) and « insert » (en)")
for lang, table in (("fr", fr), ("en", en)):  # review minor 4: both languages, case-insensitive
    texts = {}
    for cid, c in cmds.items():
        texts.setdefault(table.get(c.get("label", ""), c.get("label", "")).casefold(), []).append(cid)
    bad += [f"{lang} palette label « {t} » shared by {sorted(v)}" for t, v in texts.items() if len(v) > 1]
# Review minor 6: no bar reason, the dead Markdown label gone (its description through the entry's `describe`).
for lang, table in (("fr", fr), ("en", en)):
    bad += [f"{lang} still has {k}" for k in ("cmd.insert.needsBar", "insert.csvTable.markdown") if k in table]
mdf = pathlib.Path("frontend/src/ext/markdown/native/format.ts")
if "insert.csvTable.markdown.desc" not in (mdf.read_text() if mdf.is_file() else ""):
    bad.append("Markdown's format entry does not describe csvTable with insert.csvTable.markdown.desc")
app = pathlib.Path("frontend/src/App.svelte").read_text()
if not re.search(r"^\s*readOnly: [^\n]*workspace\.big", app, re.M):
    bad.append("App.svelte: the context's readOnly does not say a big file is read-only")
TYPED = {  # file: (tag, literals it may hold, and the only lines that may hold them)
    "frontend/src/language/client.ts": ("K-7 the Typst engine's LSP: its language id and served type", {"typst"}, ""),
    "frontend/src/ui/icons/paths.ts": ("icon names (a manifest's `icon`), not type reads", set(), ""),
    # The widened key rule's one other hit: the clipboard's tab-separated payload, a field name, not a type read.
    "frontend/src/ui/sheet/sheet.svelte.ts": ("clipboard payload field", {"tsv"}, r"\btsv: (?:string\b|toTsv\()"),
}
WORDS = r"typst|typ|markdown|md|csv|tsv|psv|bib|bibtex|json|ya?ml|toml|xml|png|jpe?g|gif|webp|svg|bmp|pdf"
bare = re.compile(r"""["'`](%s)["'`]""" % WORDS)
# Review minor 7: a key at a line's start or after `{` or `,`, and `lang.` built by `${…}` or by `+`.
key = re.compile(r"""(?:^|[{,])\s*["']?(%s)["']?\s*:(?!:)""" % WORDS)
tmpl = re.compile(r"""`lang\.\$\{|["'`]lang\.["'`]\s*\+""")
for f in files:
    s = f.as_posix()
    if ".test." in f.name or "testkit" in f.name or "/testdata/" in s:
        continue
    tag, allowed, only = TYPED.get(s, ("", set(), ""))
    in_style = False
    for n, line in enumerate(f.read_text().splitlines(), 1):
        if "<style" in line:
