        if in_style or line.lstrip().startswith(("//", "*", "/*", "<!--")):
            continue
        found = set(bare.findall(line))
        if s != "frontend/src/ui/icons/paths.ts":
            found |= set(key.findall(line))
        extra = found - allowed if not only or re.search(only, line) else found
        if tmpl.search(line) and s not in TYPED:
            extra.add("lang.${…}")
        if extra:
            bad.append(f"{s}:{n} (type id {','.join(sorted(extra))})")
sys.exit(f"EX0c3 no-hard-locations: {len(bad)} problems: {bad[:200]}" if bad else 0)
PY'''

