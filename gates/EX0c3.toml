[[criteria]]
# One source for where a command shows and for what a language writes. EX0c2's lint (no command placed in markup or
# code, no toolbar, tab list, menu or side outside the hosts `ui/command/` and `ext/*/native/`), its allow-list
# narrowed: the Insert menu leaves it (its host is `ui/command/InsertMenu.svelte`); the tables keyed by a language
# (the Insert host's `ENTRIES`, `MD_SYNTAX`, `MD_WORDING`, `PICTURES`, `READERS`, `EMPTY_PAIRS`, `syntaxOf`, `formatLanguage`) and the
# old modules are gone; the points are filled (it cannot pass by deleting the menu): the `insert` location hosted with
# today's groups and their captions, its thirteen commands with today's labels and `when`, the `inserts` context key,
# the eager format entries, the Typst and Markdown grammars' `format` with `label`, `accepts` (today's lists) and
# Typst's `readers`, the language's name on the grammar (`label`); keywords « insérer » / « insert »; no two command
# labels read the same in French or English, case-insensitive (the palette); a big file is read-only in the context.
# Then EX0's type-id lint with K-7 alone: a quoted type id, an object key named after one (at a line's start or after
# `{` or `,`), or a `lang.` key built by a template or `+`, only in `language/client.ts`.
id = "no-hard-locations"
command = '''timeout -k 10 30 python3 -I - <<'PY'
import json, pathlib, re, sys
ALLOWED = {  # file: (tag, kinds it may hold)
    "frontend/src/ui/PeopleStack.svelte": ("protected header widget, its own app.people", {"place"}),
    "frontend/src/ui/popover/EncodingMenu.svelte": ("value picker, not commands", {"surface"}),
