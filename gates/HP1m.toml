command = "timeout -k 10 1800 ./scripts/heavy.sh python3 -I scripts/netsim/mutants.py HP1 MH1 MH2 MH3 MH4 MH5 MH6 MH7 MH8 MH9 MH10 MH11 MH12 MH13 MH14 MH15 MH16 MH17 MH18 MH19 MH20 MH21 MH22"
