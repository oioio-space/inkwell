# FROZEN 2026-11-16 after two Codex reviews (gates/HP1/WITNESSES.md, plan « Codex debate »). Second gate of block HP1, run on the same candidate after gates/HP1.toml (header of
# gates/HP1.toml: five gates, split on 2026-11-16 to fit rule G-1's 45 min without dropping a proof). Plan:
# docs/plans/2026-11-16-hp1-direct-upgrade.md (§4 rules and their mutants); models docs/protocol/tla/DirectUpgrade.tla,
# alloy/DirectUpgradeRoles.als. This gate: the Go mutants of block HP1 (scripts/netsim/mutants.toml; their entries are
# frozen by gates/HP1.toml's `mutant-tool` table). Every command is capped; scripts/gate.py refuses caps past
# max_minutes (PC1a rule G-1). Red witnesses: gates/HP1m/WITNESSES.md.
max_minutes = 45
raw_results = ["docs/plans/2026-11-16-hp1-direct-upgrade.md", "docs/protocol/tla/DirectUpgrade.tla", "docs/protocol/alloy/DirectUpgradeRoles.als", "gates/HP1m/*"]

