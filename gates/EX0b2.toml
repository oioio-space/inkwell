[[criteria]]
# P-8's count is complete (review finding 3): the ranker compares text only in its own counted loops. rank.ts exists,
# exports `rankStats`, and outside comments holds no built-in text search (`includes`, `indexOf`, `lastIndexOf`,
# `startsWith`, `endsWith`, `search`, `match`, `matchAll`), no `RegExp` and no regular-expression literal. Folding lives
# in fold.ts (counted by P-1); ordering labels with the collator is not a text search.
id = "ranker-lint"
command = '''timeout -k 10 30 python3 -I - <<'PY'
import pathlib, re, sys
f = pathlib.Path("frontend/src/ui/command/rank.ts")
if not f.is_file():
    sys.exit("EX0b2 ranker-lint: frontend/src/ui/command/rank.ts is absent")
bad = []
src = f.read_text()
if not re.search(r"export\s+(const|let)\s+rankStats\b", src):
    bad.append("rank.ts does not export rankStats")
src = re.sub(r"/\*.*?\*/", "", src, flags=re.S)
banned = re.compile(r"\.(includes|indexOf|lastIndexOf|startsWith|endsWith|search|match|matchAll)\s*\(|\bRegExp\b")
literal = re.compile(r"(?:^|[=(,:\[!&|?{};]|\breturn)\s*/(?![/*\s])")
for n, line in enumerate(src.splitlines(), 1):
    code = re.sub(r"(^|\s)//.*$", "", line)
    if banned.search(code) or literal.search(code):
        bad.append(f"rank.ts:{n}: {line.strip()[:80]}")
sys.exit(f"EX0b2 ranker-lint: {bad}" if bad else 0)
PY'''

[[criteria]]
# Both components are lazy (plan §1, « Entry points »): a production Vite build with its manifest; Palette.svelte and
# ShortcutsWindow.svelte are dynamic entries of their own; no start chunk (the static closure of index.html and
# App.svelte) holds either of them nor the ranker, read from each start chunk's sourcemap. E2's fixture extension of
# 1 000 commands (`e2e-many`, e2e build only) is in no file of the production build.
id = "chunks"
command = '''set -eu
mkdir -p .task/ex0b2
rm -rf .task/ex0b2/chunks
(cd frontend && timeout -k 10 120 ../scripts/heavy.sh pnpm --config.verifyDepsBeforeRun=false exec vite build --configLoader runner --mode production --manifest --sourcemap --outDir ../.task/ex0b2/chunks --emptyOutDir) > .task/ex0b2/chunks.log 2>&1 || { tail -30 .task/ex0b2/chunks.log; exit 1; }
timeout -k 10 30 python3 -I - <<'PY'
import json, pathlib, sys
out = pathlib.Path(".task/ex0b2/chunks")
m = json.loads((out / ".vite/manifest.json").read_text())
bad = []
lazy = ["src/ui/command/Palette.svelte", "src/ui/command/ShortcutsWindow.svelte"]
bad += [f"{k}: not a dynamic chunk of its own" for k in lazy if not m.get(k, {}).get("isDynamicEntry")]
seen, stack = set(), ["index.html", "src/App.svelte"]
while stack:
    k = stack.pop()
    if k in m and k not in seen:
        seen.add(k)
        stack.extend(m[k].get("imports", []))
if "src/App.svelte" not in seen:
    bad.append("App.svelte is not a chunk of the build any more")
forbidden = ["frontend/src/ui/command/Palette.svelte", "frontend/src/ui/command/ShortcutsWindow.svelte", "frontend/src/ui/command/rank.ts"]
for file in sorted({m[k]["file"] for k in seen}):
    path, mp = out / file, out / (file + ".map")
    if not mp.is_file():
        if file.endswith(".js") and path.stat().st_size >= 1024:
            bad.append(f"{file}: start chunk without a sourcemap")
        continue
    bad += [f"{file} holds {s}" for s in json.loads(mp.read_text())["sources"] if any(s.endswith(x) for x in forbidden)]
bad += [f"{f.relative_to(out)} holds the e2e fixture" for f in out.rglob("*") if f.is_file() and f.suffix in (".js", ".json", ".html") and b'"e2e-many.' in f.read_bytes()]
sys.exit(f"EX0b2 chunks: {bad}" if bad else 0)
PY'''

