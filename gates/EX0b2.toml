# Written 2026-11-25 at step 1 of block EX0b2, before any code; revised after its blind Opus review (gates/EX0b2/REVIEW.md,
# « accept with corrections »: 4 major, all applied); frozen 2026-11-25.
# EX0b2: the command palette, its ranker (ordered match classes, UX1 rule 48) and the shortcuts window, on EX0b1's
# registry. Rigour: standard. Plan: docs/plans/2026-11-25-ex0b2-palette.md (from docs/plans/2026-11-25-ex0b-commands.md
# §7). Witnesses: gates/EX0b2/WITNESSES.md.
# Every long command is `timeout -k 10 N …/scripts/heavy.sh …` (the timeout covers the wait for a slot). No nested gate:
# `no-hard-keys` runs one criterion's command of gates/EX0b1.toml, not that gate.
# Caps: 30 + 30 + 30 + (120 + 30) + 480 + (20 + 300) + (200 + 300) + 420 + 600 + 30 = 2590 s <= 2700 s (rule G-1). The
# order matters: `e2e` builds bin/inkwell-server and frontend/dist, which `e2e-webkit` and `perf-start` use.
max_minutes = 45
raw_results = ["docs/plans/2026-11-25-ex0b2-palette.md", "docs/plans/2026-11-25-ex0b-commands.md", "gates/EX0b2/*"]

[[criteria]]
# The plan is written (rules P-1..P-10, at most two pages) and the EX0b plan's §7 points at it; spec §8.2's rows
# « Palette » and « Raccourcis » are « fait » with their command ids (EX0b1's C-7 then compares their chords with the
# registry); §4.24 is no longer « à créer »; §4.26 names `app.shortcuts` and AdwShortcutsDialog (GtkShortcutsWindow is
# deprecated since GTK 4.18); ux-principles rule 3 still gives the palette's chord, menu item and shown shortcut;
# PROGRESS's EX0b2 line points at the plan; typo tolerance is filed « → EX0b3 » with its line (review, open question 1);
# rule 48 still orders the palette.
id = "docs"
command = '''timeout -k 10 30 python3 -I - <<'PY'
import pathlib, sys
bad = []
plan = pathlib.Path("docs/plans/2026-11-25-ex0b2-palette.md")
text = plan.read_text() if plan.is_file() else ""
bad += [f"plan row P-{i}" for i in range(1, 11) if f"\n| P-{i} |" not in text]
if len(text.splitlines()) > 110:
    bad.append(f"plan is {len(text.splitlines())} lines, over two pages")
ex0b = pathlib.Path("docs/plans/2026-11-25-ex0b-commands.md").read_text()
if "## 7. EX0b2" not in ex0b or "2026-11-25-ex0b2-palette.md" not in ex0b[ex0b.index("## 7. EX0b2"):]:
    bad.append("EX0b plan §7 does not point at the EX0b2 plan")
spec = pathlib.Path("docs/design/spec.md").read_text()
s82 = spec[spec.index("### 8.2 "):spec.index("### 8.3 ")]
for action, cid in (("Palette", "app.palette"), ("Raccourcis", "app.shortcuts")):
    row = next(([c.strip() for c in l.strip().strip("|").split("|")] for l in s82.splitlines() if l.startswith(f"| {action} |")), None)
    if row is None or len(row) != 5 or not row[4].startswith("fait") or f"`{cid}`" not in row[4]:
        bad.append(f"spec 8.2 row {action!r} is not « fait (`{cid}`) »")
if "### 4.24 Palette de commandes (*à créer*)" in spec:
    bad.append("spec 4.24 still « à créer »")
prog = pathlib.Path("PROGRESS.md").read_text().splitlines()
line = next((l for l in prog if l.lstrip().startswith("- **EX0b2**")), "")
if "2026-11-25-ex0b2-palette.md" not in line:
    bad.append("PROGRESS EX0b2 line absent or not pointing at the plan")
s426 = spec[spec.index("### 4.26 "):spec.index("### 4.27 ")]
if "`app.shortcuts`" not in s426 or "AdwShortcutsDialog" not in s426 or "GtkShortcutsWindow" in s426:
    bad.append("spec 4.26 does not name `app.shortcuts` and AdwShortcutsDialog (or still GtkShortcutsWindow)")
ux = pathlib.Path("docs/ux-principles.md").read_text().splitlines()
r3 = next((" ".join([l] + ux[i + 1:i + 2]) for i, l in enumerate(ux) if l.startswith("3. **Trois accès")), "")
if not ("Maj+P" in r3 and "Rechercher une commande" in r3 and "raccourci" in r3):
    bad.append("ux-principles rule 3 no longer names the palette, its chord, its menu item and its shown shortcut")
if "→ EX0b3" not in text or not any(l.lstrip().startswith("- **EX0b3**") for l in prog):
    bad.append("typo tolerance not filed as → EX0b3 with its PROGRESS line")
u = pathlib.Path("docs/plans/2026-11-24-ux1-interface-plan.md").read_text().splitlines()
i48 = next((i for i, l in enumerate(u) if l.startswith("48. ")), None)
r48 = "" if i48 is None else " ".join([u[i48]] + [l for l in u[i48 + 1:i48 + 4] if l.startswith("    ")])
if not ("récentes" in r48 and "qualité" in r48 and "départage" in r48):
    bad.append("UX1 rule 48 no longer orders the palette")
sys.exit(f"EX0b2 docs: {bad}" if bad else 0)
PY'''

