[[criteria]]
# End to end in Chromium, first attempt only, nothing skipped: EX0b2-E1 (palette, from the text and from the main menu),
# EX0b2-E2 (PERF-PALETTE with the e2e build's 1 000 fixture commands, architecture §15.4: first open <= 200 ms; slowest
# of 10 warm opens and of 10 one-letter queries <= 50 ms, read from performance marks), EX0b2-E3
# (shortcuts window), and the EX0b1 scenarios whose keys and menu the palette shares. Exclusive slot for the timing.
id = "e2e"
command = '''set -eu
mkdir -p .task/ex0b2
rm -f .task/ex0b2/e2e.json
timeout -k 10 200 ./scripts/heavy.sh mise run e2e:build
rc=0
(cd frontend && PLAYWRIGHT_JSON_OUTPUT_NAME=../.task/ex0b2/e2e.json INKWELL_E2E_BROWSER=chromium timeout -k 10 300 ../scripts/heavy.sh --exclusive ./node_modules/.bin/playwright test ex0b2.spec.ts ex0b1.spec.ts shell.spec.ts save.spec.ts --grep "EX0b2-E[123]|EX0b1-E[12]|UI-02|UI-03|SAV-03b" --reporter=json > /dev/null) || rc=$?
python3 -I - "$rc" .task/ex0b2/e2e.json <<'PY'
import json, pathlib, sys
need = ["EX0b2-E1", "EX0b2-E2", "EX0b2-E3", "EX0b1-E1", "EX0b1-E2", "UI-02", "UI-03", "SAV-03b"]
