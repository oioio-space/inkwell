[[criteria]]
# The system-dependent proof (CLAUDE.md « Pièges connus »: the defect was seen only on GitHub). gates/SB2b1g/GITHUB.md
# lists five run ids (lines « run: N ») of .github/workflows/ci.yml, event workflow_dispatch, branch candidate/sb2b1g-*,
# head SHA equal to this checkout's HEAD: each on its FIRST attempt (a rerun hides the flake that this block fixes) with
# job ci successful (it runs TestBoundSparesDirtyFileCache/local_storage on the runner's own storage). Red at step 1:
# no candidate yet.
id = "github"
command = '''timeout -k 10 120 python3 -I - "$(git rev-parse HEAD)" <<'PY'
import json, pathlib, re, subprocess, sys
head = sys.argv[1]
p = pathlib.Path("gates/SB2b1g/GITHUB.md")
ids = re.findall(r"^run: (\d+)$", p.read_text(), re.M) if p.exists() else []
bad = [] if len(set(ids)) >= 5 else [f"want 5 run ids in {p}, got {len(set(ids))}"]
api = lambda path: json.loads(subprocess.run(["gh", "api", path], capture_output=True, text=True, check=True).stdout)
for i in sorted(set(ids)):
    r = api(f"repos/oioio-space/inkwell/actions/runs/{i}")
    if (r.get("path", "").split("@")[0], r.get("event"), r.get("head_sha"), r.get("run_attempt")) != (".github/workflows/ci.yml", "workflow_dispatch", head, 1) or not r.get("head_branch", "").startswith("candidate/sb2b1g-") or r.get("repository", {}).get("full_name") != "oioio-space/inkwell":
        bad.append(f"run {i}: not a first-attempt ci dispatch of HEAD on candidate/sb2b1g-*")
        continue
    jobs = api(f"repos/oioio-space/inkwell/actions/runs/{i}/attempts/1/jobs")["jobs"]
    if not any(j["name"] == "ci" and j["conclusion"] == "success" for j in jobs):
        bad.append(f"run {i}: job ci not successful")
sys.exit(f"SB2b1g github: {bad}" if bad else 0)
PY'''

