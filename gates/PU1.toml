[[criteria]]
# The model (spec §8.7.9, plan §3): exactly these nineteen runs, no ✗. A clock per opening stream (D ticks from the
# open, NewStream and ACK together); the deadline fires at D whatever is in flight; acceptance remembered per
# connection and stream. Sound: Honest (honest timing; L1 BothUp, L2), Late (the closed-at-once trace, a close, a
# Drop/re-admission, the move, any timing: invariants), LateLive (L2), Silent (a silent responder: L2), Stuck (b's
# handler never decides, any timing, time passes: S5 NoUpFromStuck, S4 Budget, L2), Byzantine (invariants), Reuse (a
# move abandoned at its deadline with its ACK in flight, then another on the same connection: invariants). Mutants
# caught by the named property: M1 UpOnReturn (S3), M2 BeforeAdmit (S1), M3 AfterOwnUp (L1: the deadlock), M4
# MoveNoAck (S2), M5 NoRetention (S1), M6 TimeoutGuarded (L2: a deadline waiting for silence never fires against a
# stuck handler), M7 AckByConn (S2: a late ACK of an abandoned stream), M8 BudgetPerPhase (S4: slow negotiation and
# a late ACK). Witnesses reached: the lazy path on a refused connection, both up, a move, a deadline firing while
# bytes are in flight. Structure: the rule operators are the sound ones in PeerUpAck.tla.
id = "tla"
command = '''out=$(INKWELL_TLA_ONLY='^PeerUpAck' INKWELL_PERF_LOAD_WAIT=120 timeout -k 10 600 ./scripts/heavy.sh --exclusive ./scripts/tla-check.sh 2>&1) || { echo "$out" | tail -40; exit 1; }
! echo "$out" | grep -q '✗' || { echo "$out" | grep '✗'; exit 1; }
for want in "✓ PeerUpAckHonest: no error (exhaustive, liveness checked)" "✓ PeerUpAckLate: no error (exhaustive, invariants)" "✓ PeerUpAckLateLive: no error (exhaustive, liveness checked)" "✓ PeerUpAckSilent: no error (exhaustive, liveness checked)" "✓ PeerUpAckStuck: no error (exhaustive, liveness checked)" "✓ PeerUpAckByzantine: no error (exhaustive, invariants)" "✓ PeerUpAckReuse: no error (exhaustive, invariants)" "✓ PeerUpAckUpOnReturn: violation detected (NoUpOnRefused)" "✓ PeerUpAckBeforeAdmit: violation detected (UpAfterAccept)" "✓ PeerUpAckAfterOwnUp: violation detected (BothUp)" "✓ PeerUpAckMoveNoAck: violation detected (SessionOnAccepted)" "✓ PeerUpAckNoRetention: violation detected (UpAfterAccept)" "✓ PeerUpAckTimeoutGuarded: violation detected (OpenResolves)" "✓ PeerUpAckAckByConn: violation detected (SessionOnAccepted)" "✓ PeerUpAckBudgetPerPhase: violation detected (Budget)" "✓ PeerUpAckWitnessLazyLate: violation detected (NotLazyLate)" "✓ PeerUpAckWitnessBothUp: violation detected (NotBothUp)" "✓ PeerUpAckWitnessMove: violation detected (NoMove)" "✓ PeerUpAckWitnessLateFire: violation detected (NoLateFire)"; do echo "$out" | grep -qxF -- "$want" || { echo "missing: $want"; exit 1; }; done
[ "$(echo "$out" | grep -c '✓')" -eq 19 ] || { echo "want 19 ✓, got $(echo "$out" | grep -c '✓')"; exit 1; }
python3 -I - <<'PY'
import pathlib, re, sys
t = pathlib.Path("docs/protocol/tla/PeerUpAck.tla").read_text()
bad = [w for w in [r"^AckReady\(m, c\) == admit\[m\] /\\ Usable\(m, c\)$", r"^ReturnOpens == FALSE$", r"^MoveAtReturn == FALSE$", r"^AckMatches\(st, m\) == st\.s = m\.s$", r"^TimeoutReady\(n, st\) == st\.age = D$", r"^ResetOnReturn == FALSE$", r"^Budget ==", r"^NoUpFromStuck ==", r"^UpAfterAccept ==", r"^SessionOnAccepted ==", r"^NoUpOnRefused ==", r"^BothUp ==", r"^OpenResolves =="] if not re.search(w, t, re.M)]
sys.exit(f"PeerUpAck structure: {bad}" if bad else 0)
PY'''

[[criteria]]
# The rules in Go (internal/transport/p2p, simnet inside testing/synctest, -race), each arm named, failure texts
# « PU1 PeerUp without acceptance » (an announcement the rules forbid) or « PU1 session not up » (a session the rules
# allow, missing or late). TestPeerUpAfterAck: closed_at_once_by_remote (the defect's trace on main's code: b holds a's
# protocol cached from an earlier session; a raw libp2p host with a's key closes every new connection in its Connected
# notification; within 1 s b sees no PeerUp and holds no connection), one_sided_admission (the remote resets without
# ACK: no PeerUp either side, connection closed, P-2), not_admitted_remote, ack_needs_live_conn (the remote's
# connection closing when the stream lands: no ACK), silent_remote (the remote accepts and never writes: no PeerUp,
# connection closed at 15 s simulated, P-5), slow_negotiation_late_ack (the negotiated path; the remote's
# multistream echo is held 10 s, its ACK comes 6 s after: the connection is closed at 15 s from the open, ± 10 ms,
# never PeerUp: one budget for NewStream and the ACK, P-5), wrong_ack_byte (0x02: no PeerUp, closed, P-4), byte_after_ack (PeerUp
# then closed within 1 s), ack_before_own_up (a raw host opens a sync stream to b and serves none of b's: it reads
# 0x01 while b has not announced it, P-3), both_sides_up (two nodes, crossed opens, cached and negotiated paths: both
# PeerUp), old_peer_refused (a peer serving only /inkwell/sync/1.0.0: no PeerUp, connection closed, P-7).
# TestPeerUpMoveAfterAck (the relay-to-direct upgrade of block NI0, on main): move_waits_for_ack (the session moves to
# the direct connection only after the ACK; frames keep their order), move_refused_keeps_circuit (the remote resets
# the direct stream: the session stays on the circuit, no PeerDown, no PeerUp). TestPeerUpLatency, a paired
# measurement in one run on controlled time (synctest, simnet path of RTT R = 100 ms): the PeerUp delay of the same
# setup with the ACK minus without it (a test-only seam in export_test.go skips the ACK read); cached: R to R + 2 ms
# (exactly one more round trip, by construction); negotiated: 0 to R + 2 ms. Both differences are logged for the
# report; failure text « PU1 latency ». The measurement was prototyped at step 1 on main's code (raw libp2p hosts,
# a stand-in ACK): gates/PU1/latency_proto_test.go.txt, result in WITNESSES.md.
id = "go"
command = '''mkdir -p .task && timeout -k 10 300 ./scripts/heavy.sh go test -count=1 -race -timeout=270s -json -run '^(TestPeerUpAfterAck|TestPeerUpMoveAfterAck|TestPeerUpLatency)$' ./internal/transport/p2p/ > .task/pu1-go.json 2>&1; a=$?; python3 -I - "$a" <<'PY'
import json, pathlib, sys
arms = {"TestPeerUpAfterAck": ["closed_at_once_by_remote", "one_sided_admission", "not_admitted_remote", "ack_needs_live_conn", "silent_remote", "slow_negotiation_late_ack", "wrong_ack_byte", "byte_after_ack", "ack_before_own_up", "both_sides_up", "old_peer_refused"], "TestPeerUpMoveAfterAck": ["move_waits_for_ack", "move_refused_keeps_circuit"], "TestPeerUpLatency": ["cached", "negotiated"]}
evs = []
for line in pathlib.Path(".task/pu1-go.json").read_text().splitlines():
    try:
        ev = json.loads(line)
    except ValueError:
        continue
    if isinstance(ev, dict):
        evs.append(ev)
bad = [] if sys.argv[1] == "0" else [f"go test exit {sys.argv[1]}"]
passed = {e["Test"] for e in evs if e.get("Action") == "pass" and e.get("Test")}
want = list(arms) + [f"{t}/{a}" for t, l in arms.items() for a in l]
bad += [f"missing or not passing: {n}" for n in want if n not in passed]
for n in sorted({e["Test"] for e in evs if e.get("Action") == "fail" and e.get("Test")})[:3]:
    said = [e["Output"].strip() for e in evs if e.get("Test") == n and e.get("Action") == "output" and "_test.go" in e.get("Output", "")]
    print(f"{n}: {said[:2]}")
sys.exit(f"PU1 go: {bad[:12]}" if bad else 0)
PY'''

