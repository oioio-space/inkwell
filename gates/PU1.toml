[[criteria]]
# Architecture: inkwell has no private copy of the codec (spec §1.6): internal/transport/p2p imports
# protocol/syncack, defines no 0x01 ACK constant of its own, and serves and opens /inkwell/sync/2.0.0 only.
id = "arch"
command = '''timeout -k 10 30 python3 -I - <<'PY'
import pathlib, re, sys
src = {p: p.read_text() for p in pathlib.Path("internal/transport/p2p").glob("*.go") if not p.name.endswith("_test.go")}
allsrc = "\n".join(src.values())
bad = []
if '"github.com/oioio-space/inkwell/protocol/syncack"' not in allsrc:
    bad.append("internal/transport/p2p does not import protocol/syncack")
if re.search(r'"/inkwell/sync/1\.0\.0"', allsrc):
    bad.append("/inkwell/sync/1.0.0 still in the product code")
if not re.search(r'ProtocolSync\s*=\s*"/inkwell/sync/2\.0\.0"', allsrc):
    bad.append("ProtocolSync is not /inkwell/sync/2.0.0")
if re.search(r"(?i)ack\w*\s*=\s*(byte\()?0x01", allsrc):
    bad.append("a private ACK constant in internal/transport/p2p")
sys.exit(f"PU1 arch: {bad}" if bad else 0)
PY'''

