# FROZEN 2026-11-16 after two Codex reviews (gates/HP1/WITNESSES.md, plan « Codex debate »). Acceptance for block HP1 (a relayed
# link to a wanted peer keeps trying to become direct: rules H-1..H-17). Rigour: complete (state between peers, bytes
# and traffic driven by a peer). Plan: docs/plans/2026-11-16-hp1-direct-upgrade.md (§4 rules, §6 model, §9 gate
# sketch); ADR 0045. Written at step 1, before any production code; red witnesses in gates/HP1/WITNESSES.md.
# First of the five gates of block HP1, run on the same candidate (split on 2026-11-16 to fit rule G-1's 45 min; method
# v2: a cap exceeded means re-cutting, never dropping a proof): this one holds the specification, the Go proofs and their
# mutant table; gates/HP1m.toml runs the Go mutants; gates/HP1n.toml, gates/HP1n2.toml and gates/HP1n3.toml hold the
# network simulation of plan §9. No gate runs another; the block is accepted when the five pass on the same candidate.
# Every long command is `timeout -k 10 N …/scripts/heavy.sh …` (the timeout covers the wait for a slot). No nested gate.
# The module `protocol` is nested: its tests and gremlins run from protocol/; the mutants name its package by import path.
# The Go tests on synctest are on controlled time: their verdict does not depend on load, so they stay in a shared
# slot; TLC runs under `heavy.sh --exclusive` (coordinator, after the model's B1-B6 round: 273 s measured). Deadline: scripts/gate.py refuses caps that sum past max_minutes and stops the run at it
# (PC1a rule G-1). Caps are sized from the durations measured in gates/HP1/WITNESSES.md.
max_minutes = 45
raw_results = ["docs/plans/2026-11-16-hp1-direct-upgrade.md", "docs/adr/0045-direct-upgrade-retry.md", "docs/protocol/tla/DirectUpgrade.tla", "docs/protocol/alloy/DirectUpgradeRoles.als", "gates/HP1/*"]

[[criteria]]
# Each rule row H-1..H-17 is in the plan, H-15's row reads « Adopted » (B1), the plan states the corrected worst case
# (B3: ≤ 456 destinations ≈ 15.5 MB/h per node, ≤ 174 ≈ 5.9 MB/h per Byzantine member); spec §8.6 « Montée en direct » exists, in French,
# with the peer-observable bounds of plan §5; §16 states them; §20.6 registers /libp2p/dcutr; the corpus
# protocol/vectors/directup.json exists (vectors are top-level files of protocol/vectors, embedded by `*.json`); the
# ADR's status line says accepted and not proposed.
id = "docs"
command = '''python3 -I - <<'PY'
import json, pathlib, sys
plan = pathlib.Path("docs/plans/2026-11-16-hp1-direct-upgrade.md").read_text()
bad = [f"plan row H-{i}" for i in range(1, 18) if f"\n| H-{i} |" not in plan]
row15 = [l for l in plan.splitlines() if l.startswith("| H-15 |")]
if not row15 or not row15[0].startswith("| H-15 | Adopted") or "Proposed" in row15[0]:
    bad.append("plan row H-15 does not read Adopted")
flat = " ".join(plan.split())
bad += [f"plan lacks the corrected worst case {w!r}" for w in ["456 destinations", "15.5 MB/h", "174 in any hour", "5.9 MB/h"] if w not in flat]
spec = pathlib.Path("docs/protocol/spec.md").read_text()
def section(head, ends):
    i = spec.find(head)
    if i < 0:
        return None
    j = min([k for k in (spec.find(e, i + len(head)) for e in ends) if k > 0] or [len(spec)])
    return " ".join(spec[i:j].split())
s86 = section("\n### 8.6 ", ["\n### ", "\n## "])
if s86 is None:
    bad.append("spec §8.6 missing")
else:
    if "Montée en direct" not in s86[:80]:
        bad.append("spec §8.6 is not « Montée en direct »")
    for w in ["/libp2p/dcutr", "NE DOIT PAS", "PEUT refuser", "un seul appel en cours", "12 appels", "45 rondes", "174 destinations", "non-membre", "16 min"]:
        if w not in s86:
            bad.append(f"spec §8.6 lacks {w!r}")
s16 = section("\n## 16. ", ["\n## "])
if s16 is None or "45 rondes" not in s16 or "174 destinations" not in s16:
    bad.append("spec §16 does not state the HP1 bounds (45 rondes, 174 destinations)")
s206 = section("\n### 20.6 ", ["\n### ", "\n## "])
if s206 is None or "/libp2p/dcutr" not in s206:
    bad.append("spec §20.6 does not register /libp2p/dcutr")
try:
    json.loads(pathlib.Path("protocol/vectors/directup.json").read_text())
except (OSError, ValueError) as e:
    bad.append(f"protocol/vectors/directup.json: {e}")
adr = pathlib.Path("docs/adr/0045-direct-upgrade-retry.md")
st = [l for l in adr.read_text().splitlines() if l.startswith("status:")] if adr.exists() else []
if not st or "accepted" not in st[0] or "proposed" in st[0]:
    bad.append("ADR 0045 missing or its status line is not accepted")
sys.exit(f"HP1 docs: {bad}" if bad else 0)
PY'''

[[criteria]]
# Plan §6 after B1-B4, B6: the seven DirectUpgrade configurations hold (six exhaustive with liveness, Byzantine
# invariants only); the 30 mutant runs (M1-M29) and the 7 witnesses are each caught by the property their README row
# names (scripts/tla-check.sh prints it in parentheses): 44 ✓, no ✗, and neither TwoCircuitsResolve nor a Residual run
# (H-15 is adopted). Structure: each configuration lists the 17 invariants S1-S17, the six non-Byzantine ones the
# properties Upgrades, BusyEnds and DupResolves, and TwoCircuits sets CrossCancel = TRUE (overlapping punches may fail).
id = "tla"
command = '''out=$(INKWELL_TLA_ONLY='^DirectUpgrade' INKWELL_PERF_LOAD_WAIT=180 timeout -k 10 900 ./scripts/heavy.sh --exclusive ./scripts/tla-check.sh 2>&1) || { echo "$out" | tail -40; exit 1; }
[ "$(echo "$out" | grep -c '✓')" -eq 44 ] || { echo "want 44 ✓, got $(echo "$out" | grep -c '✓')"; exit 1; }
! echo "$out" | grep -q '✗' || { echo "$out" | grep '✗'; exit 1; }
! echo "$out" | grep -qE 'TwoCircuitsResolve|Residual' || { echo "a TwoCircuitsResolve or Residual run is still registered"; exit 1; }
for n in DirectUpgradeHonest DirectUpgradeSilent DirectUpgradeTwoCircuits DirectUpgradeAnswerer DirectUpgradeTwoPeers DirectUpgradeLostPush; do
  echo "$out" | grep -qxF -- "✓ $n: no error (exhaustive, liveness checked)" || { echo "sound configuration missing or failing: $n"; exit 1; }
done
echo "$out" | grep -qxF -- "✓ DirectUpgradeByzantine: no error (exhaustive, invariants)" || { echo "sound configuration missing or failing: DirectUpgradeByzantine"; exit 1; }
while read -r m p; do
  echo "$out" | grep -qxF -- "✓ DirectUpgrade$m: violation detected ($p)" || { echo "mutant or witness not caught by its named property: DirectUpgrade$m ($p)"; exit 1; }
done <<'M'
NoRetry Upgrades
StaleApplied StaleIgnored
StaleAppliedLive Upgrades
BusyTakesToken BusyFree
AnyPeer NoLaunchUnwanted
OutboundPunch RoleOK
LowerOnly Upgrades
EpochRefills RoundBudget
SchedulerOnly RoundBudget
NoLocalReady NoLaunchUnready
StopAtCap Upgrades
NoCap GlobalCap
WhileDirect NoLaunchDirect
WhileInFlight OneCall
GateAnyPeer NoRoundUnwanted
NoDeadline BusyEnds
EpochRefillsAttempts AttemptBudget
RemoteGuard Upgrades
AnyOrder BusyEnds
PreDialFree DestBudget
GaterAnyPeer NoDialUnwanted
IdleIgnored NoLadderCallIdle
StaySuspended Upgrades
GrantFree AdmissionBudget
H15Off Upgrades
NoClose DupResolves
NoAllowance NoUnallowedDial
GaterNoLease NoUnallowedDial
TicketAny NoTicketUnwanted
PlaceLost Upgrades
WitnessDirect NoDirect
WitnessStale NoStaleResult
WitnessBusy NoBusy
WitnessSlow NoSlowStep
WitnessGateRefusal NoGateRefusal
WitnessWaitBehind NoWaitBehind
WitnessCross NoCross
M
python3 -I - <<'PY'
import pathlib, re, sys
inv = ["OneCall", "NoLaunchUnwanted", "NoLaunchDirect", "RoleOK", "RoundBudget", "NoRoundUnwanted", "NoLaunchUnready", "StaleIgnored", "GlobalCap", "AttemptBudget", "BusyFree", "DestBudget", "NoDialUnwanted", "NoLadderCallIdle", "AdmissionBudget", "NoUnallowedDial", "NoTicketUnwanted"]
props = ["Upgrades", "BusyEnds", "DupResolves"]
bad = []
for c in ["Honest", "Silent", "TwoCircuits", "Answerer", "TwoPeers", "LostPush", "Byzantine"]:
    text = pathlib.Path(f"docs/protocol/tla/DirectUpgrade{c}.cfg").read_text()
    m = re.search(r"^INVARIANTS?\n(.*?)(?=^[A-Z_]+\b|\Z)", text, re.M | re.S)
    have = set(m.group(1).split()) if m else set()
    bad += [f"{c}: invariant {i} missing" for i in inv if i not in have]
    if c != "Byzantine":
        m = re.search(r"^PROPERTIES?\n(.*?)(?=^[A-Z_]+\b|\Z)", text, re.M | re.S)
        have = set(m.group(1).split()) if m else set()
        bad += [f"{c}: property {p} missing" for p in props if p not in have]
if not re.search(r"^\s*CrossCancel\s*=\s*TRUE\s*$", pathlib.Path("docs/protocol/tla/DirectUpgradeTwoCircuits.cfg").read_text(), re.M):
    bad.append("TwoCircuits: CrossCancel is not TRUE")
sys.exit(f"HP1 tla structure: {bad}" if bad else 0)
PY'''

