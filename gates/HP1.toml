[[criteria]]
# H-1..H-17 in Go, under -race with an explicit -timeout (Go names a stuck test): the pure policy protocol/directup
# (nested module, run from protocol/) and the integration tests of internal/transport/p2p on controlled time
# (synctest). Both runs succeed and every named test passes (go test -json events, not grep of -v text). H-15 is
# asserted by TestUpgradeCrossedExchanges (its oracle: no DCUtR stream with two circuits, the higher PeerID's circuit
# closed within 5 s); its overlap and both-fail figures are information only, copied to gates/HP1/CROSSED.md when logged.
id = "go"
command = '''mkdir -p .task && cd protocol && timeout -k 10 90 ../scripts/heavy.sh go test -count=1 -race -timeout=60s -json ./directup/ > ../.task/hp1-go-pure.json 2>&1; a=$?; cd .. && timeout -k 10 300 ./scripts/heavy.sh go test -count=1 -race -timeout=270s -json -run '^TestUpgrade' ./internal/transport/p2p/ > .task/hp1-go-sim.json 2>&1; b=$?; python3 -I - "$a" "$b" <<'PY'
import json, pathlib, re, sys
pure = ["TestPolicyActsOnlyWhenWantedAndRelayed", "TestPolicyLocalReadyIsAGuardRemoteReadyATrigger", "TestPolicyRoles", "TestPolicyOneCallInFlight", "TestSlotsFIFOWithLease", "TestPolicyEpoch", "TestClassify", "TestPolicyLadders", "TestPolicyEvents", "TestPolicyNoHopelessState", "TestAttemptBudget", "TestAddrFilterAndGater", "TestPolicySettle", "TestPolicyDirectUnwantClose", "TestNodeAdmissions", "TestPolicyActivity", "TestCorpus"]
sim = ["TestUpgradeRelayOnlyMakesNoCall", "TestUpgradeAfterRestartBeforeHandler", "TestUpgradeNotBeforeLocalReady", "TestUpgradeTwoCircuits", "TestUpgradeOneCallInFlight", "TestUpgradeSlotsFIFO", "TestUpgradeAfterRestartDuringAttempt", "TestUpgradeHopelessIsCalm", "TestUpgradeAfterLongBlock", "TestUpgradeByzantineReconnect", "TestUpgradeGateRefusesSpam", "TestUpgradeDialsOnlyAdmitted", "TestUpgradeStaleDirectSettles", "TestUpgradeCloseDuringAttempt", "TestUpgradeCrossedExchanges", "TestUpgradeNodeTraffic", "TestUpgradeAnswererBehindQueue", "TestUpgradeIdleNoLadder"]
def events(path):
    out = []
    for line in pathlib.Path(path).read_text().splitlines():
        try:
            ev = json.loads(line)
        except ValueError:
            continue
        if isinstance(ev, dict):
            out.append(ev)
    return out
bad = [f"exit codes pure {sys.argv[1]}, sim {sys.argv[2]}"] if sys.argv[1:] != ["0", "0"] else []
crossed = []
for path, names in ((".task/hp1-go-pure.json", pure), (".task/hp1-go-sim.json", sim)):
    evs = events(path)
    passed = {e["Test"] for e in evs if e.get("Action") == "pass" and e.get("Test")}
    failed = sorted({e["Test"] for e in evs if e.get("Action") == "fail" and e.get("Test")})
    bad += [f"missing or not passing: {n}" for n in names if n not in passed]
    for n in failed[:3]:
        said = [e["Output"].strip() for e in evs if e.get("Test") == n and e.get("Action") == "output" and "_test.go" in e.get("Output", "")]
        print(f"{n}: {said[:2]}")
    crossed += [e["Output"].strip() for e in evs if e.get("Test", "").startswith("TestUpgradeCrossedExchanges") and e.get("Action") == "output"]
lines = [m.group(0) for l in crossed if (m := re.search(r"H-15 crossed offset=(\S+) runs=20 overlap=\d+ bothfail=\d+", l))]
if lines:
    pathlib.Path("gates/HP1").mkdir(exist_ok=True)
    pathlib.Path("gates/HP1/CROSSED.md").write_text("# HP1 - TestUpgradeCrossedExchanges (H-15, information only)\n\nWritten by the gate's `go` criterion.\n\n" + "\n".join(f"- `{l}`" for l in lines) + "\n")
sys.exit(f"HP1 go: {bad[:12]}" if bad else 0)
PY'''

