[[criteria]]
# Vectors (spec §8.7.9). syncorder.json is exactly step 1's corpus (digest of id, decoder, input, context, events,
# expect, verdict, scope over the 20 vectors: step 2 changes only status/enforce), every vector is enforced from step 3,
# the generator reproduces the committed corpus, and TestCorpus passes every syncorder.json case as required (no
# « future: »: the reference decoders sync_order and sync_refusal exist in protocol/conformance, backed by
# protocol/syncack). PU1's syncack.json is unchanged (its digest).
id = "vectors"
command = '''mkdir -p .task && cd protocol && timeout -k 10 240 ../scripts/heavy.sh go test -count=1 -json -run '^(TestCorpus|TestGenerateMatchesCommittedCorpus)$' -v ./conformance/ ./cmd/vectors/ > ../.task/pu1b-vectors.json 2>&1; a=$?; cd .. && python3 -I - "$a" <<'PY'
import hashlib, json, pathlib, sys
bad = [] if sys.argv[1] == "0" else [f"go test exit {sys.argv[1]}"]
keep = ("id", "decoder", "input_hex", "context", "events", "expect", "verdict", "scope")
def digest(name):
    d = json.loads(pathlib.Path(f"protocol/vectors/{name}").read_text())
    canon = json.dumps([{k: v[k] for k in keep if k in v} for v in d["vectors"]], sort_keys=True, ensure_ascii=False, separators=(",", ":"))
    return d, (len(d["vectors"]), hashlib.sha256(canon.encode()).hexdigest())
d, got = digest("syncorder.json")
if got != (20, "5fee8f342018e830d6920c30aa03600607c2d8be44342429f2d33069ba2293a4"):
    bad.append("syncorder.json differs from step 1's corpus")
if digest("syncack.json")[1] != (34, "5307797671903594e1ccfef42b9a62536e18c0a139ed0d6af0af93c503e12d50"):
    bad.append("PU1's syncack.json changed")
bad += [f"{v['id']}: enforce {v.get('enforce')!r}, want 'step-3'" for v in d["vectors"] if v.get("enforce") != "step-3"][:3]
evs = []
for line in pathlib.Path(".task/pu1b-vectors.json").read_text().splitlines():
    try:
        e = json.loads(line)
    except ValueError:
        continue
    if isinstance(e, dict):
        evs.append(e)
passed = {e["Test"] for e in evs if e.get("Action") == "pass" and e.get("Test")}
future = {e["Test"] for e in evs if e.get("Action") == "output" and "future:" in e.get("Output", "")}
for v in d["vectors"]:
    n = f"TestCorpus/syncorder.json/{v['id']}"
    if n not in passed or n in future:
        bad.append(f"{n}: {'future (not required)' if n in future else 'missing or failing'}")
if "TestGenerateMatchesCommittedCorpus" not in passed:
    bad.append("TestGenerateMatchesCommittedCorpus not passing")
sys.exit(f"PU1b vectors: {bad[:12]}" if bad else 0)
PY'''

