[[criteria]]
# The model (plan §4, README « SyncOrder »): exactly these twelve runs, no ✗. Sound: Honest (move, drop, reopen: the
# capacity refusal reached, its backoff waited, retried; honest timing; Places, Order, SessionKept, Budget,
# AllDelivered, SessionResumes, EmptyLeaves), AnyTiming (the same, any timing: the budget may run out; invariants),
# Byzantine (opens, writes, ends, resets, holds; a waiting stream may give the order up; Places, EmptyLeaves). Mutants
# caught by the named property: Q1 NoWake (AllDelivered), Q2 KeepEmpty (EmptyLeaves), Q3 ClosePeerOnBusy
# (SessionKept), Q4 Bound3 (Places), Q5 EofKeeps (EmptyLeaves: an empty end of writing); witnesses: a capacity refusal
# reached by an honest opener, a removal while a successor waits, an empty end of writing leaving, the budget running
# out during a capacity refusal.
# Structure: the rule operators are the sound ones. PU1's PeerUpAck.tla and its 19 runs are untouched.
id = "tla"
command = '''out=$(INKWELL_TLA_ONLY='^SyncOrder' INKWELL_PERF_LOAD_WAIT=120 timeout -k 10 300 ./scripts/heavy.sh --exclusive ./scripts/tla-check.sh 2>&1) || { echo "$out" | tail -40; exit 1; }
! echo "$out" | grep -q '✗' || { echo "$out" | grep '✗'; exit 1; }
for want in "✓ SyncOrderHonest: no error (exhaustive, liveness checked)" "✓ SyncOrderAnyTiming: no error (exhaustive, invariants)" "✓ SyncOrderByzantine: no error (exhaustive, liveness checked)" "✓ SyncOrderNoWake: violation detected (AllDelivered)" "✓ SyncOrderKeepEmpty: violation detected (EmptyLeaves)" "✓ SyncOrderClosePeerOnBusy: violation detected (SessionKept)" "✓ SyncOrderBound3: violation detected (Places)" "✓ SyncOrderEofKeeps: violation detected (EmptyLeaves)" "✓ SyncOrderWitnessBusy: violation detected (NoBusy)" "✓ SyncOrderWitnessRemoveWaiting: violation detected (NoRemovalWhileWaiting)" "✓ SyncOrderWitnessEmptyEof: violation detected (NoEmptyEof)" "✓ SyncOrderWitnessBudgetOut: violation detected (NoBudgetOut)"; do echo "$out" | grep -qxF -- "$want" || { echo "missing: $want"; exit 1; }; done
[ "$(echo "$out" | grep -c '✓')" -eq 12 ] || { echo "want 12 ✓, got $(echo "$out" | grep -c '✓')"; exit 1; }
python3 -I - <<'PY'
import pathlib, re, sys
t = pathlib.Path("docs/protocol/tla/SyncOrder.tla").read_text()
bad = [w for w in [r"^PlaceFree == Len\(list\) < Cap$", r"^EarlyOK\(s\) == TRUE$", r"^Ended\(s\) == rstd\[s\] \\/ \(fin\[s\] /\\ buf\[s\] = <<>>\)$", r"^Budget ==", r"^Tick ==", r"^OutOfBudget ==", r"^Rewire\(s\) == waitFor\[s\]$", r"^OnBusyKill == FALSE$", r"^Places ==", r"^Order ==", r"^SessionKept ==", r"^EmptyLeaves ==", r"^AllDelivered ==", r"^SessionResumes =="] if not re.search(w, t, re.M)]
sys.exit(f"SyncOrder structure: {bad}" if bad else 0)
