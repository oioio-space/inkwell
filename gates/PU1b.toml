[[criteria]]
# The rules in Go (internal/transport/p2p, simnet inside testing/synctest, -race), each arm named; failure texts
# « PU1b over capacity » (a third place), « PU1b place kept » (a place or a goroutine kept past the rule), « PU1b turn
# missed » (a stream whose turn came does not read), « PU1b order broken » (frames out of order), « PU1b session lost »
# (a capacity refusal closed the peer or announced it down). The node exports, for tests, InboundPlaces(peer) and
# BusyRefusals(). TestSyncOrder: at_bound (a raw opener holds two ACKed streams: InboundPlaces = 2),
# bound_plus_one (a third stream: reset with StreamError code 0x1002 seen by the raw opener as remote, no byte, the
# connection kept, places still 2, BusyRefusals + 1), recovery (the raw opener ends its first stream; its retry is
# placed and ACKed; and a Node opener refused twice for capacity by a raw responder announces it after the waits of
# 50 and 100 ms, never ClosePeer), busy_forever (a raw responder that always answers 0x1002: no PeerUp, the connection
# closed 15 s after the open ± 10 ms, P-5), byzantine_reset_loop (a raw opener holds a first stream open and opens then
# resets 50 streams during their ACK: InboundPlaces never above 2 and back to 1 within 1 s of the last reset;
# runtime.NumGoroutine at most the count before the loop + 8), resource_manager_refusal (a raw responder whose libp2p
# resource manager admits no inbound sync stream: every open is reset during its negotiation with code 0x1002; the Node
# opener counts them as capacity refusals (BusyRetries ≥ 2), never announces it, and closes the connection 15 s after
# the open ± 10 ms, P-5), generation_change (two Nodes up; b's handler of a's stream held after its ACK; a's
# connection closed: PeerDown on both sides, then reconnected: PeerUp on both, while the old handler still holds its
# place; a's new stream placed behind it, released: the old one leaves without a frame, the new one reads; exactly one
# PeerDown and one PeerUp per side, InboundPlaces(a) ≤ 2 throughout and 1 at the end, runtime.NumGoroutine back to at
# most the count before + 8, the frames b delivers after the PeerUp strictly increasing), drain_replace_reconnect (two Nodes, relay then direct:
# b's handlers of the relayed and of the direct stream held after their ACK (SetAfterAck), the direct connection
# dropped, a's reopen on the circuit refused for capacity at least once (BusyRefusals ≥ 1), then placed once the
# dropped stream leaves; no event on either side, the frames b delivers strictly increasing), removal_while_waiting (a
# raw opener's head stream held open with no frame: a second, waiting, reset frees its place within 1 s (not after
# 60 s); a third, waiting, closed for writing without a frame frees its place within 1 s too; and resetting the head
# lets a waiting successor deliver its frame within 1 s). The node also exports BusyRetries() (capacity refusals read
# as an opener).
# TestPeerUpMoveAfterAck/move_keeps_order_across_late_handler (PU1's round-1 finding) passes too.
