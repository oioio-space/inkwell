id = "simplify-report"
command = '''timeout -k 10 30 python3 -I - <<'PY'
import sys
from pathlib import Path

report = Path("gates/WC1/SIMPLIFY.md")
if not report.is_file():
    sys.exit("WC1 /simplify review evidence is absent")
lines = report.read_text().splitlines()
required = ("## Applied", "## Set aside", "## Verified")
if not any(line.startswith("Reviewer: ") and line[10:].strip() for line in lines):
    sys.exit("WC1 /simplify reviewer is absent")
for heading in required:
    if heading not in lines:
        sys.exit(f"WC1 /simplify review lacks {heading}")
