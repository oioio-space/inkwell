# two circuits closed, H-15), kept_invitation_connect (Connect to a peer not wanted, invitation path), kept_dial_loop,
# kept_lan_sighting (a LAN sighting feeds Want), kept_upgrade_outbound_circuit_closed (a one-sided upgrade: a wants b,
