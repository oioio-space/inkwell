id = "go"
command = '''mkdir -p .task && timeout -k 10 300 ./scripts/heavy.sh go test -count=1 -race -timeout=270s -json -run '^TestUpgradeLateLinkClosed$' ./internal/transport/p2p/ > .task/hp1r-go.json 2>&1; a=$?; timeout -k 10 600 ./scripts/heavy.sh go test -count=40 -timeout=570s -json -run '^TestWantStopsAndDrop$' ./internal/transport/p2p/ > .task/hp1r-drop.json 2>&1; b=$?; python3 -I - "$a" "$b" <<'PY'
