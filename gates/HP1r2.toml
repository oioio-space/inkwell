    said = [e["Output"].strip() for e in evs if e.get("Test") == n and e.get("Action") == "output" and "_test.go" in e.get("Output", "")]
    print(f"{n}: {said[:2]}")
drop = [e for e in events(".task/hp1r-drop.json") if e.get("Test") == "TestWantStopsAndDrop"]
np, nf = sum(e.get("Action") == "pass" for e in drop), sum(e.get("Action") == "fail" for e in drop)
