arms = ["closed_dropped_side", "closed_dropping_side", "closed_drop_offsets", "closed_after_failed_connect", "closed_answerer_dial", "kept_wanted", "kept_live_circuit", "kept_renewed_circuit", "kept_two_circuits", "kept_invitation_connect", "kept_dial_loop", "kept_lan_sighting", "kept_upgrade_outbound_circuit_closed"]
def events(path):
    out = []
