[[criteria]]
# J-2 in the webview and its in-test mutants (Vitest JSON report).
id = "frontend"
command = '''cd frontend && timeout -k 10 180 ../scripts/heavy.sh pnpm exec vitest run --configLoader runner --reporter=json --outputFile=../.task/pc1b-fe.json -t 'PC1 '; rc=$?; cd .. && python3 -I - "$rc" <<'PY'
import json, sys
rc = int(sys.argv[1])
r = json.load(open(".task/pc1b-fe.json"))
ok = {a["title"] for f in r["testResults"] for a in f["assertionResults"] if a["status"] == "passed"}
need = ['PC1 join says that Inkwell restarts', 'PC1 a pending join waits for its root and never creates a document', 'PC1 the joined notice shows once', 'PC1 the join is completed only after the document is flushed', 'PC1 mutant J-2 fresh document is caught', 'PC1 mutant J-1 completion before the flush is caught']
miss = [n for n in need if n not in ok]
if rc or r["numFailedTests"] or r["numFailedTestSuites"] or miss:
    sys.exit(f"PC1b frontend: exit {rc}, failed {r['numFailedTests']}, missing {miss}")
PY'''

[[criteria]]
# J-2, J-3, J-6 end to end on the built candidate, retries 0, no error, unexpected, flaky or skipped test.
id = "e2e"
command = '''timeout -k 10 240 ./scripts/heavy.sh mise run e2e:build && cd frontend && timeout -k 10 300 ../scripts/heavy.sh ./node_modules/.bin/playwright test e2e/project-change.spec.ts --retries=0 --reporter=json > ../.task/pc1b-e2e.json; rc=$?; cd .. && python3 -I - "$rc" <<'PY'
import json, sys
rc = int(sys.argv[1])
r = json.load(open(".task/pc1b-e2e.json"))
st = r.get("stats", {})
ok = set()
stack = list(r["suites"])
while stack:
    x = stack.pop()
    stack += x.get("suites", [])
    for sp in x.get("specs", []):
        if sp["ok"] and all(t["status"] == "expected" for t in sp["tests"]):
            ok.add(sp["title"])
need = ['PC1-E2E a join restarts Inkwell on the document of the inviter', 'PC1-E2E a pending join waits while the inviter is away', 'PC1-E2E after a join and a save of the joined document, the previous text is still in its folder']
miss = [n for n in need if n not in ok]
if rc or r.get("errors") or st.get("unexpected") or st.get("flaky") or st.get("skipped") or miss:
    sys.exit(f"PC1b e2e: exit {rc}, stats {st}, missing {miss}")
PY'''

[[criteria]]
# No regression: frontend checks and the create, join and people flows.
id = "regression"
# Changed on the user's word (2026-11-15, gates/<block>/WITNESSES.md): the whole Vitest suite takes 307 s alone, past
# the 180 s cap; the frontend part is Biome, svelte-check and the Vitest tests related to the files the block
# changed since it left main (method v2: acceptance on the touched packages; the whole suite runs in `mise run ci`).
# Narrowed the same day: `--changed` followed imports and re-ran nearly the whole suite (workspace.svelte.ts is imported
# everywhere, 180 s cap reached); the Vitest part is the test files the block itself added or modified.
command = '''base=$(git merge-base HEAD main) && files=$(git diff --name-only --diff-filter=d "$base" -- frontend/src | grep -E '[.]test[.]ts$' | sed 's#^frontend/##' | tr '\n' ' ') && timeout -k 10 30 mise run fe:bindings && cd frontend && timeout -k 10 180 ../scripts/heavy.sh sh -c "pnpm exec biome check . && pnpm exec svelte-check --tsconfig ./tsconfig.json && { [ -z '$files' ] || pnpm exec vitest run --configLoader runner $files; }" && cd .. && timeout -k 10 300 ./scripts/heavy.sh mise run e2e -- e2e/join.spec.ts e2e/collab.spec.ts e2e/people.spec.ts'''

