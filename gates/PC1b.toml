# DRAFT - NOT FROZEN. Acceptance for block PC1b (an accepted invitation restarts Inkwell: J-1..J-6 and the drain N-16 on the join path, on the restart built by PC1a). Rigour: complete. Plan: docs/plans/2026-11-15-pc1b-join.md; shared part, restart
# mechanism and formal model: docs/plans/2026-11-14-pc1-project-change-by-restart.md. ADR 0043, part 2. Split on 2026-11-15 from the draft PC1 gate; reviewed by Codex,
# then frozen. The frozen gates/W58.toml stays untouched and superseded (scripts/gate.py has no notion of a superseded
# gate: the convention is these headers and gates/W58/REVIEW.md « Round 6 » and « Round 8 »).
# Every long command is `timeout -k 10 N ./scripts/heavy.sh …` (the timeout covers the wait for a slot). No nested gate.
# Deadline (Codex round 2, D-B): scripts/gate.py refuses caps that sum past max_minutes and stops the run at it (PC1a rule G-1).
max_minutes = 45
raw_results = ["docs/plans/2026-11-15-pc1b-join.md", "docs/plans/2026-11-14-pc1-project-change-by-restart.md", "docs/adr/0043-foreign-project.md", "docs/objectif-en-cours.md", "gates/PC1b/*"]

[[criteria]]
# Each rule row is in the plans, each catalogue key exists, the ADR's status line carries « part 2 PC1b accepted » and not « part 2 PC1b proposed », W58 closed.
id = "docs"
command = '''python3 -I - <<'PY'
import json, pathlib, sys
plan = "".join(pathlib.Path(p).read_text() for p in ["docs/plans/2026-11-15-pc1b-join.md", "docs/plans/2026-11-14-pc1-project-change-by-restart.md"])
fr = json.load(open("frontend/src/i18n/fr.json"))
rows = ["J-1", "J-2", "J-3", "J-4", "J-5", "J-6", "N-16"]
keys = ["join.restart.note", "join.restart.folder", "join.folderDefault", "join.waitingRoot", "join.done", "join.failed"]
bad = [f"plan row {i}" for i in rows if f"\n| {i} |" not in plan]
bad += [f"fr.json {k}" for k in keys if k not in fr]
st = [l for l in pathlib.Path("docs/adr/0043-foreign-project.md").read_text().splitlines() if l.startswith("status:")]
if not st or "part 2 PC1b accepted" not in st[0] or "part 2 PC1b proposed" in st[0]:
    bad.append("ADR 0043 status line: part 2 PC1b not accepted")
ex = pathlib.Path("docs/exigences.md").read_text().splitlines()
bad += [f"exigences {w} not closed" for w in ["W58"] if not any(l.startswith(f"| {w} |") and "✅" in l for l in ex)]
sys.exit(f"PC1b docs: {bad}" if bad else 0)
PY'''

[[criteria]]
# J-1, J-4..J-6 and N-16 on the join path in Go: the run succeeds and every named test passes.
id = "go"
command = '''out=$(timeout -k 10 300 ./scripts/heavy.sh go test -count=1 -race -v -run 'TestJoin|TestCompleteJoin|TestFirstLaunchJoin|TestRequestsRefusedOnceJoinHeld|TestRestartOnlyAfterARequestAndOnce|TestStorageWriteBeforeFinishJoin' ./internal/app/ ./internal/bridge/ ./cmd/inkwell/ 2>&1) || { echo "$out" | tail -40; exit 1; }
for t in TestJoinRequestWritesNothing TestJoinWritesRecordBeforeTheList TestJoinCrashAtEachStep TestCompleteJoinConsumesOnce TestCompleteJoinRefuses TestJoinOutcomeFollowsTheLoadedList TestJoinFailedRecordDropped TestJoinSameProjectNoRestart TestCompleteJoinAfterTheDocumentIsStored TestFirstLaunchJoinRestarts TestRequestsRefusedOnceJoinHeld TestRestartOnlyAfterARequestAndOnce TestJoinKeepsThePreviousFolder TestJoinFolderNameConfined TestJoinFolderCollisionGetsSuffix TestJoinCrashDuringInstall TestStorageWriteBeforeFinishJoinLandsOrIsRefused; do
  echo "$out" | grep -q -- "--- PASS: $t" || { echo "missing or not passing: $t"; exit 1; }
done'''

[[criteria]]
# Every PC1b mutant entry exists with its test and an expect text starting with its rule tag.
id = "mutant-tool"
command = '''timeout -k 10 60 ./scripts/heavy.sh python3 -m unittest scripts/netsim/mutants_test.py && python3 -I - <<'PY'
import re, sys, tomllib
ms = {m["id"]: m for m in tomllib.load(open("scripts/netsim/mutants.toml", "rb"))["mutant"] if m.get("block") == "PC1b"}
need = [f"MJ{n}" for n in range(1, 17)]
bad = [i for i in need if i not in ms or ms[i].get("kind") != "go" or not ms[i].get("test") or not re.match(r"[NJ]-\d+ ", ms[i].get("expect", ""))]
sys.exit(f"PC1b mutant entries missing or without test and expect: {bad}" if bad else 0)
PY'''

