for n in ProjectChange ProjectChangeSpawn ProjectChangeFaults ProjectChangeSpawnFaults; do
  echo "$out" | grep -qF -- "✓ $n: no error (exhaustive, liveness checked)" || { echo "sound configuration missing or failing: $n"; exit 1; }
done
for n in ProjectChangeLiveAdopt ProjectChangeRestartBeforeDurable ProjectChangeRestartTwice ProjectChangeRequestBeforeNavigation ProjectChangeJoinNoRestart ProjectChangeJoinTwice ProjectChangeWriteBeforeWiringStopped ProjectChangeWriteBeforeDrain ProjectChangeNoBarrier ProjectChangeSpawnNoWait ProjectChangeJoinRecordAfterInstall ProjectChangeRecoverPrefersAside ProjectChangeCarriedOutcome ProjectChangePageNeverReloads ProjectChangeWitnessTakeOver ProjectChangeWitnessJoinAnnounced ProjectChangeWitnessCrashAfterInstall ProjectChangeWitnessFailedWrite ProjectChangeWitnessWriteRefused; do
  echo "$out" | grep -qF -- "✓ $n: violation detected" || { echo "mutant or witness not caught by its named property: $n"; exit 1; }
done'''

