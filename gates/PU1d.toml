# reference still answers close_peer.
id = "vectors"
command = '''mkdir -p .task && cd protocol && timeout -k 10 120 ../scripts/heavy.sh go test -count=1 -timeout=100s -json -run '^(TestCorpus|TestGenerateMatchesCommittedCorpus)$' ./syncack/ ./conformance/ ./cmd/vectors/ > ../.task/pu1d-vectors.json 2>&1; a=$?; cd .. && python3 -I - "$a" <<'PY'
import hashlib, json, pathlib, sys
bad = [] if sys.argv[1] == "0" else [f"go test exit {sys.argv[1]}"]
keep = ("id", "decoder", "input_hex", "context", "events", "expect", "verdict", "scope")
want = {"syncack.json": (34, "dc6ced8357d63d4b4877aecf9cb8d98c044352e6b62809eaa4d76966221f6c74"), "syncorder.json": (20, "b91c14f1f2e4d0f7c5a4c317effc8a893b75df8aa36d2c2bd077c798257936a8")}
changed = ["sync-ack-opener-eof", "sync-ack-opener-reset", "sync-ack-opener-bad-byte", "sync-ack-opener-byte-after", "sync-ack-opener-deadline", "sync-ack-opener-slow-negotiation", "sync-ack-opener-deadline-before-return", "sync-ack-opener-silent", "sync-ack-opener-reopen-refused", "sync-refusal-busy-out-of-budget", "sync-refusal-other-code", "sync-refusal-negotiation-code", "sync-refusal-eof"]
vecs = {}
for f, (n, h) in want.items():
    raw = pathlib.Path(f"protocol/vectors/{f}").read_text()
    d = json.loads(raw)
    canon = json.dumps([{k: v[k] for k in keep if k in v} for v in d["vectors"]], sort_keys=True, ensure_ascii=False, separators=(",", ":"))
    if (len(d["vectors"]), hashlib.sha256(canon.encode()).hexdigest()) != (n, h):
        bad.append(f"{f} differs from step 1's corpus")
    if "close_peer" in raw:
        bad.append(f"{f} still has close_peer")
    vecs.update({v["id"]: (f, v) for v in d["vectors"]})
for i in changed:
    if i not in vecs or "close_conn" not in json.dumps(vecs[i][1]):
        bad.append(f"vector {i} missing or not close_conn")
evs = []
for line in pathlib.Path(".task/pu1d-vectors.json").read_text().splitlines():
    try:
        e = json.loads(line)
    except ValueError:
        continue
    if isinstance(e, dict):
        evs.append(e)
passed = {(e.get("Package", ""), e["Test"]) for e in evs if e.get("Action") == "pass" and e.get("Test")}
names = {t for _, t in passed}
for pkg in ("protocol/syncack", "protocol/conformance"):
    if not any(p.endswith(pkg) and t == "TestCorpus" for p, t in passed):
        bad.append(f"{pkg} TestCorpus missing or not passing")
if "TestGenerateMatchesCommittedCorpus" not in names:
    bad.append("TestGenerateMatchesCommittedCorpus missing or not passing")
for n in sorted({e["Test"] for e in evs if e.get("Action") == "fail" and e.get("Test")})[:3]:
    said = [e["Output"].strip() for e in evs if e.get("Test") == n and e.get("Action") == "output" and "want close_conn" in e.get("Output", "")]
    print(f"{n}: {len(said)} close_conn mismatches, e.g. {said[:1]}")
sys.exit(f"PU1d vectors: {bad[:12]}" if bad else 0)
PY'''

