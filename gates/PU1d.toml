[[criteria]]
# The vectors (spec §8.7.9): syncack.json (34) and syncorder.json (20) are exactly step 1's corpus (digest of id,
# decoder, input, context, events, expect, verdict, scope); no `close_peer` is left; the 13 changed vectors expect
# `close_conn`. The reference protocol/syncack (TestCorpus), the conformance runner at CurrentStep (TestCorpus) and the
