[[criteria]]
# The rules in Go (internal/transport/p2p, simnet inside testing/synctest where time matters, -race), each arm named;
# failure texts « PU1c place kept » (a place, a goroutine or a byte kept past the rule), « PU1c blind wait » (an end not
# seen within its bound: at once with nothing unread, at most 250 ms for a reset, the turn behind bytes), « PU1c late
# wake » (a turn, a PeerUp or a probe attempt later than 250 ms), « PU1c budget taken » (a waiting stream
# charged the receive budget, or a reservation not returned: BufferedBytes back to its baseline), « PU1c frames lost »
# (a whole frame before a truncated tail, a probed byte, or a frame of a stream that started delivering, lost or out of
# place), « PU1c order broken » (a lane's frames out of order), « PU1c blocked forever » (a reader blocked on the budget
# not freed within 1 s of its own connection's loss, or freed by another connection's), « PU1c head starved » (a head
# delivering less than 4 MiB in 10 s of simulated time while the other streams of both lanes hold their windows),
# « PU1c over capacity » (a third place on a lane), « PU1c memory unaccounted » (a QUIC connection's initial window not
# held by its resource scope). Every time bound is checked on controlled time (testing/synctest, simnet): the model's
# temporal properties prove only « eventually ». The bounds are the spec's, with no slack: a reset seen, a turn or a
# PeerUp seen, the gap between two probe attempts, each ≤ 250 ms (InboundProbeEvery) measured on synctest/simnet time,
# never on the wall clock (the next attempt may start exactly T after the previous one: ≤, not <). The node exports, for tests, InboundPlaces(lane, peer),
# BufferedBytes(lane), ProbedBytes(peer), BusyRefusals(), BusyRetries(), and a seam replacing the QUIC initial
# connection window (for the witness arm only).
# TestInboundLifecycle:
#   matrix/<lane>/<state>/<end>, lane ∈ {sync, bulk}: accepting × {reset, fin, conn_lost, node_close} (held in its ACK
#   write by a seam: the place freed within 1 s of the write's end, no event); waiting_empty × {reset, fin, conn_lost,
#   node_close} (freed within 1 s); waiting_bytes (64 KiB unread) × {reset (freed within 250 ms), fin (kept to its turn,
#   then every frame delivered), conn_lost, node_close}; kept (one whole frame and 3 bytes of the next, then FIN, all
#   probed) × {at_turn (the whole frame delivered, freed, no ClosePeer), conn_lost (nothing delivered after PeerDown,
#   freed by its turn or its up-wait), node_close, reorder_wait (delivered after 60 s behind a head held open)};
#   delivering × {reset, fin, conn_lost, node_close} (freed within 1 s, frames delivered before stay delivered);
#   blocked (consumer stalled, budget full) × {reset (place held until room, then freed within 1 s, BufferedBytes back
#   to its baseline), fin (the rest delivered after room), conn_lost (freed within 1 s, all returned), node_close}.
#   probe_bound (each lane: 10 MiB pushed into a waiting stream for 60 s: ProbedBytes ≤ 256, BufferedBytes unchanged,
#   no write error at the opener before 60 s), probe_period (a reset at seven phases of the probe period, seen within
#   250 ms each), probe_bytes_before_error (a stream whose Read returns 1 byte and an error: the byte kept and decoded
#   first), wake_within_bound (a turn and a PeerUp seen within 250 ms), interrupt_during_transition (the head leaves
#   and PeerUp arrives exactly at k × 250 ms, k = 1..8: the successor's frames intact, no deadline error while
#   delivering), immediate_when_first_and_up (a stream that arrives first with its peer already announced delivers its
#   first frame with no added delay: 0 ms of controlled time after its ACK), valid_prefix_then_truncated (two whole frames then a truncated third and FIN while waiting: two
#   delivered at its turn, freed, no ClosePeer), credit_exhausted_before_head (QUIC: an honest peer's
#   opener fills one waiting sync stream, one waiting and one blocked bulk stream to 128 KiB each after their ACK and
#   **before** the ACKed head writes; the head then delivers 4 MiB), credit_witness_default_window (the same with
#   quic-go's 512 KiB / 768 KiB through the seam: the head delivers less than 1 MiB in 10 s, so the arm
#   discriminates), quic_window_reserved (the resource manager's connection scope of every QUIC connection holds
#   QUICInitialConnectionWindow from its start and returns it at close; with less than that left in the system scope
#   the connection is refused), refused_stream_bytes_released (a raw opener writes 128 KiB into a stream refused for
#   capacity: that credit is back once its reset is processed, and a head on the connection still delivers), one_goroutine_per_place (each placed waiting stream
#   adds at most one goroutine), blocked_exact_connection (two connections to one peer: the loss of the other leaves
#   the reader blocked, the loss of its own frees it), byzantine_floods (each lane: 50 open-reset loops and data floods
#   into waiting streams: InboundPlaces ≤ 2 per lane, goroutines back to at most the count before + 8, BufferedBytes
#   back to its baseline), bulk_ack (the bulk opener reads 0x01 before its first frame), bulk_order_across_late_handler
#   (P-6 on bulk: a held handler of the old stream keeps its rank across a move), bulk_capacity (a third bulk stream
#   reset with 0x1002; the Node opener retries and its Send succeeds; no ClosePeer, no event), bulk_removal_while_waiting,
#   old_bulk_refused (/inkwell/bulk/1.0.0 is neither served nor opened).
# TestInboundTransport (the transport facts the design stands on, each on QUIC and on yamux through a relay circuit):
#   deadline_interrupts_pending_read, reset_wins_over_buffered_data, data_before_eof.
id = "go"
command = '''mkdir -p .task && timeout -k 10 450 ./scripts/heavy.sh go test -count=1 -race -timeout=420s -json -run '^(TestInboundLifecycle|TestInboundTransport)$' ./internal/transport/p2p/ > .task/pu1c-go.json 2>&1; a=$?; python3 -I - "$a" <<'PY'
import json, pathlib, sys
ends = {"accepting": ["reset", "fin", "conn_lost", "node_close"], "waiting_empty": ["reset", "fin", "conn_lost", "node_close"], "waiting_bytes": ["reset", "fin", "conn_lost", "node_close"], "kept": ["at_turn", "conn_lost", "node_close", "reorder_wait"], "delivering": ["reset", "fin", "conn_lost", "node_close"], "blocked": ["reset", "fin", "conn_lost", "node_close"]}
arms = {"TestInboundLifecycle": [f"matrix/{l}/{s}/{e}" for l in ("sync", "bulk") for s, es in ends.items() for e in es] + ["probe_bound", "probe_period", "probe_bytes_before_error", "wake_within_bound", "interrupt_during_transition", "valid_prefix_then_truncated", "immediate_when_first_and_up", "credit_exhausted_before_head", "credit_witness_default_window", "quic_window_reserved", "refused_stream_bytes_released", "one_goroutine_per_place", "blocked_exact_connection", "byzantine_floods", "bulk_ack", "bulk_order_across_late_handler", "bulk_capacity", "bulk_removal_while_waiting", "old_bulk_refused"], "TestInboundTransport": [f"{a}/{m}" for a in ("deadline_interrupts_pending_read", "reset_wins_over_buffered_data", "data_before_eof") for m in ("quic", "yamux")]}
evs = []
for line in pathlib.Path(".task/pu1c-go.json").read_text().splitlines():
    try:
        ev = json.loads(line)
    except ValueError:
        continue
    if isinstance(ev, dict):
        evs.append(ev)
bad = [] if sys.argv[1] == "0" else [f"go test exit {sys.argv[1]}"]
passed = {e["Test"] for e in evs if e.get("Action") == "pass" and e.get("Test")}
want = list(arms) + [f"{t}/{a}" for t, l in arms.items() for a in l]
bad += [f"missing or not passing: {n}" for n in want if n not in passed]
for n in sorted({e["Test"] for e in evs if e.get("Action") == "fail" and e.get("Test")})[:3]:
    said = [e["Output"].strip() for e in evs if e.get("Test") == n and e.get("Action") == "output" and "_test.go" in e.get("Output", "")]
