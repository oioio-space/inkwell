# Architecture: one reader per stream, shared by both lanes; no watcher, no chain; the budget wait cancellable; the
# QUIC window from the protocol constant, through the fork's quicreuse option; the bounds from protocol, not literals.
id = "arch"
command = '''timeout -k 10 30 python3 -I - <<'PY'
import pathlib, re, subprocess, sys
d = pathlib.Path("internal/transport/p2p")
srcs = {p.name: p.read_text() for p in d.glob("*.go") if not p.name.endswith("_test.go")}
src = "\n".join(srcs.values())
bad = []
inb = srcs.get("inbound.go")
if inb is None:
    bad.append("no internal/transport/p2p/inbound.go (the lifecycle shared by both lanes)")
else:
    if re.search(r"\bgo\s+func\b|\bgo\s+\w+\(|\.Go\(", inb):
        bad.append("inbound.go starts a goroutine (one reader per stream: the handler's)")
    if "AcquireCtx(" not in inb or re.search(r"\.Acquire\(", inb):
        bad.append("inbound.go does not wait for the budget with AcquireCtx only")
    if re.search(r"250\s*\*\s*time\.Millisecond|\b256\b", inb):
        bad.append("inbound.go has a private probe bound")
    funcs = set(re.findall(r"^func (?:\([^)]*\) )?(\w+)\(", inb, re.M))
    if not any(re.search(rf"\b{f}\(", srcs.get("stream.go", "")) and re.search(rf"\b{f}\(", srcs.get("bulk.go", "")) for f in funcs):
        bad.append("stream.go and bulk.go do not both call the lifecycle of inbound.go")
def body(name, fn):
    s = srcs.get(name, ""); i = s.find(fn)
    return s[i:s.find("\nfunc ", i + 1)] if i >= 0 else ""
for name, fn in (("stream.go", "func (n *Node) handleStream("), ("bulk.go", "func (b *Bulk) handle(")):
    if re.search(r"\bgo\s+func\b|\.Go\(", body(name, fn)):
        bad.append(f"{name}: the inbound handler starts a helper goroutine (one reader per stream)")
if re.search(r"\.Peek\(", src):
    bad.append("a Peek watcher is still there")
if "bulkTail" in src:
    bad.append("the bulk chain (bulkTail) is still there")
if not re.search(r'ProtocolBulk\s*=\s*"/inkwell/bulk/2\.0\.0"', src):
    bad.append("ProtocolBulk is not /inkwell/bulk/2.0.0")
for c in ("InboundProbeEvery", "InboundProbeMax", "QUICInitialStreamWindow", "QUICInitialConnectionWindow"):
    if not re.search(rf"\.{c}\b", src):
        bad.append(f"internal/transport/p2p does not use protocol's {c}")
if "QUICReuse(" not in src:
    bad.append("the node does not configure its QUIC transport (libp2p.QUICReuse with the fork's option)")
if "func (b *Budget) AcquireCtx(" not in pathlib.Path("internal/transport/frame/budget.go").read_text():
    bad.append("frame.Budget has no AcquireCtx")
lib = subprocess.run(["go", "list", "-m", "-f", "{{.Dir}}", "github.com/libp2p/go-libp2p"], capture_output=True, text=True).stdout.strip()
q = "\n".join(p.read_text() for p in pathlib.Path(lib, "p2p/transport/quicreuse").glob("*.go") if not p.name.endswith("_test.go")) if lib else ""
if "InitialConnectionReceiveWindow" not in q or "InitialStreamReceiveWindow" not in q:
    bad.append("the go-libp2p in use has no quicreuse option setting the initial stream and connection receive windows")
tq = "\n".join(p.read_text() for p in pathlib.Path(lib, "p2p/transport/quic").glob("*.go") if not p.name.endswith("_test.go")) if lib else ""
if tq.count("ReserveMemory(") < 2:
