[[criteria]]
# The model (plan §6, README « InboundLifecycle »): exactly these sixteen runs, no ✗. Sound: Honest (both lanes at
# once, late handlers, a reopen per lane, the sessions end; all safety, AllDelivered, EmptyLeaves, NoBlindWait),
# Byzantine (a head and a waiting stream of one lane — it over-approximates both Byzantine lanes on one credit, plan §6
# « Composition of the two lanes »; every end kind in every state, a stalled consumer, Stall, a connection loss; safety, EmptyLeaves, NoBlindWait, BlockedFreed),
# ByzantineSafety (three streams, a third place refused, a probe keeping a whole and a truncated frame; invariants), Credit (the sync head honest, a second sync stream
# and both bulk streams filled to their window before it writes, the bulk head blocked: HeadProgresses). Mutants
# caught by the named property: QC1 PlaceSyncLate (Order), QC2 FailedWaits (EmptyLeaves), QC3 ProbeOnce
# (NoBlindWait), QC4 WaitCharges (WaitNoBudget), QC5 KeepWholeOnly (FinFramesDelivered), QC6 NoCancel (BlockedFreed),
# QC7 BulkTail (Order), QC8 SmallWindow (HeadProgresses); witnesses: a kept prefix, a blocked reader, a truncated tail
# after whole frames, the credit exhausted before the head writes. Structure: the rule operators are the sound ones
# and both lanes share one ConnWindow; Honest and Credit instantiate both lanes at once. SyncOrder.tla and PeerUpAck.tla are untouched (criterion frozen-untouched).
id = "tla"
# Cap = compute + wait, stated: the sixteen runs took 292 s with 4 workers (2026-11-17, idle machine), × 1.5 = 440 s of
# compute; heavy.sh --exclusive waits at most INKWELL_PERF_LOAD_WAIT = 120 s for an idle machine (no other heavy job
# runs during a gate, so its slot wait is the idle wait): 440 + 120 = 560 s.
command = '''out=$(INKWELL_TLA_ONLY='^InboundLifecycle' INKWELL_TLA_WORKERS=4 INKWELL_PERF_LOAD_WAIT=120 timeout -k 10 560 ./scripts/heavy.sh --exclusive ./scripts/tla-check.sh 2>&1) || { echo "$out" | tail -40; exit 1; }
! echo "$out" | grep -q '✗' || { echo "$out" | grep '✗'; exit 1; }
for want in "✓ InboundLifecycleHonest: no error (exhaustive, liveness checked)" "✓ InboundLifecycleByzantine: no error (exhaustive, liveness checked)" "✓ InboundLifecycleByzantineSafety: no error (exhaustive, invariants)" "✓ InboundLifecycleCredit: no error (exhaustive, liveness checked)" "✓ InboundLifecyclePlaceSyncLate: violation detected (Order)" "✓ InboundLifecycleFailedWaits: violation detected (EmptyLeaves)" "✓ InboundLifecycleProbeOnce: violation detected (NoBlindWait)" "✓ InboundLifecycleWaitCharges: violation detected (WaitNoBudget)" "✓ InboundLifecycleKeepWholeOnly: violation detected (FinFramesDelivered)" "✓ InboundLifecycleNoCancel: violation detected (BlockedFreed)" "✓ InboundLifecycleBulkTail: violation detected (Order)" "✓ InboundLifecycleSmallWindow: violation detected (HeadProgresses)" "✓ InboundLifecycleWitnessKept: violation detected (NoKept)" "✓ InboundLifecycleWitnessBlocked: violation detected (NoBlocked)" "✓ InboundLifecycleWitnessTruncatedTail: violation detected (NoTruncatedTail)" "✓ InboundLifecycleWitnessExhausted: violation detected (NoCreditExhaustedFirst)"; do echo "$out" | grep -qxF -- "$want" || { echo "missing: $want"; exit 1; }; done
[ "$(echo "$out" | grep -c '✓')" -eq 16 ] || { echo "want 16 ✓, got $(echo "$out" | grep -c '✓')"; exit 1; }
python3 -I - <<'PY'
import pathlib, re, sys
t = pathlib.Path("docs/protocol/tla/InboundLifecycle.tla").read_text()
bad = [w for w in [r"^PlaceAtArrival\(l\) == TRUE$", r"^EarlyOK\(s\) == TRUE$", r"^ProbeOK\(s\) == TRUE$", r"^WaitCharges == FALSE$", r"^KeepPrefix\(s\) == TRUE$", r"^CancelOnLoss == TRUE$", r"^ConnWindow == Cap \* 2 \* Win$", r'^FirstState\(l\) == "accepting"$', r"^Lanes == \{\"sync\", \"bulk\"\}$", r"^ConnRoom == SumQ\(S\) < ConnWindow$", r"^ArrivingHoldsNothing ==", r"^Release\(s\) ==$", r"^Places ==", r"^Order ==", r"^WaitNoBudget ==", r"^ReservationsReturned ==", r"^FinFramesDelivered ==", r"^EmptyLeaves ==", r"^NoBlindWait ==", r"^BlockedFreed ==", r"^HeadProgresses =="] if not re.search(w, t, re.M)]
for cfg in ("InboundLifecycleHonest", "InboundLifecycleCredit"):
    c = pathlib.Path(f"docs/protocol/tla/{cfg}.cfg").read_text()
    if not re.search(r"^  Sync = \{[^}]+\}$", c, re.M) or not re.search(r"^  Bulk = \{[^}]+\}$", c, re.M):
        bad.append(f"{cfg}: both lanes must have streams")
sys.exit(f"InboundLifecycle structure: {bad}" if bad else 0)
