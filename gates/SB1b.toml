# Frozen acceptance for block SB1b (requirement W49, rigour: complete — the sandbox that confines documents from peers),
# which SUPERSEDES block SB1: gates/SB1.toml stays frozen as history, no code was written against it. Codex's adversarial
# review of ADR 0042 (2026-11-12, verdict "amend ADR first") found that the memory scope migrated a running process,
# ordered the two memory limits wrongly, took a job result for confinement, raced its counters, overstated the core-dump
# and SIGXFSZ guarantees, and that SB1 could not catch a workload left outside its cgroup; its re-review ("fix first")
# added the mixed OOM history, skipped subtests, the aggregate bound, holder lifetime and app crash, descriptor ownership
# and attributed journal evidence. Decision: ADR 0042, sections "Amendment 2026-11-12" A1-A7 and A8. Spec:
# docs/plans/2026-11-11-sandbox-crash-reports.md, section "Gate SB1b" and its re-review additions (rows S, R, M, F, X, A,
# H, D, J). User decisions kept: D1 SECCOMP_RET_KILL_PROCESS, D2 the cgroup bound in this block, D3 wording confirmed at
# the UX review. Every criterion that names tests fails on any `--- SKIP` or `--- FAIL` line at any depth and requires
# each named test and mandatory subtest to print `--- PASS` (a `go test -run` that matches nothing passes; nothing passes
# silently on a machine that cannot exercise the sandbox or has no delegated user manager); the Vitest criterion requires
# each named test reported as passed.
raw_results = ["docs/plans/2026-11-11-sandbox-crash-reports.md", "docs/objectif-en-cours.md", "gates/SB1b/*"]

[[criteria]]
# The specification is complete where the code needs it: ADR 0042 carries the amendment and its re-review (A8) and names
# this gate; the plan carries every row of the tables S, R, M, F, X, A, H, D and J; the sandbox policy document explains the
# core-dump behaviour (RLIMIT_CORE sentinel, core_pattern modes) and the memory cgroup. Red at freeze:
# internal/sidecar/seccomp-policy.md says nothing about RLIMIT_CORE, core_pattern or the cgroup (blueprint step 6).
id = "spec"
command = '''a=docs/adr/0042-sandbox-memory-scope-and-no-core-helper.md; p=docs/plans/2026-11-11-sandbox-crash-reports.md; grep -q '^## Amendment 2026-11-12 (block SB1b)' "$a" && grep -q '^### A8. Re-review of the amendment' "$a" && grep -q 'gates/SB1b.toml' "$a" || { echo 'ADR 0042 lacks its SB1b amendment or A8'; exit 1; }; grep -q '^## Gate SB1b' "$p" || { echo 'plan lacks the Gate SB1b section'; exit 1; }; for r in S1 S2 S3 S4 S5 S6 S7 S8 S9 R1 R2 R3 R4 R5 R6 R7 R8 M1 M2 M3 M4 M5 M6 M7 M8 M9 F1 F2 F3 F4 F5 F6 F7 F8 F9 F10 F11 X1 X2 X3 X4 X5 A1 A2 H1 H2 H3 H4 H5 D1 D2 D3 J1 J2 J3 J4 J5 J6; do grep -q "^| $r |" "$p" || { echo "plan lacks row $r"; exit 1; }; done; f=internal/sidecar/seccomp-policy.md; for w in RLIMIT_CORE core_pattern memory.max CLONE_INTO_CGROUP; do grep -q -- "$w" "$f" || { echo "$f does not explain $w"; exit 1; }; done'''

[[criteria]]
# The model (ADR 0042 A1, A3, A4, A8): docs/protocol/tla/SandboxScope.tla, sound configurations SandboxScope (no fault)
# and SandboxScopeFaults (a fault at any setup step, holder death at any point, app kill, global or ancestor OOM, unreadable
# counters) checked exhaustively. Invariants: untrusted code runs only in a verified run cgroup or in a run marked rlimit;
# counters are read before cleanup; a failed read is never zero; only a local OOM within the timeline window, with no other
# kill and no ancestor OOM, is a memory limit; after the app dies no run process survives the bound. Each mutant detected
# and each witness violated (anti-vacuity), every other model of the directory too, read from tla-check.sh's own verdict
# lines. The model file and README section are checked first; the run is bounded at 5400 s (on 2026-11-12 the whole suite
# was still at LinkProbe after 1800 s on a loaded machine). Red at freeze: docs/protocol/tla/SandboxScope.tla is missing.
id = "tla"
command = '''test -s docs/protocol/tla/SandboxScope.tla || { echo 'missing docs/protocol/tla/SandboxScope.tla'; exit 1; }; grep -q '^## SandboxScope' docs/protocol/tla/README.md || { echo 'no SandboxScope section in the TLA+ README'; exit 1; }; out=$(timeout 5400 mise run tla 2>&1) || { echo "$out" | tail -40; exit 1; }; for n in SandboxScope SandboxScopeFaults; do echo "$out" | grep -q "✓ $n: no error" || { echo "sound model not checked: $n"; exit 1; }; done; for m in NotBornInside ExecBeforeCheck CleanupBeforeCounters UnreadAsZero VictimAsLimit MixedHistoryAsLimit ContinueAfterPartialSetup SessionUnbounded JobDoneIsConfined RaiseAddressLimit HolderDeathEscapes OrphanAfterAppKill WitnessLocalLimit WitnessAddressLimit WitnessFallback WitnessVictim WitnessMixedHistory WitnessHolderDeath; do echo "$out" | grep -q "✓ SandboxScope$m: violation detected" || { echo "mutant or witness not detected: $m"; exit 1; }; done'''

[[criteria]]
# W49 / study 5.0 / T1, ADR 0042 A5. The target's RLIMIT_CORE is exactly {1,1} (the kernel's pipe sentinel; Max = 1 so the
# target cannot raise it), read by the target itself at startup; core_pattern is classified (pipe and file guaranteed,
# socket and socket-request not). Red at freeze: TestTargetCoreLimitIsSentinel and TestCorePatternGuaranteeScope do not
# exist, and the launcher sets {0,0}.
id = "core-limit"
command = '''out=$(./scripts/heavy.sh timeout 600 go test -count=1 -v -run '^(TestTargetCoreLimitIsSentinel|TestCorePatternGuaranteeScope|TestRunLimitsHoldFromStartup)$' ./internal/sidecar 2>&1) || { echo "$out" | tail -40; exit 1; }; if echo "$out" | grep -E -q -- '^[[:space:]]*--- (SKIP|FAIL): '; then echo "$out" | grep -E -- '--- (SKIP|FAIL): ' | head -20; exit 1; fi; for t in TestTargetCoreLimitIsSentinel TestCorePatternGuaranteeScope TestRunLimitsHoldFromStartup TestCorePatternGuaranteeScope/pipe TestCorePatternGuaranteeScope/file TestCorePatternGuaranteeScope/socket TestCorePatternGuaranteeScope/socket-request; do echo "$out" | grep -q -- "--- PASS: $t (" || { echo "missing, skipped or failing: $t"; exit 1; }; done'''

[[criteria]]
# W49 / 5.0, 5.4 R3 R4 R7 / T2, D1, A5. For each attack (subtests arch, x32: SIGSYS; xfsz: SIGXFSZ reset to SIG_DFL; segv)
# the INTENDED signal still kills and the pidfd's PIDFD_INFO_COREDUMP mask has no PIDFD_COREDUMPED bit. On a socket-mode
