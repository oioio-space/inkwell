[[criteria]]
# W49 / 5.1, ADR 0042 A6, rows X1-X5. SIGXFSZ is ignored in the target (only it, plus SIGPIPE which Rust sets). For any
# target the byte cap holds and every end with an output at its cap is OutputLimit: short write then EFBIG (X1), abort on
# EFBIG (X2), disposition reset then SIGXFSZ with no core helper (X3), an EFBIG loop ended by the timeout (X4). Only the
# pinned typst on TYP-19 (subtests pdf and svg) must exit 1 with no signal and "os error 27", still ErrOutputTooLarge (X5).
# The existing byte-cap tests are kept. Red at freeze: the new tests do not exist; typst dies of signal 25 today.
id = "file-size"
command = '''out=$(./scripts/heavy.sh timeout 600 go test -count=1 -v -run '^(TestFileSizeCapShortWriteThenEFBIG|TestFileSizeCapAbortOnEFBIGIsOutputLimit|TestFileSizeCapDispositionResetIsOutputLimit|TestFileSizeCapEFBIGLoopEndsAtTimeout|TestRunFileSizeLimit|TestRunDirectoryBound)$' ./internal/sidecar 2>&1) || { echo "$out" | tail -40; exit 1; }; if echo "$out" | grep -E -q -- '^[[:space:]]*--- (SKIP|FAIL): '; then echo "$out" | grep -E -- '--- (SKIP|FAIL): ' | head -20; exit 1; fi; for t in TestFileSizeCapShortWriteThenEFBIG TestFileSizeCapAbortOnEFBIGIsOutputLimit TestFileSizeCapDispositionResetIsOutputLimit TestFileSizeCapEFBIGLoopEndsAtTimeout TestRunFileSizeLimit TestRunDirectoryBound; do echo "$out" | grep -q -- "--- PASS: $t (" || { echo "missing, skipped or failing: $t"; exit 1; }; done; out=$(./scripts/heavy.sh timeout 600 go test -count=1 -v -run '^(TestTargetIgnoresOnlyFileSizeSignal|TestPinnedTypstOutputCapExitsOne)$' ./internal/typst 2>&1) || { echo "$out" | tail -40; exit 1; }; if echo "$out" | grep -E -q -- '^[[:space:]]*--- (SKIP|FAIL): '; then echo "$out" | grep -E -- '--- (SKIP|FAIL): ' | head -20; exit 1; fi; for t in TestTargetIgnoresOnlyFileSizeSignal TestPinnedTypstOutputCapExitsOne TestPinnedTypstOutputCapExitsOne/pdf TestPinnedTypstOutputCapExitsOne/svg; do echo "$out" | grep -q -- "--- PASS: $t (" || { echo "missing, skipped or failing: $t"; exit 1; }; done'''

[[criteria]]
# W49 / 5.2 / T6, ADR 0042 A7. SIGSYS (31) maps to typst.ErrBlocked with a fixed text (no stderr, path or document byte) and
# the preview to the kind "blocked"; a canary placed in stderr, the project path and the document reaches neither the preview
# frame (exactly {"kind":"blocked"}) nor the captured app log. SIGSEGV with "memory allocation of N bytes failed" stays
# ErrMemoryLimit; SIGSEGV alone stays a generic stop. Red at freeze: the tests, ErrBlocked and FailBlocked do not exist.
id = "blocked"
command = '''out=$(./scripts/heavy.sh timeout 600 go test -count=1 -v -run '^(TestFailureBlocked|TestBlockedErrorCarriesNoDetail)$' ./internal/typst 2>&1) || { echo "$out" | tail -40; exit 1; }; if echo "$out" | grep -E -q -- '^[[:space:]]*--- (SKIP|FAIL): '; then echo "$out" | grep -E -- '--- (SKIP|FAIL): ' | head -20; exit 1; fi; for t in TestFailureBlocked TestBlockedErrorCarriesNoDetail; do echo "$out" | grep -q -- "--- PASS: $t (" || { echo "missing, skipped or failing: $t"; exit 1; }; done; out=$(./scripts/heavy.sh timeout 600 go test -count=1 -v -run '^(TestFailureOfBlocked|TestBlockedFailureLeaksNothing)$' ./internal/app 2>&1) || { echo "$out" | tail -40; exit 1; }; if echo "$out" | grep -E -q -- '^[[:space:]]*--- (SKIP|FAIL): '; then echo "$out" | grep -E -- '--- (SKIP|FAIL): ' | head -20; exit 1; fi; for t in TestFailureOfBlocked TestBlockedFailureLeaksNothing; do echo "$out" | grep -q -- "--- PASS: $t (" || { echo "missing, skipped or failing: $t"; exit 1; }; done'''

[[criteria]]
# W49 D2, ADR 0042 A1, A3, A8, rows S, R, F, A. On the real user manager: a delegated session scope whose holder is
# verified in holder/ and whose subtree enables memory (S); per-run limits written and read back before Start (R2-R3); the
# target AND a descendant it forks, while they wait before allocating, are both in run-<n>/cgroup.procs and not in the app's
# cgroup ("scope configured but workload outside it"); the bootstrap refuses an unexpected cgroup (R6); app plus sandbox
# never exceed a limit on their shared slice, tested as an aggregate (A1), and the app's leaf limit is copied and bounds the
# sandbox alone (A2); the run cgroup is gone after Run with no process left (R8); every fallback row F1-F11 (one subtest
# each) leaves the run confined by rlimits, seccomp and Landlock and reports Containment "rlimit", never an error. A machine
# without a delegated user cgroup skips, hence fails: deliberate. Red at freeze: none of these tests exist.
id = "memory-scope"
command = '''out=$(./scripts/heavy.sh timeout 900 go test -count=1 -v -run '^(TestCgroupSessionScopeDelegated|TestCgroupRunLimitsVerifiedBeforeStart|TestCgroupWorkloadAndDescendantsInside|TestBootstrapRefusesUnexpectedCgroup|TestCgroupSessionSharesSliceBound|TestCgroupSessionCopiesLeafBound|TestCgroupRemovedAfterRun|TestCgroupFallbackAtEveryStep|TestFallbackReportsRlimitOnly)$' ./internal/sidecar 2>&1) || { echo "$out" | tail -40; exit 1; }; if echo "$out" | grep -E -q -- '^[[:space:]]*--- (SKIP|FAIL): '; then echo "$out" | grep -E -- '--- (SKIP|FAIL): ' | head -20; exit 1; fi; for t in TestCgroupSessionScopeDelegated TestCgroupRunLimitsVerifiedBeforeStart TestCgroupWorkloadAndDescendantsInside TestBootstrapRefusesUnexpectedCgroup TestCgroupSessionSharesSliceBound TestCgroupSessionCopiesLeafBound TestCgroupRemovedAfterRun TestCgroupFallbackAtEveryStep TestFallbackReportsRlimitOnly TestCgroupFallbackAtEveryStep/F1 TestCgroupFallbackAtEveryStep/F2 TestCgroupFallbackAtEveryStep/F3 TestCgroupFallbackAtEveryStep/F4 TestCgroupFallbackAtEveryStep/F5 TestCgroupFallbackAtEveryStep/F6 TestCgroupFallbackAtEveryStep/F7 TestCgroupFallbackAtEveryStep/F8 TestCgroupFallbackAtEveryStep/F9 TestCgroupFallbackAtEveryStep/F10 TestCgroupFallbackAtEveryStep/F11; do echo "$out" | grep -q -- "--- PASS: $t (" || { echo "missing, skipped or failing: $t"; exit 1; }; done'''

[[criteria]]
# ADR 0042 A8, rows H and D. Holder lifetime: a holder dead before a run, or killed between verification and Start,
# invalidates the session and the run is retried once in the fallback, never placed outside a verified cgroup (subtests
# before-run and after-verify); 8 concurrent runs while the holder dies are each in a live verified cgroup or in the fallback;
# after the app is SIGKILLed during a run whose target forked a descendant, within 5 s no process remains in any run-* and the
# scope unit is gone. Descriptors: the run cgroup fd is closed after Start on every path; a target and its descendant
# inherit neither end of the holder pipe nor any cgroup directory, only 0, 1 and 2. Red at freeze: none of these tests
# exist.
id = "session-lifetime"
command = '''out=$(./scripts/heavy.sh timeout 900 go test -count=1 -v -run '^(TestHolderDeathBetweenVerifyAndStart|TestConcurrentRunsDuringHolderDeath|TestAppSIGKILLLeavesNoWorkload|TestCgroupDescriptorClosedOnEveryPath|TestSandboxInheritsNoSessionDescriptor)$' ./internal/sidecar 2>&1) || { echo "$out" | tail -40; exit 1; }; if echo "$out" | grep -E -q -- '^[[:space:]]*--- (SKIP|FAIL): '; then echo "$out" | grep -E -- '--- (SKIP|FAIL): ' | head -20; exit 1; fi; for t in TestHolderDeathBetweenVerifyAndStart TestConcurrentRunsDuringHolderDeath TestAppSIGKILLLeavesNoWorkload TestCgroupDescriptorClosedOnEveryPath TestSandboxInheritsNoSessionDescriptor TestHolderDeathBetweenVerifyAndStart/before-run TestHolderDeathBetweenVerifyAndStart/after-verify; do echo "$out" | grep -q -- "--- PASS: $t (" || { echo "missing, skipped or failing: $t"; exit 1; }; done'''

[[criteria]]
# W49 D2, ADR 0042 A2, A4, A8, rows M1-M9. Both budgets hold with a cgroup: the target's RLIMIT_AS is exactly MemoryLimit
# (never raised) and memory.max is ResidentLimit. Each outcome is exercised: ResidentLimit below the address budget ends in
# SIGKILL attributed local-limit (M1); above it the allocation fails first (M2); neither starts a core helper. The cause comes
# from the timeline read after Wait and before cgroup.kill/rmdir (order recorded): a kill more than W = 1 s after a non-fatal
# local oom (M6), an OOM kill elsewhere in the window (M7) or an ancestor OOM (M8) is "victim"; an overflow or failed read is
# "unknown", never zero (M9); a global victim is not ErrMemoryLimit (M3). Real typst: a document growing resident memory
# under a lower ResidentLimit gives ErrMemoryLimit. Red at freeze: none of these tests exist.
id = "memory-budgets"
command = '''out=$(./scripts/heavy.sh timeout 900 go test -count=1 -v -run '^(TestBothMemoryBudgetsHold|TestResidentBudgetKillsWithSIGKILL|TestAddressBudgetFailsAllocationFirst|TestMemoryCauseFromEvents|TestCgroupCountersReadBeforeCleanup)$' ./internal/sidecar 2>&1) || { echo "$out" | tail -40; exit 1; }; if echo "$out" | grep -E -q -- '^[[:space:]]*--- (SKIP|FAIL): '; then echo "$out" | grep -E -- '--- (SKIP|FAIL): ' | head -20; exit 1; fi; for t in TestBothMemoryBudgetsHold TestResidentBudgetKillsWithSIGKILL TestAddressBudgetFailsAllocationFirst TestMemoryCauseFromEvents TestCgroupCountersReadBeforeCleanup TestMemoryCauseFromEvents/M1 TestMemoryCauseFromEvents/M2 TestMemoryCauseFromEvents/M3 TestMemoryCauseFromEvents/M4 TestMemoryCauseFromEvents/M6 TestMemoryCauseFromEvents/M7 TestMemoryCauseFromEvents/M8 TestMemoryCauseFromEvents/M9; do echo "$out" | grep -q -- "--- PASS: $t (" || { echo "missing, skipped or failing: $t"; exit 1; }; done; out=$(./scripts/heavy.sh timeout 900 go test -count=1 -v -run '^(TestHostileCgroupMemoryIsMemoryLimit|TestHostileMemoryDeathStartsNoCoreHelper|TestFailureMemoryCause)$' ./internal/typst 2>&1) || { echo "$out" | tail -40; exit 1; }; if echo "$out" | grep -E -q -- '^[[:space:]]*--- (SKIP|FAIL): '; then echo "$out" | grep -E -- '--- (SKIP|FAIL): ' | head -20; exit 1; fi; for t in TestHostileCgroupMemoryIsMemoryLimit TestHostileMemoryDeathStartsNoCoreHelper TestFailureMemoryCause TestHostileMemoryDeathStartsNoCoreHelper/local-limit TestHostileMemoryDeathStartsNoCoreHelper/address-limit; do echo "$out" | grep -q -- "--- PASS: $t (" || { echo "missing, skipped or failing: $t"; exit 1; }; done'''

[[criteria]]
# G4, the user-visible criterion (study 8.2, ADR 0042 A5 and A8, rows J1-J6): scripts/sandbox_no_coredump.py. Its self-test
