    bad.append("spec §16.1 still promises 128 inbound and 128 outbound")
readme = " ".join(pathlib.Path("docs/protocol/tla/README.md").read_text().split())
for w in ["## RelayFanout (block RF1", "`InJustified` (S6, RF-1, RF-2)", "`OutNeverRefused` (S7, RF-2, RF-6)", "`SharesKept` (S9, RF-6)", "`RF1RefundUnheld` (MF12", "`RF1WindowRefill` (MF13", "`MembersEventuallyUp` (L1, RF-2, RF-4)", "`RF1PerIPCount` (MF1", "`RF1OutboundCharged` (MF2", "`RF1NoDeadline` (MF3"]:
    if w not in readme:
        bad.append(f"tla README lacks {w!r}")
if "# Bloc RF1" not in pathlib.Path("docs/protocol/CHANGES.md").read_text():
