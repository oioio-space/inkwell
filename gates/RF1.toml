# Written 2026-11-24 at step 1, before any RF1 code; revision 2 after the round-1 cross-family review of the spec and
# gate (gates/RF1/SPEC-REVIEW.md, DeepSeek V4 Pro, « accepter avec corrections »: the token bucket modelled, the rate and
# per-origin numbers computed, regression widened); frozen 2026-11-24 after round 2 (gates/RF1/GATE-REVIEW.md, « accepter »). Block RF1 (complete: trust and admission,
# peer resources). Rules RF-1 (a circuit is charged to its relay's authenticated PeerID, never to the relay's IP; an
# outbound connection to no origin), RF-2 (a member's or a configured relay's connection leaves every pending count at
# its handshake), RF-3 (pending: 16 per relay origin, 8 per IP origin, 48 in all), RF-4 (15 s at most), RF-5 (a bucket of
# 16 per origin, 1 per 5 s; a member's unpaid token is given back, nothing else), RF-6 (128 member connections either way,
# 2 reserved per member, a third or fourth only from the rest; 2 per relay, 4 relays; plus the 48 pending: 184), RF-7
# (relay: 128 circuits per peer, 64 reservations and connections per IP, 130 service streams per peer and direction).
# Why: libp2p's connection limiter counts every circuit under its relay's IPv4 address, 8 at most, so the 8th member
# behind one relay is refused both ways (plan §1; reproduced 2026-11-24 on df31531: 7 of 10 peers up). Spec §16.1 rows
# « connexions », « connexions non vérifiées », « connexions par IP (membres) », « circuits par relais »; model
# docs/protocol/tla/RelayFanout.tla; bounds in protocol/limits.go pinned by protocol/testdata/limits.json.
# Go mutants (scripts/netsim/mutants.toml, block RF1): MG1-MG6 are frozen here by their tuple and text only; their
# anchors are step 2's code, so the entries are added at step 2 with exactly the tuples of criterion `mutants`.
# Step 2 adjusts anchors only, never a test or its text.
# No gate runs another. Wall-clock criteria take the machine with `heavy.sh --exclusive`.
# Caps (rule G-1): 30 + (360 + 30) + (180 + 60 + 30) + 300 + 420 + (30 + 30 + 600) + 300 + (300 + 120) + (240 + 600)
# = 3630 s <= 3660 s (max_minutes 61).
max_minutes = 61
raw_results = ["docs/plans/2026-11-24-rf1-relay-fanout.md", "docs/protocol/tla/RelayFanout.tla", "gates/RF1/*"]

[[criteria]]
