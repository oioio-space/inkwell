[[criteria]]
# The model (README "RelayFanout"): three sound runs, exhaustive with liveness (Flood: a stranger floods the members'
# origin and a second one forever, a Byzantine member, the node dials; Inbound: members connect inbound only, a finite
# stranger; Mixed: members behind a relay and behind a home router, the relay flooded), sixteen mutant runs each caught
# by its named property (MF12 and MF13 are the token bucket's: a blind refund, round 1's fixed window) and seven
# witnesses reached, the plan's residual among them: exactly 26 ✓, no ✗. Measured 2026-11-24: 77 s with the Alloy leg
# (Flood 35 s). Structure: the sound rule operators of RelayFanout.tla are the ones the mutants override.
id = "tla"
command = '''out=$(INKWELL_TLA_ONLY='^RF1' INKWELL_PERF_LOAD_WAIT=120 timeout -k 10 360 ./scripts/heavy.sh --exclusive ./scripts/tla-check.sh 2>&1) || { echo "$out" | tail -40; exit 1; }
[ "$(echo "$out" | grep -c '✓')" -eq 26 ] || { echo "want 26 ✓, got $(echo "$out" | grep -c '✓')"; echo "$out" | tail -20; exit 1; }
! echo "$out" | grep -q '✗' || { echo "$out" | grep '✗'; exit 1; }
for n in RF1Flood RF1Inbound RF1Mixed; do
  echo "$out" | grep -qxF -- "✓ $n: no error (exhaustive, liveness checked)" || { echo "sound run missing or failing: $n"; exit 1; }
done
while read -r m p; do
  echo "$out" | grep -qxF -- "✓ RF1$m: violation detected ($p)" || { echo "mutant or witness not caught by its named property: $m ($p)"; exit 1; }
done <<'M'
PerIPCount InJustified
PerIPCountLive MembersEventuallyUp
OutboundCharged OutNeverRefused
OutboundStarved MembersEventuallyUp
NoDeadline MembersEventuallyUp
NoOriginQuota OriginBound
NoGlobalQuota GlobalBound
NoToken RateBound
NoRefund MembersSpendNoRate
SharedCap OutNeverRefused
AuthShared AuthNeverRefused
NoShare SharesKept
NoMemberCap MemberCapBound
RefundUnheld RateBound
WindowRefill RateBound
WitnessInRefused NoInRefusal
WitnessRateRefused NoRateRefusal
WitnessQuotaFull NoFullQuota
WitnessPassage NoPassage
WitnessSurplus NoSurplus
WitnessByzRefused NoByzRefusal
WitnessPaidPending NoPaidPending
WitnessResidual MembersEventuallyUp
M
timeout -k 10 30 python3 -I - <<'PY'
import pathlib, re, sys
t = pathlib.Path("docs/protocol/tla/RelayFanout.tla").read_text()
want = [r"^OriginLoad\(o\) == PendOn\(o\) ", r"^GlobalLoad == Pending ", r"^SysCap == MemberCap \+ Q ", r"^Room\(m\) == IF est\[m\] < 2 THEN EstAll < MemberCap ELSE est\[m\] < PerCap /\\ EstAll \+ Owed\(m\) < MemberCap$", r"^OutOK\(m\) == Room\(m\) /\\ Total < SysCap ", r"^AuthOK\(m\) == est\[m\] = 2 \\/ Room\(m\) ", r"^Expires == TRUE ", r"^UseOrigin == TRUE ", r"^UseGlobal == TRUE ", r"^UseToken == TRUE ", r"^RefillStep\(o\) ==", r"^RefundStep\(m\) ==", r"^RateBound ==", r"^SharesKept ==", r"^InJustified ==", r"^OutNeverRefused ==", r"^MembersEventuallyUp =="]
bad = [w for w in want if not re.search(w, t, re.M)]
sys.exit(f"RelayFanout structure: {bad}" if bad else 0)
PY'''

