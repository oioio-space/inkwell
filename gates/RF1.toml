import pathlib, sys
bad = []
spec = pathlib.Path("docs/protocol/spec.md").read_text()
i = spec.find("\n### 16.1 ")
j = spec.find("\n### 16.2 ", i)
s16 = spec[i:j] if i >= 0 and j > i else ""
for w in ["| connexions | 2 par pair en régime, 4 au plus pendant un passage", "dont 2 réservées à chacun des 63 autres membres, une troisième ou une quatrième seulement sur le reste", "limites système et par sens de libp2p : 184", "| connexions non vérifiées (avant la poignée de main, ou non-membre identifié) | 16 par relais d'un circuit, désigné par son PeerID authentifié, jamais par son adresse IP ; 8 par adresse IPv4 (/32)", "48 en tout ; 15 s au plus", "seau de 16 jetons par origine, 1 de plus par 5 s", "lui est rendu à sa poignée de main s'il est encore dû", "| connexions par IP (membres) | aucune borne par adresse ni par relais", "| circuits par relais (relais inkwell) | 128 circuits par pair (64 × 2)", "184 connexions : 184 Mio des 256 Mio"]:
    if w not in s16:
        bad.append(f"spec §16.1 lacks {w!r}")
