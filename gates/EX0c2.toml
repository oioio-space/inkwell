    if not list((root / "invalid").glob(f"*{word}*.json")) and not list((root / "refused").glob(f"*{word}*.json")):
        bad.append(f"no invalid or refused vector *{word}*")
sys.exit(f"EX0c2 mutants: entries or vectors missing or wrong: {bad}" if bad else 0)
PY
timeout -k 10 400 ./scripts/heavy.sh python3 -I scripts/netsim/mutants.py EX0c2 MV1 MV2 MV3 MV4 MV5 MV6 MV7 MV8 MV9 MV10 MV11 MV12'''

