[[criteria]]
# A rule test that asserts nothing must fail the gate. Block EX0c2's vitest mutants MV1..MV12 (MV13 is `e2e-mutant`'s) (scripts/netsim/mutants.toml,
# written at step 2 with the code, plan §4; MV12 is P-6's second) each break one rule; each entry names the exact title of its rule's test
# (`name`), so only that test failing is a catch. The panel vectors exist, valid and invalid.
id = "mutants"
command = '''set -eu
timeout -k 10 20 python3 -I - <<'PY'
import pathlib, sys, tomllib
ms = {m["id"]: m for m in tomllib.load(open("scripts/netsim/mutants.toml", "rb"))["mutant"] if m.get("block") == "EX0c2"}
bad = []
RULE = {f"MV{i}": i for i in range(1, 12)} | {"MV12": 6}  # MV12: readOnly read from the workspace, not the grid
for mid, i in RULE.items():
    m = ms.get(mid, {})
    if (m.get("kind") != "vitest" or m.get("retired") or not m.get("test", "").startswith("frontend/src/")
            or not m.get("name", "").startswith(f"EX0c2 P-{i} ")):
        bad.append(mid)
root = pathlib.Path("frontend/src/extensions/testdata/manifests")
if not list((root / "valid").glob("*panel*.json")):
