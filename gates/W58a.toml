# FROZEN 2026-11-14, red witnesses in gates/W58a/WITNESSES.md. Acceptance for block W58a (a project that does not name this device is read-only and never
# offers a broken invitation; no take-over, no change of project identity). Rigour: standard. Plan:
# docs/plans/2026-11-14-w58a-foreign-read-only.md (N-1..N-4, N-10, N-15, N-16). ADR 0043, part 1. The frozen
# gates/W58.toml (revision 6 of W58) stays untouched and superseded by this gate and gates/PC1.toml; scripts/gate.py
# has no notion of a superseded gate, so the convention is these headers and gates/W58/REVIEW.md « Round 8 »:
# `gate -- W58` is not run any more. Every long command is `timeout -k 10 N ./scripts/heavy.sh …` (the timeout
# covers the wait for a slot). `e2e:build` (Vite and Go builds, which the task does not cap itself) and the mise
# tasks of `regression` run inside `scripts/heavy.sh`, which bounds memory; the capped commands they call reuse that
# slot (heavy.sh: nested calls reuse the slot they are in), so no lock is taken twice. No nested gate. To freeze: each command run red for the right reason
# (gates/W58a/WITNESSES.md), total measured ≤ 45 min. Reviewed by Codex (ACCEPT WITH CHANGES, applied): REVIEW.md « Round 9 ».
raw_results = ["docs/plans/2026-11-14-w58a-foreign-read-only.md", "docs/adr/0043-foreign-project.md", "docs/objectif-en-cours.md", "gates/W58a/*"]

[[criteria]]
# Documents: each rule id has its row in the plan, each catalogue key of the plan exists in fr.json, the ADR is
# accepted (part 1), W64 is closed (W58 stays open until PC1), and no take-over key is left in the catalogue.
id = "docs"
command = "python3 -I -c \"import json,re,sys,pathlib; plan=pathlib.Path('docs/plans/2026-11-14-w58a-foreign-read-only.md').read_text(); fr=json.load(open('frontend/src/i18n/fr.json')); bad=[f'plan row N-{i}' for i in (1,2,3,4,10,15,16) if not re.search(rf'^\\| N-{i} \\|',plan,re.M)]; keys=['foreign.notNamed','foreign.removed','foreign.ask','share.host.notMember','share.host.loading','error.host','share.join.foreignHelp']; bad+=[f'fr.json still has {k}' for k in fr if k.startswith('foreign.takeOver')]; bad+=['foreign.notNamed does not say the text can be copied'] if 'copier' not in fr.get('foreign.notNamed','') else []; bad+=[f'fr.json {k}' for k in keys if k not in fr]; bad+=['error.host still carries {reason}'] if '{reason}' in fr.get('error.host','') else []; adr=pathlib.Path('docs/adr/0043-foreign-project.md').read_text(); bad+=['ADR 0043 part 1 not accepted'] if not re.search(r'^status: accepted',adr,re.M) else []; ex=pathlib.Path('docs/exigences.md').read_text(); bad+=[f'exigences {w} not closed' for w in ('W64',) if not re.search(rf'^\\| {w} \\|.*✅',ex,re.M)]; sys.exit(f'W58a docs: {bad}' if bad else 0)\""

[[criteria]]
# N-1, N-2, N-16 in Go: the run succeeds and every named test passes.
id = "go"
command = "out=$(timeout -k 10 1200 ./scripts/heavy.sh go test -count=1 -race -v -run 'TestStanding|TestFirstLaunchCreatorIsAdmin|TestNotMemberInviteRefusedByKey|TestInviteDemotedBetweenChecksRefusedByKey|TestReplaceFailureAtEachStep|TestOnlyAnAdminInvites' ./internal/app/ 2>&1) || { echo \"$out\" | tail -40; exit 1; }; for t in TestStandingFromList TestStandingMemberAfterJoin TestStandingNeverOldAfterRolesEvent TestFirstLaunchCreatorIsAdmin TestNotMemberInviteRefusedByKey TestInviteDemotedBetweenChecksRefusedByKey TestReplaceFailureAtEachStep TestOnlyAnAdminInvites; do echo \"$out\" | grep -q -- \"--- PASS: $t\" || { echo \"missing or not passing: $t\"; exit 1; }; done"

[[criteria]]
# The mutant runner's new `expect` field (plan « Mutants »): its own tests, then every W58a entry exists with a test
# and an expect text that starts with its rule tag.
id = "mutant-tool"
command = "timeout -k 10 300 ./scripts/heavy.sh python3 -m unittest scripts/netsim/mutants_test.py && python3 -I -c \"import tomllib,re,sys; ms={m['id']:m for m in tomllib.load(open('scripts/netsim/mutants.toml','rb'))['mutant'] if m.get('block')=='W58a'}; bad=[i for i in ('MW1','MW2','MW3','MW4') if i not in ms or ms[i].get('kind')!='go' or not ms[i].get('test') or not re.match(r'N-\\d+ ',ms[i].get('expect',''))]; sys.exit(f'W58a mutant entries missing or without test and expect: {bad}' if bad else 0)\""

[[criteria]]
# Go mutants MW1..MW4, each applied to a copy that compiles and caught by its named test failing with its expect
# text in that test's own `go test -json` output (a build error, a timeout or another failing test is not a catch).
id = "mutants"
command = "timeout -k 10 2400 mise run netsim:mutants -- W58a"

[[criteria]]
# N-1..N-4, N-15 in the webview and their in-test mutants: zero failed tests, and every named test passed (read
# back from the Vitest JSON report).
id = "frontend"
command = "cd frontend && timeout -k 10 900 ../scripts/heavy.sh pnpm exec vitest run --configLoader runner --reporter=json --outputFile=../.task/w58a-fe.json -t 'W58a '; rc=$?; cd .. && python3 -I -c \"import json,sys; rc=int(sys.argv[1]); r=json.load(open('.task/w58a-fe.json')); ok={a['title'] for f in r['testResults'] for a in f['assertionResults'] if a['status']=='passed'}; need=['W58a a refusal shows its sentence, never Go text','W58a the editor is locked until standing and role are known','W58a not a member: read-only, one sentence, one action','W58a removed: its own sentence','W58a read-only text can be selected and copied','W58a invite capability: loading','W58a invite capability: admin','W58a invite capability: non-admin','W58a invite capability: not a member','W58a ask for an invitation opens the join dialog','W58a the banner offers nothing else','W58a a join asks for the standing again']+[f'W58a mutant {m} is caught' for m in ('N-2 raw error','N-3 access','N-3 lock before the rights','N-4 renew','N-15 second action')]; miss=[n for n in need if n not in ok]; sys.exit(f'W58a frontend: exit {rc}, failed {r[\\\"numFailedTests\\\"]}, failed suites {r[\\\"numFailedTestSuites\\\"]}, missing {miss}' if rc or r['numFailedTests'] or r['numFailedTestSuites'] or miss else 0)\" $rc"

[[criteria]]
# N-10 (and N-2 across the real bridge), once: the candidate is built first (capped), retries 0; Playwright's exit code is
# kept, the report must hold zero global errors, zero unexpected, flaky or skipped tests, and the two titles.
id = "e2e"
command = "timeout -k 10 1500 ./scripts/heavy.sh mise run e2e:build && cd frontend && timeout -k 10 1200 ../scripts/heavy.sh ./node_modules/.bin/playwright test e2e/foreign-project.spec.ts --retries=0 --reporter=json > ../.task/w58a-e2e.json; rc=$?; cd .. && python3 -I -c \"import json,sys; rc=int(sys.argv[1]); r=json.load(open('.task/w58a-e2e.json')); st=r.get('stats',{}); ok=set()\nfor s in r['suites']:\n  stack=[s]\n  while stack:\n    x=stack.pop(); stack+=x.get('suites',[])\n    for sp in x.get('specs',[]):\n      if sp['ok'] and all(t['status']=='expected' for t in sp['tests']): ok.add(sp['title'])\nneed=['W58a-E2E a second profile reads and cannot invite','W58a-E2E a non-member asks for an invitation, joins and can write']; miss=[n for n in need if n not in ok]; bad=rc or r.get('errors') or st.get('unexpected') or st.get('flaky') or st.get('skipped') or miss; sys.exit(f'W58a e2e: exit {rc}, errors {len(r.get(\\\"errors\\\",[]))}, stats {st}, missing {miss}' if bad else 0)\" $rc"

[[criteria]]
# No regression: every frontend check, and the flows that create, join and list people; both capped, wait included.
id = "regression"
command = "timeout -k 10 1500 ./scripts/heavy.sh mise run fe:check && timeout -k 10 1800 ./scripts/heavy.sh mise run e2e -- e2e/join.spec.ts e2e/collab.spec.ts e2e/people.spec.ts"

[[criteria]]
# Interface change (banner with one action, disabled invite row, the join from the banner): ux-walkthrough report
# with light and dark captures; the verdict line must read "Verdict: ship".
id = "ux-walkthrough"
command = "test -s gates/W58a/UX.md && grep -Eq '^Verdict: ship' gates/W58a/UX.md"

[[criteria]]
id = "simplify-report"
command = "test -s gates/W58a/SIMPLIFY.md"

[[criteria]]
# N-15, an extra to the tests: the text of the block holds no take-over and no project-change entry point.
id = "no-take-over"
command = "python3 -I -c \"import sys,pathlib; bad=[]; files={'frontend/src/net/WailsNetworkAdapter.ts':('projectChanged','pause(','resume('),'frontend/src/workspace/workspace.svelte.ts':('takeOver','#joinQuiet','.pause(','.resume(','projectChanged'),'frontend/src/ui/people/AccessBanner.svelte':('takeOver','take-over','<dialog'),'internal/app/session.go':('TakeOver',),'internal/app/invites.go':('takeOver','JoinResult'),'internal/app/persist.go':('trust-archive',)}; bad=[f'{f}: {n}' for f,ns in files.items() for n in ns if n in pathlib.Path(f).read_text()]; sys.exit(f'W58a take-over left: {bad}' if bad else 0)\""
