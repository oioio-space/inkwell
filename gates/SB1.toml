[[criteria]]
# Mutants (scripts/netsim/mutants.toml, block SB1, kind go; the runner catches only a real "--- FAIL"): SB1a RLIMIT_CORE {1,1}->{0,0}; SB1b RLIMIT_CORE entry removed;
# SB1c Max unlimited; SB1d signal.Ignore(SIGXFSZ) removed; SB1e ignores SIGXCPU instead; SB1f seccomp ABI action KILL_PROCESS->ERRNO; SB1g failure(): SIGSYS branch
# removed; SB1h failureKinds ErrBlocked row removed; SB1i memory.max not written; SB1j memory.oom.group not set; SB1k memory.swap.max not 0; SB1l cgroup
# failure returns an error instead of falling back. Each turns a named test red. Red now: the entries do not exist.
id = "mutants"
command = '''for m in SB1a SB1b SB1c SB1d SB1e SB1f SB1g SB1h SB1i SB1j SB1k SB1l; do grep -q "id = \"$m\"" scripts/netsim/mutants.toml || { echo "missing mutant $m"; exit 1; }; done && mise run netsim:mutants -- SB1'''

[[criteria]]
# No regression: the sidecar, typst and app packages (every test, uncached), the frontend gate, lint, the declared environment, and the frozen gate of the
# block that introduced the sandbox (L1: syscall confinement, tools-free run, arm64 seccomp trace).
id = "regression"
command = '''./scripts/heavy.sh timeout 1800 go test -count=1 ./internal/sidecar/... ./internal/typst/... ./internal/app/... && mise run fe:check && mise run lint && mise run lint:env && mise run gate -- L1'''

