id = "falsify"
command = '''out=$(./scripts/heavy.sh timeout 1800 python3 -m unittest -v scripts/perf/regression_falsify_test.py 2>&1) || { echo "$out" | tail -40; exit 1; }; if echo "$out" | grep -q -- '\.\.\. skipped'; then echo "skipped tests"; exit 1; fi; for t in test_falsify_reused_binary test_falsify_ignored_overlay test_falsify_altered_production_flags test_falsify_dropped_production_verdict test_falsify_inconclusive_as_pass test_falsify_missing_funcalign test_falsify_shared_pad_vectors test_session_records_identities_and_offsets; do echo "$out" | grep -q -- "^$t (" || { echo "missing or not run: $t"; exit 1; }; done'''

[[criteria]]
# The self-test with real processes: an injected x1.2 slowdown (environment) and a +5 % slowdown in code are flagged, the
# reverse gain passes, and the two pure-layout mutants (internal/transport/mux at default alignment with one unused
# 32-byte function in front of it, and the same function in internal/transport, linked before mux: the C5S mechanism)
