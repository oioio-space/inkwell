id = "selftest"
command = '''out=$(./scripts/heavy.sh --exclusive timeout 2400 python3 scripts/perf/regression.py --self-test 2>&1) || { echo "$out" | tail -40; exit 1; }; echo "$out" | grep -q 'regression-guard self-test passed: layout-randomized (x1.2 flagged, code +5 % flagged, gain passed, layout mutants (package, dependency) effective and passed)' '''

[[criteria]]
# No regression: every Python test of the tooling, the gate harness and anti-weakening self-tests, and the frozen L0
# `regression-guard` command verbatim on the current tree, which includes block C5S (its only flag was the layout case).
