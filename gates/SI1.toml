# Frozen acceptance for block SI1 (W33, the honest sync indicator), written before the code. Spec:
# docs/plans/2026-11-08-netsim-impaired-plan.md, sections "Honest sync indicator: executable specification" (the
# state rule per peer and globally, the observables, the test) and "Honest sync indicator: UX decisions" (D-SI1..7).
# Formal model: docs/protocol/tla/SyncIndicator.tla (PeerHonest, GlobalHonest, EventuallySynced; seven mutants).
#
# The rule:
#   SI1-1  frontend/src/net/syncIndicator.ts exports pure peerSyncState(observed) and globalSyncState(states), with
#          the state rule of the spec (offline, checking, behind, sending, synced; worst first, an empty set is never
#          synced); the adapter keeps each peer's last heads per document (decoded before enforcement, cleared on
#          peer-disconnected); Workspace.status derives from it, never from the peer count;
#   SI1-2  the display layer (D-SI5): a non-synced state shows at once; « Synchronisé » only after the true state
#          has been synced for SyncedHoldMs = 1000 ms without a break, and it leaves at once;
#   SI1-3  wording (D-SI1..4, D-SI7): « Envoi en cours (n) », n = connected people without all my changes;
#          « Pas encore à jour »; « Vérification… »; « Synchronisé »; « Lien lent » added after 2 s of
#          oldestPendingMs; the people popover gives each person's state, « Hors ligne » for an offline member.
raw_results = ["docs/plans/2026-11-08-netsim-impaired-plan.md", "docs/objectif-en-cours.md", "gates/SI1/*"]

[[criteria]]
# Model: SyncIndicator (one and two peers) exhaustive with liveness, every mutant caught (M-PeerCount, M-IgnoreRemote,
# M-SentIsAcked, M-QueueOnly, M-EveryVacuous, M-AnyPeer, M-NoRuleL); every other model of the directory too.
id = "model-SyncIndicator"
command = "mise run tla"

[[criteria]]
# Tests, each named after the rule it proves; all must exist and pass (the JSON report is checked by title, so a
# renamed or skipped test fails the criterion):
#  - the fast-check model-based test of the spec: three real automerge-repo Repos behind real WailsNetworkAdapters
#    over a step-by-step SimNet, commands Edit/Deliver/Lose/Resync/Down/Up/Links, safety oracle after every command,
#    liveness after the quiet phase, 200 runs, seed printed;
#  - unit tests of the display layer and wording, in virtual time (vi.useFakeTimers).
id = "rule-SI1-tests"
command = "cd frontend && ../scripts/heavy.sh timeout 900 pnpm exec vitest run --configLoader runner --reporter=json --outputFile=../.task/si1-vitest.json src/net/syncIndicator.model.test.ts src/net/syncIndicator.test.ts && cd .. && python3 -I -c \"import json,sys; r=json.load(open('.task/si1-vitest.json')); ok={a['title'] for f in r['testResults'] for a in f['assertionResults'] if a['status']=='passed'}; need=['W33 sync indicator follows SyncIndicator.tla: PeerHonest, GlobalHonest, EventuallySynced','SI1-2 Synchronisé only after SyncedHoldMs of true synced','SI1-2 a non-synced state is shown at once','SI1-2 Synchronisé leaves at once when it stops being true','SI1-3 n counts the connected people missing my changes','SI1-1 behind wins over sending','SI1-1 no connected peer is never Synchronisé','SI1-3 an offline member is Hors ligne in the popover','SI1-3 Lien lent after 2 s of oldestPendingMs']; miss=[n for n in need if n not in ok]; sys.exit(f'SI1 tests missing or not passing: {miss}' if miss else 0)\""

[[criteria]]
# Code mutants (scripts/netsim/mutants.toml, block SI1, kind "vitest": a new kind of scripts/netsim/mutants.py that
# runs one Vitest file in the copy and counts a mutant caught only on a real test failure, not a type or import
# error). Each must turn its test red: the seven model mutants as substitutions on syncIndicator.ts (M-PeerCount is
# today's rule, peerCount > 0 => synced), plus SI1-HoldNone (« Synchronisé » shown at once), SI1-HoldLeaks
# (« Synchronisé » kept for SyncedHoldMs after it stops being true) and SI1-CountMessages (n from pendingMsgs).
id = "rule-SI1-mutants"
command = "mise run netsim:mutants -- SI1"

[[criteria]]
# Wiring: the peer-count rule is gone and every locale has the new wordings.
id = "rule-SI1-wiring"
command = "! grep -q 'if (peerCount > 0) return \"synced\"' frontend/src/workspace/workspace.svelte.ts && python3 -I -c \"import json,glob,sys; bad=[(f,k) for f in glob.glob('frontend/src/i18n/*.json') for k in ('status.sending','status.behind','status.checking','status.slow','people.offline') if k not in json.load(open(f))]; sys.exit(f'missing wordings: {bad}' if bad else 0)\""

[[criteria]]
# End to end on the impaired netsim, NI-1 (5) and NI-2 (6), seeds 1-3: new clause SI1 « never Synchronisé while a
# token of the other side is missing », sampled from the header's displayed state through __inkwellLinks' store at
# every token check; it must pass on every seed, and the scenarios' other clauses keep their current status.
id = "NI-SI1"
command = "NETSIM_SCENARIOS='5 6' NETSIM_SEEDS='1 2 3' mise run e2e:netsim:impaired && python3 -I -c \"import json,sys; bad=[(n,s,c.get('status')) for n in (5,6) for s in (1,2,3) for c in [{x['id']:x for x in json.load(open(f'.task/netsim/results/{n}-s{s}.json'))['clauses']}.get('SI1',{})] if c.get('status')!='pass']; sys.exit(f'SI1 clause: {bad}' if bad else 0)\""

[[criteria]]
# No regression: every frontend check and test, and the default netsim scenarios.
id = "regression"
command = "mise run fe:check && NETSIM_SCENARIOS='1 2 3 4' mise run e2e:netsim"

[[criteria]]
# Interface change: the ux-walkthrough report (skill ux-walkthrough, agent ux-tester) with light and dark captures
# of the header, status bar and people popover in each state, compared with the neighbouring screens.
id = "ux-walkthrough"
command = "test -s gates/SI1/UX.md"

[[criteria]]
id = "simplify-report"
command = "test -s gates/SI1/SIMPLIFY.md"
