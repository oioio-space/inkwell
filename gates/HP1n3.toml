[[criteria]]
# Plan §7 and §9: scenario 5 « bad Wi-Fi that changes », seeds 20771, 20772 (the reproduction seed), 20773, once each,
# strict: every clause passes, C3 counted from the baseline and the new C3a among them.
id = "netsim"
command = '''rm -f .task/netsim/results/5-s2077[123].json && timeout -k 10 240 ./scripts/heavy.sh mise run e2e:build && { NETSIM_SCENARIOS=5 NETSIM_SEEDS="20771 20772 20773" NETSIM_EXPECT=strict INKWELL_E2E_BROWSER=chromium INKWELL_PERF_LOAD_WAIT=180 timeout -k 10 1500 ./scripts/heavy.sh --exclusive ./scripts/netsim/run.sh; rc=$?; python3 -I - "$rc" <<'PY'
import json, pathlib, sys
need = {"C1", "C2", "C3", "C3a", "C4", "C5", "C6", "SI1"}
bad = []
for seed in (20771, 20772, 20773):
    p = pathlib.Path(f".task/netsim/results/5-s{seed}.json")
    if not p.exists():
        bad.append(f"{p.name} missing")
        continue
    r = json.loads(p.read_text())
    got = {c["id"] for c in r["clauses"]}
    red = [f'{c["id"]} {c["status"]}: {c.get("measured", "")[:80]}' for c in r["clauses"] if c["status"] != "pass"]
    if r.get("expect") != "strict" or not need <= got or red:
        bad.append(f"{p.name}: expect {r.get('expect')}, missing {sorted(need - got)}, red {red}")
if int(sys.argv[1]) or bad:
    sys.exit(f"HP1n3 netsim: exit {sys.argv[1]}, {bad}")
PY
}'''

