version: 2
project_name: "inkwell"
builds:
  - main: ./cmd/inkwell
    binary: "inkwell"
    env: ["CGO_ENABLED=0"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  use: github-native
