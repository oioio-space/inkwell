# Mutants of the impaired-network tests (docs/plans/2026-11-08-netsim-impaired-plan.md section 4).
# A mutant is a text substitution (anchor -> replacement) applied to a copy of the tree; it must turn
# the named clause red. An anchor that is not found exactly once is itself a failure, as in
# scripts/alloy_check.py. Runner: scripts/netsim/mutants.py (`mise run netsim:mutants -- NI0`).
#
#   kind "go"   run `go test PKG -run TEST` in the copy; red = the test fails (the Go agent's
#               G-0 test names the clause; its output is printed).
#   kind "e2e"  build the copy's binaries (server and relay), run scenario SCENARIO (seed 1, VARIANT;
#               required for scenario 8) against them (NETSIM_BIN_DIR) and require results/<run>.json
#               to show CLAUSE as "fail" (a measured miss: a harness error does not count).
#   A "go" mutant is caught only by a real test failure ("--- FAIL"), never by a build failure or a
#   timeout.
# An edit with create = true writes a new file (`after` is its content).

